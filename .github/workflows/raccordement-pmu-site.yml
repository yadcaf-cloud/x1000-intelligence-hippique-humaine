name: "X1000 - Raccordement PMU - Validation complete"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x1000-validation-pmu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: "PMU France - M1-M5 - Site isole"

    if: >-
      github.repository == 'yadcaf-cloud/x1000-intelligence-hippique-humaine' &&
      github.ref == 'refs/heads/fix/audit-general-pmu-20261118' &&
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      X1000_SORTIE: "sortie"
      X1000_ENTREES_MOTEURS: "entrees_moteurs"

    defaults:
      run:
        shell: bash

    steps:
      - name: Recuperer la branche autorisee
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier depot et branche
        run: |
          set -euo pipefail

          test "$GITHUB_REPOSITORY" = \
            "yadcaf-cloud/x1000-intelligence-hippique-humaine"

          test "$GITHUB_REF" = \
            "refs/heads/fix/audit-general-pmu-20261118"

          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"

          echo "BRANCHE_AUTORISEE"

      - name: Creer un environnement de test vierge
        run: |
          set -euo pipefail

          dossier="$(mktemp -d \
            "$RUNNER_TEMP/x1000-validation-XXXXXXXX")"

          echo "X1000_TEST_DIR=$dossier" >> "$GITHUB_ENV"

          for fichier in \
            collecte_pmu.py \
            adapter_collecte_tableau.py \
            raccorder_moteurs_x1000.py \
            verifier_raccordement_moteurs.py \
            preparer_site_pmu.py \
            index.html \
            tableau-pmu.html
          do
            if [ ! -s "$fichier" ]; then
              echo "::error::SOURCE_ABSENTE: $fichier"
              exit 1
            fi

            cp -- "$fichier" "$dossier/$fichier"
          done

          python - "$dossier" <<'PY'
          import ast
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          scripts = sorted(root.glob("*.py"))

          if len(scripts) != 5:
              raise SystemExit("NOMBRE_SCRIPTS_INATTENDU")

          for path in scripts:
              ast.parse(
                  path.read_text(encoding="utf-8"),
                  filename=path.name
              )
              print("SYNTAXE_OK:", path.name)

          print("ENVIRONNEMENT_VIERGE_OK")
          PY

      - name: Verifier et copier les six sources
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          origine = Path("entrees_moteurs")
          destination = (
              Path(os.environ["X1000_TEST_DIR"])
              / "entrees_moteurs"
          )
          destination.mkdir(parents=True, exist_ok=False)

          for nom in ("M1", "M2", "M3", "M4", "M5", "X1000"):
              fichier = origine / f"{nom}.json"

              if not fichier.is_file() or not fichier.stat().st_size:
                  raise SystemExit(
                      f"SOURCE_REELLE_ABSENTE: {fichier}"
                  )

              if fichier.is_symlink():
                  raise SystemExit(
                      f"LIEN_SYMBOLIQUE_INTERDIT: {fichier}"
                  )

              data = json.loads(
                  fichier.read_text(encoding="utf-8")
              )

              if not isinstance(data, dict):
                  raise SystemExit(f"FORMAT_INVALIDE: {nom}")

              if data.get("moteur") != nom:
                  raise SystemExit(f"IDENTITE_INVALIDE: {nom}")

              decisions = data.get("decisions")

              if not isinstance(decisions, list) or not decisions:
                  raise SystemExit(f"DECISIONS_ABSENTES: {nom}")

              shutil.copyfile(
                  fichier,
                  destination / f"{nom}.json"
              )

              print("SOURCE_COPIEE:", nom, len(decisions))

          print("SIX_SOURCES_PRESENTES")
          print("PROVENANCE_EXTERNE_NON_AUTHENTIFIEE")
          PY

      - name: Collecter les courses PMU France
        run: |
          set -euo pipefail
          cd "$X1000_TEST_DIR"

          python collecte_pmu.py

          test -s sortie/publication_courses.json || {
            echo "::error::COLLECTE_PMU_ABSENTE"
            exit 1
          }

          echo "COLLECTE_PMU_TERMINEE"

      - name: Adapter les courses au tableau
        run: |
          set -euo pipefail
          cd "$X1000_TEST_DIR"

          python adapter_collecte_tableau.py

          test -s sortie/recherche_courses_du_jour.json || {
            echo "::error::ADAPTATION_ABSENTE"
            exit 1
          }

          echo "ADAPTATION_TERMINEE"

      - name: Verifier coherence PMU et candidats
        run: |
          set -euo pipefail
          cd "$X1000_TEST_DIR"

          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          today = datetime.now(
              ZoneInfo("Europe/Paris")
          ).date().isoformat()

          def lire(nom):
              return json.loads(
                  Path(nom).read_text(encoding="utf-8")
              )

          pmu = lire("sortie/publication_courses.json")
          candidats = lire(
              "sortie/recherche_courses_du_jour.json"
          )

          if pmu.get("schema") != "x1000-pmu-france-v1":
              raise SystemExit("SCHEMA_PMU_INVALIDE")

          if candidats.get("schema") != "x1000-candidates-v1":
              raise SystemExit("SCHEMA_CANDIDATS_INVALIDE")

          if pmu.get("date_pmu") != today:
              raise SystemExit("DATE_PMU_OBSOLETE")

          if candidats.get("date") != today:
              raise SystemExit("DATE_CANDIDATS_OBSOLETE")

          if pmu.get("source") != "PMU TurfInfo":
              raise SystemExit("SOURCE_PMU_INVALIDE")

          if candidats.get("source") != "PMU TurfInfo":
              raise SystemExit("SOURCE_CANDIDATS_INVALIDE")

          courses = pmu.get("courses")
          selection = candidats.get("courses_candidates")

          if not isinstance(courses, list) or not courses:
              raise SystemExit("AUCUNE_COURSE_PMU")

          if not isinstance(selection, list):
              raise SystemExit("CANDIDATS_INVALIDES")

          ids = []
          for course in courses:
              if not isinstance(course, dict):
                  raise SystemExit("COURSE_INVALIDE")

              cid = course.get("course_id")
              if not isinstance(cid, str):
                  raise SystemExit("COURSE_ID_INVALIDE")

              if course.get("pays_verifie") != "FR":
                  raise SystemExit(f"COURSE_HORS_FRANCE: {cid}")

              ids.append(cid)

          ids_candidats = []
          for course in selection:
              if not isinstance(course, dict):
                  raise SystemExit("CANDIDAT_INVALIDE")

              cid = course.get("course_id")
              if not isinstance(cid, str):
                  raise SystemExit("CANDIDAT_ID_INVALIDE")

              if course.get("pays_verifie") != "FR":
                  raise SystemExit(f"CANDIDAT_HORS_FRANCE: {cid}")

              ids_candidats.append(cid)

          if len(ids) != len(set(ids)):
              raise SystemExit("DOUBLON_COURSES")

          if len(ids_candidats) != len(set(ids_candidats)):
              raise SystemExit("DOUBLON_CANDIDATS")

          if set(ids) != set(ids_candidats):
              raise SystemExit("COURSES_CANDIDATS_NON_ALIGNEES")

          print("COURSES_FRANCE:", len(ids))
          print("COHERENCE_PMU_CANDIDATS_OK")
          PY

      - name: Produire la publication des moteurs
        run: |
          set -euo pipefail
          cd "$X1000_TEST_DIR"

          test ! -e sortie/publication_moteurs.json
          test ! -e data/publication_moteurs.json

          python raccorder_moteurs_x1000.py

          test -s sortie/publication_moteurs.json || {
            echo "::error::PUBLICATION_MOTEURS_ABSENTE"
            exit 1
          }

          echo "PUBLICATION_MOTEURS_PRODUITE"

      - name: Valider les decisions M1-M5 et X1000
        run: |
          set -euo pipefail
          cd "$X1000_TEST_DIR"

          python verifier_raccordement_moteurs.py

          echo "VALIDATION_MOTEURS_TERMINEE"

      - name: Preparer le site isole
        run: |
          set -euo pipefail
          cd "$X1000_TEST_DIR"

          test ! -e site_pmu

          python preparer_site_pmu.py

          for fichier in \
            site_pmu/index.html \
            site_pmu/tableau-pmu.html \
            site_pmu/data/publication_courses.json \
            site_pmu/data/publication_moteurs.json \
            site_pmu/data/etat_publication.json \
            site_pmu/sortie/recherche_courses_du_jour.json
          do
            test -s "$fichier" || {
              echo "::error::RESSOURCE_SITE_ABSENTE: $fichier"
              exit 1
            }
          done

          echo "SITE_ISOLE_PREPARE"

      - name: Verifier les publications du site
        run: |
          set -euo pipefail
          cd "$X1000_TEST_DIR"

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          fichiers = (
              (
                  "sortie/publication_courses.json",
                  "site_pmu/data/publication_courses.json",
              ),
              (
                  "sortie/publication_moteurs.json",
                  "site_pmu/data/publication_moteurs.json",
              ),
              (
                  "sortie/recherche_courses_du_jour.json",
                  "site_pmu/sortie/recherche_courses_du_jour.json",
              ),
              ("index.html", "site_pmu/index.html"),
              ("tableau-pmu.html", "site_pmu/tableau-pmu.html"),
          )

          for original, copie in fichiers:
              a = Path(original).read_bytes()
              b = Path(copie).read_bytes()

              if hashlib.sha256(a).digest() != hashlib.sha256(b).digest():
                  raise SystemExit(f"COPIE_DIFFERENTE: {copie}")

              print("COPIE_IDENTIQUE:", copie)

          etat = json.loads(
              Path("site_pmu/data/etat_publication.json")
              .read_text(encoding="utf-8")
          )

          if etat.get("deploiement_effectue") is not False:
              raise SystemExit("DEPLOIEMENT_INATTENDU")

          if etat.get("publication_moteurs_presente") is not True:
              raise SystemExit("MOTEURS_NON_RECONNUS")

          if etat.get("authenticite_figes_verifiee") is not False:
              raise SystemExit("FIGES_NON_CONFORMES")

          moteurs = json.loads(
              Path("site_pmu/data/publication_moteurs.json")
              .read_text(encoding="utf-8")
          )

          if moteurs.get("schema") != "x1000-moteurs-v1":
              raise SystemExit("SCHEMA_MOTEURS_INVALIDE")

          courses = moteurs.get("courses")
          if not isinstance(courses, list) or not courses:
              raise SystemExit("DECISIONS_ABSENTES")

          attendus = {"M1", "M2", "M3", "M4", "M5"}

          for course in courses:
              if not isinstance(course, dict):
                  raise SystemExit("COURSE_MOTEURS_INVALIDE")

              decisions = course.get("moteurs")
              if not isinstance(decisions, dict):
                  raise SystemExit("DECISIONS_MOTEURS_INVALIDES")

              if set(decisions) != attendus:
                  raise SystemExit("MOTEURS_INCOMPLETS")

              if not isinstance(
                  course.get("arbitre_x1000"), dict
              ):
                  raise SystemExit("ARBITRAGE_X1000_ABSENT")

          html = Path("site_pmu/index.html").read_text(
              encoding="utf-8"
          )

          for chemin in (
              "data/publication_courses.json",
              "data/publication_moteurs.json",
              "sortie/recherche_courses_du_jour.json",
          ):
              if chemin not in html:
                  raise SystemExit(
                      f"REFERENCE_HTML_ABSENTE: {chemin}"
                  )

          if "fetch(" not in html:
              raise SystemExit("CHARGEMENT_JSON_NON_IDENTIFIE")

          print("COHERENCE_STATIQUE_OK")
          print("NAVIGATEUR_NON_TESTE")
          print("AUCUN_DEPLOIEMENT")
          PY

      - name: Verifier integrite du depot
        if: always()
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::FICHIERS_SUIVIS_MODIFIES"
            git status --short --untracked-files=no
            exit 1
          fi

          echo "DEPOT_SUIVI_INCHANGE"

      - name: Conserver les diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x1000-validation-${{ github.run_id }}
          path: |
            ${{ env.X1000_TEST_DIR }}/sortie/
            ${{ env.X1000_TEST_DIR }}/site_pmu/
          if-no-files-found: warn
          retention-days: 7

      - name: Rapport final
        if: always()
        env:
          RESULTAT: ${{ job.status }}
        run: |
          {
            echo "## X1000 - Validation PMU et moteurs"
            echo ""
            echo "Resultat : $RESULTAT"
            echo "Branche : $GITHUB_REF_NAME"
            echo ""
            echo "Collecte PMU France"
            echo "Adaptation des courses"
            echo "Sources M1-M5 et X1000"
            echo "Validation chronologique"
            echo "Preparation du site isole"
            echo "Comparaison des publications"
            echo ""
            echo "AUCUN COMMIT AUTOMATIQUE"
            echo "AUCUN PUSH AUTOMATIQUE"
            echo "AUCUN DEPLOIEMENT"
            echo "AUCUN FIGE MODIFIE"
            echo "AUCUNE ARCHIVE MODIFIEE"
            echo "AUCUN PRONOSTIC INVENTE"
            echo ""
            echo "Le controle ne certifie pas"
            echo "l'affichage reel dans un navigateur."
          } >> "$GITHUB_STEP_SUMMARY"
