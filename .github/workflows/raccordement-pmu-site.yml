name: "X1000 - Raccordement PMU vers GitHub Pages - Controle"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x1000-raccordement-pmu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  raccordement:
    name: "Collecte PMU - Validation - Site isole"
    if: >-
      github.repository == 'yadcaf-cloud/x1000-intelligence-hippique-humaine' &&
      github.ref == 'refs/heads/fix/audit-general-pmu-20261118' &&
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      TZ: Europe/Paris

    defaults:
      run:
        shell: bash

    steps:
      - name: Recuperer la branche autorisee
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier les sources
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = \
            "refs/heads/fix/audit-general-pmu-20261118"

          for fichier in \
            collecte_pmu.py \
            adapter_collecte_tableau.py \
            index.html
          do
            test -s "$fichier" || {
              echo "::error::SOURCE_ABSENTE: $fichier"
              exit 1
            }

            test ! -L "$fichier" || {
              echo "::error::LIEN_INTERDIT: $fichier"
              exit 1
            }
          done

          python -B - <<'PY'
          import ast
          from pathlib import Path

          for nom in (
              "collecte_pmu.py",
              "adapter_collecte_tableau.py",
          ):
              ast.parse(
                  Path(nom).read_text(encoding="utf-8"),
                  filename=nom,
              )
              print("SYNTAXE_OK:", nom)
          PY

      - name: Creer un environnement isole
        run: |
          set -euo pipefail

          dossier="$(mktemp -d \
            "$RUNNER_TEMP/x1000-pmu-XXXXXXXX")"

          echo "X1000_WORK=$dossier" >> "$GITHUB_ENV"

          cp collecte_pmu.py "$dossier/"
          cp adapter_collecte_tableau.py "$dossier/"
          cp index.html "$dossier/"

          if [[ -s tableau-pmu.html ]]; then
            test ! -L tableau-pmu.html
            cp tableau-pmu.html "$dossier/"
          fi

          echo "ENVIRONNEMENT_ISOLE_OK"

      - name: Collecter PMU France
        id: collecte
        run: |
          set -euo pipefail
          cd "$X1000_WORK"

          python -B collecte_pmu.py

          test -s sortie/publication_courses.json

          echo "COLLECTE_PMU_TERMINEE"

      - name: Adapter les courses
        id: adaptation
        run: |
          set -euo pipefail
          cd "$X1000_WORK"

          python -B adapter_collecte_tableau.py

          test -s sortie/recherche_courses_du_jour.json

          echo "ADAPTATION_TERMINEE"

      - name: Valider les donnees PMU
        id: validation
        run: |
          set -euo pipefail
          cd "$X1000_WORK"

          python -B - <<'PY'
          import json
          import re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          PARIS = ZoneInfo("Europe/Paris")
          TODAY = datetime.now(PARIS).date().isoformat()
          ID = re.compile(
              r"^\d{4}-\d{2}-\d{2}-R[1-9]\d*-C[1-9]\d*$"
          )

          def erreur(message):
              raise ValueError(message)

          def lire(nom):
              fichier = Path(nom)
              if not fichier.is_file():
                  erreur(f"ABSENT: {nom}")

              taille = fichier.stat().st_size
              if not 0 < taille <= 8_000_000:
                  erreur(f"TAILLE_INVALIDE: {nom}")

              def paires_uniques(paires):
                  resultat = {}
                  for cle, valeur in paires:
                      if cle in resultat:
                          erreur(f"CLE_DUPLIQUEE: {cle}")
                      resultat[cle] = valeur
                  return resultat

              def constante_interdite(valeur):
                  erreur(f"CONSTANTE_INVALIDE: {valeur}")

              return json.loads(
                  fichier.read_text(encoding="utf-8"),
                  object_pairs_hook=paires_uniques,
                  parse_constant=constante_interdite,
              )

          def verifier_depart(valeur):
              if not isinstance(valeur, str):
                  erreur("DEPART_ABSENT")

              try:
                  depart = datetime.fromisoformat(
                      valeur.replace("Z", "+00:00")
                  )
              except ValueError:
                  erreur("DEPART_INVALIDE")

              if (
                  depart.tzinfo is None
                  or depart.utcoffset() is None
              ):
                  erreur("DEPART_SANS_FUSEAU")

              if depart.astimezone(PARIS).date().isoformat() != TODAY:
                  erreur("DEPART_HORS_DATE")

              return depart.astimezone(PARIS)

          def verifier_partants(partants):
              if not isinstance(partants, list) or not partants:
                  erreur("PARTANTS_ABSENTS")

              resultat = {}

              for cheval in partants:
                  if not isinstance(cheval, dict):
                      erreur("PARTANT_INVALIDE")

                  numero = cheval.get("numero")
                  nom = cheval.get("nom")
                  np = cheval.get("non_partant")

                  if type(numero) is not int or numero <= 0:
                      erreur("NUMERO_INVALIDE")

                  if numero in resultat:
                      erreur("NUMERO_DUPLIQUE")

                  if not isinstance(nom, str) or not nom.strip():
                      erreur("NOM_INVALIDE")

                  if type(np) is not bool:
                      erreur("NON_PARTANT_INVALIDE")

                  resultat[numero] = (
                      nom.strip().casefold(),
                      np,
                  )

              if not any(not np for _, np in resultat.values()):
                  erreur("AUCUN_PARTANT_ACTIF")

              return resultat

          pmu = lire("sortie/publication_courses.json")
          candidats = lire(
              "sortie/recherche_courses_du_jour.json"
          )

          if not isinstance(pmu, dict):
              erreur("SOURCE_PMU_INVALIDE")

          if not isinstance(candidats, dict):
              erreur("CANDIDATS_INVALIDES")

          if (
              pmu.get("schema") != "x1000-pmu-france-v1"
              or pmu.get("date_pmu") != TODAY
              or pmu.get("source") != "PMU TurfInfo"
          ):
              erreur("METADONNEES_PMU_INVALIDES")

          if (
              candidats.get("schema") != "x1000-candidates-v1"
              or candidats.get("date") != TODAY
              or candidats.get("source") != "PMU TurfInfo"
          ):
              erreur("METADONNEES_CANDIDATS_INVALIDES")

          sources = pmu.get("courses")
          selections = candidats.get("courses_candidates")

          if not isinstance(sources, list) or not sources:
              erreur("AUCUNE_COURSE_PMU")

          if not isinstance(selections, list):
              erreur("CANDIDATS_ABSENTS")

          def indexer(liste, source):
              resultat = {}

              for course in liste:
                  if not isinstance(course, dict):
                      erreur(f"{source}: COURSE_INVALIDE")

                  cid = course.get("course_id")

                  if (
                      not isinstance(cid, str)
                      or not ID.fullmatch(cid)
                      or not cid.startswith(TODAY + "-")
                  ):
                      erreur(f"{source}: ID_INVALIDE")

                  if cid in resultat:
                      erreur(f"{source}: DOUBLON_{cid}")

                  if course.get("pays_verifie") != "FR":
                      erreur(f"{source}: HORS_FRANCE_{cid}")

                  hippodrome = course.get("hippodrome")

                  if (
                      not isinstance(hippodrome, str)
                      or not hippodrome.strip()
                  ):
                      erreur(f"{source}: HIPPODROME_ABSENT")

                  depart = verifier_depart(
                      course.get("depart")
                  )

                  partants = verifier_partants(
                      course.get("partants")
                  )

                  resultat[cid] = (
                      hippodrome.strip().casefold(),
                      depart,
                      partants,
                  )

              return resultat

          a = indexer(sources, "PMU")
          b = indexer(selections, "CANDIDATS")

          if a != b:
              erreur("RACCORDEMENT_PMU_CANDIDATS_INCOHERENT")

          print("DATE:", TODAY)
          print("COURSES_VERIFIEES:", len(a))
          print("COHERENCE_LOCALE_VALIDEE")
          print("AUTHENTICITE_EXTERNE_NON_CERTIFIEE")
          PY

      - name: Preparer le site GitHub Pages isole
        id: preparation
        run: |
          set -euo pipefail
          cd "$X1000_WORK"

          mkdir -p site_pmu/data
          mkdir -p site_pmu/sortie

          cp index.html site_pmu/index.html

          if [[ -s tableau-pmu.html ]]; then
            cp tableau-pmu.html \
              site_pmu/tableau-pmu.html
          fi

          cp sortie/publication_courses.json \
            site_pmu/data/publication_courses.json

          cp sortie/recherche_courses_du_jour.json \
            site_pmu/sortie/recherche_courses_du_jour.json

          touch site_pmu/.nojekyll

          python -B - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          paires = (
              (
                  "sortie/publication_courses.json",
                  "site_pmu/data/publication_courses.json",
              ),
              (
                  "sortie/recherche_courses_du_jour.json",
                  "site_pmu/sortie/recherche_courses_du_jour.json",
              ),
              ("index.html", "site_pmu/index.html"),
          )

          for original, copie in paires:
              a = Path(original).read_bytes()
              b = Path(copie).read_bytes()

              if hashlib.sha256(a).digest() != \
                      hashlib.sha256(b).digest():
                  raise SystemExit(
                      f"COPIE_INCORRECTE: {copie}"
                  )

              print("COPIE_IDENTIQUE:", copie)

          html = Path("site_pmu/index.html").read_text(
              encoding="utf-8"
          )

          for chemin in (
              "data/publication_courses.json",
              "sortie/recherche_courses_du_jour.json",
          ):
              if chemin not in html:
                  raise SystemExit(
                      f"REFERENCE_HTML_ABSENTE: {chemin}"
                  )

          etat = {
              "collecte": "TERMINEE",
              "coherence_locale": "VALIDEE",
              "site_prepare": True,
              "publication_moteurs": False,
              "pronostics_officiels_modifies": False,
              "deploiement_effectue": False,
          }

          Path(
              "site_pmu/data/etat_publication.json"
          ).write_text(
              json.dumps(
                  etat,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          print("SITE_PRET_POUR_VALIDATION")
          PY

      - name: Verifier integrite du depot
        if: always()
        run: |
          set -euo pipefail

          if [[ -n "$(
            git status --porcelain --untracked-files=no
          )" ]]; then
            echo "::error::FICHIERS_SUIVIS_MODIFIES"
            git status --short --untracked-files=no
            exit 1
          fi

          echo "DEPOT_SUIVI_INCHANGE"

      - name: Archiver le site prepare
        if: steps.preparation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: x1000-site-pmu-${{ github.run_id }}
          path: ${{ env.X1000_WORK }}/site_pmu/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

      - name: Rapport final
        if: always()
        env:
          COLLECTE: ${{ steps.collecte.outcome }}
          ADAPTATION: ${{ steps.adaptation.outcome }}
          VALIDATION: ${{ steps.validation.outcome }}
          PREPARATION: ${{ steps.preparation.outcome }}
          RESULTAT: ${{ job.status }}
        run: |
          set -euo pipefail

          {
            echo "## X1000 - Raccordement PMU"
            echo ""
            echo "- Collecte: $COLLECTE"
            echo "- Adaptation: $ADAPTATION"
            echo "- Validation: $VALIDATION"
            echo "- Site prepare: $PREPARATION"
            echo "- Statut global: $RESULTAT"
            echo ""
            echo "### Securite"
            echo "- Aucun commit automatique"
            echo "- Aucun push automatique"
            echo "- Aucun deploiement"
            echo "- Aucun FIGE modifie"
            echo "- Aucune archive modifiee"
            echo "- Aucun pronostic officiel modifie"
            echo ""
            echo "Publication publique non effectuee."
          } >> "$GITHUB_STEP_SUMMARY"
