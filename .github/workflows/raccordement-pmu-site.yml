name: "X1000 - Raccordement PMU - Validation complete"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x1000-validation-pmu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: "PMU France - M1-M5 - Site sans deploiement"

    if: >-
      github.repository == 'yadcaf-cloud/x1000-intelligence-hippique-humaine' &&
      github.ref_name == 'fix/audit-general-pmu-20261118'

    runs-on: ubuntu-24.04
    timeout-minutes: 35

    defaults:
      run:
        shell: bash

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      X1000_SORTIE: "sortie"

    steps:
      - name: Recuperer la branche autorisee
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier depot et branche
        run: |
          set -euo pipefail

          test "$GITHUB_REPOSITORY" = \
            "yadcaf-cloud/x1000-intelligence-hippique-humaine"

          test "$GITHUB_REF_NAME" = \
            "fix/audit-general-pmu-20261118"

          echo "BRANCHE_REPARATION_AUTORISEE"

      - name: Verifier les fichiers sources
        run: |
          set -euo pipefail

          for fichier in \
            collecte_pmu.py \
            adapter_collecte_tableau.py \
            preparer_site_pmu.py \
            verifier_raccordement_moteurs.py \
            index.html \
            tableau-pmu.html
          do
            if [ ! -s "$fichier" ]; then
              echo "::error::FICHIER_ABSENT: $fichier"
              exit 1
            fi
            echo "SOURCE_OK: $fichier"
          done

      - name: Verifier syntaxe Python
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          fichiers = [
              "collecte_pmu.py",
              "adapter_collecte_tableau.py",
              "preparer_site_pmu.py",
              "verifier_raccordement_moteurs.py",
          ]

          for fichier in fichiers:
              ast.parse(
                  Path(fichier).read_text(
                      encoding="utf-8"
                  ),
                  filename=fichier
              )
              print("SYNTAXE_OK:", fichier)
          PY

      - name: Collecter les courses PMU reelles
        run: |
          set -euo pipefail

          mkdir -p sortie

          python collecte_pmu.py

          test -s sortie/publication_courses.json || {
            echo "::error::COLLECTE_PMU_ABSENTE"
            exit 1
          }

          echo "COLLECTE_PMU_TERMINEE"

      - name: Adapter les courses au tableau
        run: |
          set -euo pipefail

          python adapter_collecte_tableau.py

          test -s \
            sortie/recherche_courses_du_jour.json || {
            echo "::error::ADAPTATION_ABSENTE"
            exit 1
          }

          echo "ADAPTATION_TERMINEE"

      - name: Controler les donnees PMU
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          today = datetime.now(
              ZoneInfo("Europe/Paris")
          ).date().isoformat()

          paths = [
              Path("sortie/publication_courses.json"),
              Path("sortie/recherche_courses_du_jour.json"),
          ]

          documents = [
              json.loads(p.read_text(encoding="utf-8"))
              for p in paths
          ]

          courses, candidats = documents

          assert courses.get("schema") == \
              "x1000-pmu-france-v1"
          assert candidats.get("schema") == \
              "x1000-candidates-v1"

          assert courses.get("date_pmu") == today
          assert candidats.get("date") == today

          assert courses.get("source") == "PMU TurfInfo"
          assert candidats.get("source") == "PMU TurfInfo"

          liste = courses.get("courses")
          selection = candidats.get("courses_candidates")

          assert isinstance(liste, list) and liste
          assert isinstance(selection, list)

          pattern = re.compile(
              r"^\d{4}-\d{2}-\d{2}-R[1-9]\d*-C[1-9]\d*$"
          )

          ids = set()

          for course in liste:
              cid = course["course_id"]

              assert pattern.fullmatch(cid)
              assert cid.startswith(today + "-")
              assert cid not in ids
              assert course["pays_verifie"] == "FR"

              depart = datetime.fromisoformat(
                  course["depart"].replace(
                      "Z", "+00:00"
                  )
              )
              assert depart.tzinfo is not None
              assert depart.astimezone(
                  ZoneInfo("Europe/Paris")
              ).date().isoformat() == today

              assert course.get("hippodrome")
              partants = course.get("partants")
              assert isinstance(partants, list) and partants

              numeros = set()
              actifs = 0

              for cheval in partants:
                  numero = cheval["numero"]
                  assert type(numero) is int
                  assert numero > 0
                  assert numero not in numeros
                  assert isinstance(cheval["nom"], str)
                  assert cheval["nom"].strip()
                  assert type(cheval["non_partant"]) is bool

                  numeros.add(numero)
                  if not cheval["non_partant"]:
                      actifs += 1

              assert actifs > 0
              ids.add(cid)

          ids_candidats = [
              c["course_id"] for c in selection
          ]

          assert len(ids_candidats) == len(set(ids_candidats))
          assert set(ids_candidats) == ids
          assert all(
              c.get("pays_verifie") == "FR"
              for c in selection
          )

          print("DATE:", today)
          print("COURSES_VERIFIEES:", len(ids))
          print("PMU_FRANCE_VALIDE")
          PY

      - name: Verifier raccordement reel M1-M5
        run: |
          set -euo pipefail

          if [ ! -s data/publication_moteurs.json ] && \
             [ ! -s sortie/publication_moteurs.json ]; then
            echo "::error::SOURCE_M1_M5_ABSENTE"
            echo "::error::Aucune publication moteur verifiee"
            exit 1
          fi

          python verifier_raccordement_moteurs.py

          echo "CONTROLE_M1_M5_TERMINE"

      - name: Preparer le site isole
        run: |
          set -euo pipefail

          python preparer_site_pmu.py

          for fichier in \
            site_pmu/index.html \
            site_pmu/tableau-pmu.html \
            site_pmu/data/publication_courses.json \
            site_pmu/data/publication_moteurs.json \
            site_pmu/data/etat_publication.json \
            site_pmu/sortie/recherche_courses_du_jour.json
          do
            test -s "$fichier" || {
              echo "::error::RESSOURCE_MANQUANTE: $fichier"
              exit 1
            }
          done

          echo "SITE_PREPARE_SANS_DEPLOIEMENT"

      - name: Verifier la coherence du site
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("site_pmu")

          fichiers = [
              "data/publication_courses.json",
              "data/publication_moteurs.json",
              "data/etat_publication.json",
              "sortie/recherche_courses_du_jour.json",
          ]

          for fichier in fichiers:
              path = root / fichier
              assert path.is_file(), fichier
              with path.open(encoding="utf-8") as f:
                  assert isinstance(json.load(f), dict)
              print("JSON_OK:", fichier)

          etat = json.loads(
              (root / "data/etat_publication.json")
              .read_text(encoding="utf-8")
          )

          assert etat["deploiement_effectue"] is False
          assert etat["publication_moteurs_presente"] is True
          assert etat["authenticite_figes_verifiee"] is False

          html = (root / "index.html").read_text(
              encoding="utf-8"
          )

          for fichier in (
              "data/publication_courses.json",
              "sortie/recherche_courses_du_jour.json",
              "data/publication_moteurs.json",
          ):
              assert fichier in html, fichier

          assert "fetch(" in html

          print("COHERENCE_STATIQUE_OK")
          print("CHARGEMENT_NAVIGATEUR_NON_TESTE")
          print("DEPLOIEMENT_PUBLIC_DESACTIVE")
          PY

      - name: Conserver les diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x1000-validation-${{ github.run_id }}
          path: |
            sortie/publication_courses.json
            sortie/recherche_courses_du_jour.json
            site_pmu/
          if-no-files-found: warn
          retention-days: 7

      - name: Rapport final
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          {
            echo "## X1000 - Validation du raccordement"
            echo ""
            echo "Resultat : $JOB_RESULT"
            echo "Branche : $GITHUB_REF_NAME"
            echo ""
            echo "Collecte PMU reelle"
            echo "Courses France et partants"
            echo "Adaptation des donnees"
            echo "Controle bloquant M1-M5"
            echo "Preparation du site isole"
            echo "Verification JSON et HTML"
            echo ""
            echo "AUCUN DEPLOIEMENT PUBLIC"
            echo "AUCUN COMMIT AUTOMATIQUE"
            echo "AUCUN PUSH AUTOMATIQUE"
            echo "AUCUN FIGE MODIFIE"
            echo "AUCUNE ARCHIVE MODIFIEE"
            echo "AUCUN PRONOSTIC INVENTE"
            echo ""
            echo "Un succes ne certifie pas le"
            echo "chargement reel dans le navigateur."
          } >> "$GITHUB_STEP_SUMMARY"
