name: "X1000 - Controle PMU et execution M1-M5"

on:
  workflow_dispatch:
    inputs:
      fichier_course:
        description: "Chemin relatif du JSON enrichi"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: x1000-execution-moteurs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verification:
    name: "Validation PMU puis execution M1-M5"

    if: >-
      github.repository == 'yadcaf-cloud/x1000-intelligence-hippique-humaine' &&
      github.ref == 'refs/heads/fix/audit-general-pmu-20261118' &&
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      FICHIER_COURSE: ${{ inputs.fichier_course }}
      TZ: Europe/Paris

    steps:
      - name: Recuperer la branche autorisee
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier les fichiers requis
        shell: bash
        run: |
          set -euo pipefail

          fichiers=(
            verifier_source_pmu_moteurs.py
            tester_execution_moteurs_x1000.py
            sortie/publication_courses.json
            moteurs/m1.py
            moteurs/m2.py
            moteurs/m3.py
            moteurs/m4.py
            moteurs/m5.py
          )

          for fichier in "${fichiers[@]}"; do
            if [[ ! -s "$fichier" ]]; then
              echo "::error::Fichier absent ou vide: $fichier"
              exit 1
            fi
            echo "PRESENT: $fichier"
          done

      - name: Controler le chemin du JSON
        id: entree
        shell: bash
        run: |
          set -euo pipefail

          python -B - <<'PY'
          import os
          from pathlib import Path

          racine = Path.cwd().resolve()
          valeur = os.environ["FICHIER_COURSE"].strip()

          if not valeur or valeur == ".":
              raise SystemExit("CHEMIN_ABSENT")

          relatif = Path(valeur)

          if relatif.is_absolute() or ".." in relatif.parts:
              raise SystemExit("CHEMIN_INTERDIT")

          courant = racine
          for partie in relatif.parts:
              courant = courant / partie
              if courant.is_symlink():
                  raise SystemExit("LIEN_SYMBOLIQUE_INTERDIT")

          chemin = courant.resolve()

          if not chemin.is_relative_to(racine):
              raise SystemExit("CHEMIN_HORS_DEPOT")

          if not chemin.is_file():
              raise SystemExit("JSON_ENRICHI_ABSENT")

          if chemin.suffix.lower() != ".json":
              raise SystemExit("FORMAT_JSON_REQUIS")

          taille = chemin.stat().st_size
          if not 0 < taille <= 5 * 1024 * 1024:
              raise SystemExit("TAILLE_JSON_INVALIDE")

          print("JSON ENRICHI CONTROLE:", relatif)
          PY

      - name: Verifier la syntaxe Python
        shell: bash
        run: |
          set -euo pipefail

          python -B - <<'PY'
          import ast
          from pathlib import Path

          fichiers = [
              Path("verifier_source_pmu_moteurs.py"),
              Path("tester_execution_moteurs_x1000.py"),
          ]

          fichiers.extend(
              Path("moteurs") / f"m{i}.py"
              for i in range(1, 6)
          )

          for fichier in fichiers:
              ast.parse(
                  fichier.read_text(encoding="utf-8"),
                  filename=str(fichier),
              )
              print("SYNTAXE OK:", fichier)
          PY

      - name: Verifier la date de collecte PMU
        id: fraicheur
        shell: bash
        run: |
          set -euo pipefail

          python -B - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          chemin = Path("sortie/publication_courses.json")

          def refuser_constante(valeur):
              raise ValueError(
                  f"CONSTANTE_JSON_INTERDITE: {valeur}"
              )

          source = json.loads(
              chemin.read_text(encoding="utf-8"),
              parse_constant=refuser_constante,
          )

          if not isinstance(source, dict):
              raise SystemExit("SOURCE_JSON_INVALIDE")

          aujourd_hui = datetime.now(
              ZoneInfo("Europe/Paris")
          ).date().isoformat()

          date_source = source.get("date_pmu")

          if date_source != aujourd_hui:
              raise SystemExit(
                  "COLLECTE_NON_ACTUELLE: "
                  f"{date_source} != {aujourd_hui}"
              )

          print("DATE PMU DU JOUR VALIDEE:", date_source)
          PY

      - name: Verifier la coherence locale PMU
        id: pmu
        shell: bash
        run: |
          set -euo pipefail

          python -B verifier_source_pmu_moteurs.py \
            --source sortie/publication_courses.json \
            --input "$FICHIER_COURSE"

          echo "COHERENCE LOCALE PMU VALIDEE"

      - name: Executer independamment M1-M5
        id: moteurs
        if: steps.pmu.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          python -B tester_execution_moteurs_x1000.py \
            --input "$FICHIER_COURSE"

          echo "EXECUTION TECHNIQUE M1-M5 REUSSIE"

      - name: Bilan final X1000
        if: always()
        shell: bash
        env:
          ENTREE_RESULT: ${{ steps.entree.outcome }}
          FRAICHEUR_RESULT: ${{ steps.fraicheur.outcome }}
          PMU_RESULT: ${{ steps.pmu.outcome }}
          MOTEURS_RESULT: ${{ steps.moteurs.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          {
            echo "## X1000 - Controle PMU et M1-M5"
            echo ""
            echo "- Fichier entree: $ENTREE_RESULT"
            echo "- Date collecte: $FRAICHEUR_RESULT"
            echo "- Coherence locale PMU: $PMU_RESULT"
            echo "- Execution M1-M5: $MOTEURS_RESULT"
            echo "- Statut global: $JOB_STATUS"
            echo ""
            echo "### Limites"
            echo "- Authenticite PMU externe: non certifiee"
            echo "- Notes sportives: non authentifiees"
            echo "- Arbitrage officiel X1000: non execute"
            echo "- Publication: aucune"
            echo "- FIGE: aucun prevu"
            echo "- Deploiement: aucun"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "BILAN X1000: $JOB_STATUS"
