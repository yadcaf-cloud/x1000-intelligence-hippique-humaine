name: "X1000 - Controle officiel avant fusion V1.4"

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - "pmu_engine.py"
      - "analyse_hippique.py"
      - "resultats_archives.py"
      - "data/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: x1000-controle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: "Controle officiel securise"

    if: >-
      github.repository ==
      'yadcaf-cloud/x1000-intelligence-hippique-humaine' &&
      (
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref ==
          'refs/heads/feature/activation-pmu-analyses-archives'
        ) ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name ==
          github.repository &&
          github.head_ref ==
          'feature/activation-pmu-analyses-archives' &&
          github.base_ref == 'main'
        )
      )

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"

    steps:
      - name: "Recuperer branche et historique"
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: "Installer Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Identifier les references Git"
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE"
            HEAD_SHA="$PR_HEAD"
          else
            BASE_SHA="$(git rev-parse refs/remotes/origin/main)"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"

          test -n "$MERGE_BASE"

          {
            echo "BASE_SHA=$BASE_SHA"
            echo "HEAD_SHA=$HEAD_SHA"
            echo "MERGE_BASE=$MERGE_BASE"
          } >> "$GITHUB_ENV"

          echo "References Git : OK"
          echo "Ancetre commun : OK"

      - name: "Verifier syntaxe Python"
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          files = (
              "pmu_engine.py",
              "analyse_hippique.py",
              "resultats_archives.py",
          )

          for name in files:
              path = Path(name)

              if not path.is_file() or not path.stat().st_size:
                  raise SystemExit(
                      f"::error::Script absent ou vide : {name}"
                  )

              ast.parse(
                  path.read_text(encoding="utf-8-sig"),
                  filename=name,
              )

              print("Syntaxe OK :", name)
          PY

      - name: "Verifier publications JSON et courses PMU"
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          from analyse_hippique import (
              validate,
              validate_course,
          )

          def unique_keys(pairs):
              result = {}

              for key, value in pairs:
                  if key in result:
                      raise ValueError(
                          f"Cle JSON dupliquee : {key}"
                      )
                  result[key] = value

              return result

          def reject_constant(value):
              raise ValueError(
                  f"Constante JSON interdite : {value}"
              )

          def load_json(name):
              path = Path(name)

              if not path.is_file() or not path.stat().st_size:
                  raise SystemExit(
                      f"::error::Fichier absent ou vide : {name}"
                  )

              payload = json.loads(
                  path.read_text(encoding="utf-8-sig"),
                  object_pairs_hook=unique_keys,
                  parse_constant=reject_constant,
              )

              if not isinstance(payload, dict):
                  raise SystemExit(
                      f"Objet JSON attendu : {name}"
                  )

              print("JSON valide :", name)
              return payload

          courses = load_json(
              "data/publication_courses.json"
          )

          load_json(
              "data/publication_analyses.json"
          )

          load_json(
              "data/diagnostic_collecte_pmu.json"
          )

          date = validate(courses)
          items = courses.get("courses")

          if not isinstance(items, list):
              raise SystemExit(
                  "Liste courses invalide"
              )

          ids = set()
          total = 0

          for course in items:
              cid = validate_course(course, date)

              if not isinstance(cid, str) or not cid:
                  raise SystemExit(
                      "Identifiant course invalide"
                  )

              if cid in ids:
                  raise SystemExit(
                      f"Course dupliquee : {cid}"
                  )

              ids.add(cid)
              total += course["nombre_partants"]

          if not ids:
              raise SystemExit(
                  "Aucune course PMU verifiee"
              )

          print("Date PMU :", date)
          print("Courses verifiees :", len(ids))
          print("Partants actifs :", total)
          print("Structure PMU : OK")
          PY

      - name: "Proteger archives historiques"
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import subprocess

          PREFIX = "data/archives_resultats/"
          MAX_SIZE = 2_000_000

          def git(*args):
              return subprocess.check_output(
                  ["git", *args]
              )

          def archives(ref):
              raw = git(
                  "ls-tree", "-r", "-z",
                  ref, "--", PREFIX
              )

              result = {}

              for entry in raw.split(b"\0"):
                  if not entry:
                      continue

                  meta, path = entry.split(b"\t", 1)
                  mode, kind, sha = (
                      meta.decode("ascii").split()
                  )

                  name = os.fsdecode(path)

                  if mode != "100644" or kind != "blob":
                      raise SystemExit(
                          f"Archive non reguliere : {name}"
                      )

                  result[name] = sha

              return result

          def preserve(before, after, label):
              for name, sha in before.items():
                  if after.get(name) != sha:
                      raise SystemExit(
                          f"{label} : archive modifiee "
                          f"ou supprimee : {name}"
                      )

          def unique_keys(pairs):
              result = {}

              for key, value in pairs:
                  if key in result:
                      raise ValueError(
                          f"Cle JSON dupliquee : {key}"
                      )
                  result[key] = value

              return result

          def reject_constant(value):
              raise ValueError(
                  f"Constante interdite : {value}"
              )

          def validate_archive(name, sha):
              if not name.endswith(".json"):
                  raise SystemExit(
                      f"Extension interdite : {name}"
                  )

              size = int(
                  git("cat-file", "-s", sha)
                  .decode().strip()
              )

              if size <= 0 or size > MAX_SIZE:
                  raise SystemExit(
                      f"Taille archive invalide : {name}"
                  )

              raw = git("cat-file", "blob", sha)

              payload = json.loads(
                  raw.decode("utf-8-sig"),
                  object_pairs_hook=unique_keys,
                  parse_constant=reject_constant,
              )

              if not isinstance(payload, dict):
                  raise SystemExit(
                      f"Archive JSON invalide : {name}"
                  )

              print("Archive controlee :", name)

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          ancestor = os.environ["MERGE_BASE"]

          base_archives = archives(base)
          head_archives = archives(head)
          ancestor_archives = archives(ancestor)

          preserve(
              base_archives,
              head_archives,
              "Protection main",
          )

          preserve(
              ancestor_archives,
              head_archives,
              "Protection origine",
          )

          commits = git(
              "rev-list",
              "--reverse",
              "--topo-order",
              f"{ancestor}..{head}",
          ).decode().splitlines()

          checked = set()

          for commit in commits:
              current = archives(commit)

              parents = git(
                  "rev-list",
                  "--parents",
                  "-n", "1",
                  commit,
              ).decode().strip().split()[1:]

              if not parents:
                  raise SystemExit(
                      f"Commit sans parent : {commit}"
                  )

              for parent in parents:
                  previous = archives(parent)

                  preserve(
                      previous,
                      current,
                      f"Commit {commit[:12]}",
                  )

                  for name, sha in current.items():
                      if name not in previous:
                          key = (name, sha)

                          if key not in checked:
                              validate_archive(name, sha)
                              checked.add(key)

          for name, sha in head_archives.items():
              key = (name, sha)

              if key not in checked:
                  validate_archive(name, sha)
                  checked.add(key)

          print("Commits verifies :", len(commits))
          print("Archives finales :", len(head_archives))
          print("Archives JSON controlees :", len(checked))
          print("Protection archives : OK")
          PY

      - name: "Memoriser integrite initiale"
        id: snapshot
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          raw = subprocess.check_output(
              ["git", "ls-files", "-z"]
          )

          snapshot = {}

          for entry in raw.split(b"\0"):
              if not entry:
                  continue

              name = os.fsdecode(entry)
              path = Path(name)

              if path.is_symlink() or not path.is_file():
                  raise SystemExit(
                      f"Fichier suivi invalide : {name}"
                  )

              snapshot[name] = hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()

          if not snapshot:
              raise SystemExit(
                  "Aucun fichier suivi"
              )

          target = (
              Path(os.environ["RUNNER_TEMP"])
              / "x1000-controle-snapshot.json"
          )

          target.write_text(
              json.dumps(snapshot, sort_keys=True),
              encoding="utf-8",
          )

          print("Fichiers memorises :", len(snapshot))
          print("Snapshot SHA256 : OK")
          PY

      - name: "Executer les trois autotests"
        run: |
          set -euo pipefail

          python pmu_engine.py --self-test
          python analyse_hippique.py --self-test
          python resultats_archives.py --self-test

          echo "Trois autotests : OK"

      - name: "Verifier archives existantes"
        run: |
          set -euo pipefail

          python resultats_archives.py --verify-archives

          echo "Archives existantes : OK"

      - name: "Tester analyses sans publication"
        run: |
          set -euo pipefail

          python analyse_hippique.py --dry-run

          echo "Analyse dry-run : OK"
          echo "Aucune publication demandee"

      - name: "Verifier integrite finale SHA256"
        if: always() && steps.checkout.outcome == 'success'
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          target = (
              Path(os.environ["RUNNER_TEMP"])
              / "x1000-controle-snapshot.json"
          )

          if not target.is_file():
              raise SystemExit(
                  "::error::Snapshot initial absent"
              )

          initial = json.loads(
              target.read_text(encoding="utf-8")
          )

          if not isinstance(initial, dict) or not initial:
              raise SystemExit(
                  "::error::Snapshot initial invalide"
              )

          raw = subprocess.check_output(
              ["git", "ls-files", "-z"]
          )

          current = {}

          for entry in raw.split(b"\0"):
              if not entry:
                  continue

              name = os.fsdecode(entry)
              path = Path(name)

              if path.is_symlink() or not path.is_file():
                  raise SystemExit(
                      f"Fichier suivi invalide : {name}"
                  )

              current[name] = hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()

          if current != initial:
              changed = sorted(
                  name
                  for name in set(initial) | set(current)
                  if initial.get(name) != current.get(name)
              )

              for name in changed:
                  print(
                      f"::error::Fichier modifie : {name}"
                  )

              raise SystemExit(
                  "Integrite SHA256 non respectee"
              )

          print("Integrite SHA256 : OK")
          PY

          git diff --exit-code HEAD --
          git diff --cached --exit-code

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Fichiers non suivis detectes"
            git ls-files --others --exclude-standard
            exit 1
          fi

          echo "Integrite Git : OK"

      - name: "Rapport de validation"
        if: success()
        run: |
          {
            echo "## X1000 - Controle officiel V1.4"
            echo ""
            echo "- Branche securisee : OK"
            echo "- References Git : OK"
            echo "- Syntaxe Python : OK"
            echo "- Publications JSON : OK"
            echo "- Structure PMU : OK"
            echo "- Archives historiques : OK"
            echo "- Trois autotests : OK"
            echo "- Verification archives : OK"
            echo "- Analyse dry-run : OK"
            echo "- Integrite SHA256 : OK"
            echo "- Publication : aucune"
            echo "- Fusion automatique : aucune"
            echo "- Modification main : aucune"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Signaler un echec"
        if: failure()
        run: |
          echo "::error::Controle officiel X1000 V1.4 echoue"
          echo "Ne pas fusionner vers main."
          echo "Consulter les journaux GitHub Actions."
