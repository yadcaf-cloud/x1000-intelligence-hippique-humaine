name: "X1000 - Diagnostic approfondi M1-M5 et PMU"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x1000-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: "Audit statique moteurs et raccordement PMU"
    if: >-
      github.repository == 'yadcaf-cloud/x1000-intelligence-hippique-humaine' &&
      github.ref == 'refs/heads/fix/audit-general-pmu-20261118' &&
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        shell: bash

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Recuperer la branche autorisee
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier depot et branche
        run: |
          set -euo pipefail

          test "$GITHUB_REPOSITORY" = \
            "yadcaf-cloud/x1000-intelligence-hippique-humaine"

          test "$GITHUB_REF" = \
            "refs/heads/fix/audit-general-pmu-20261118"

          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"

          echo "DEPOT_ET_BRANCHE_AUTORISES"

      - name: Diagnostic approfondi en lecture seule
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/x1000-diagnostic"

          python - <<'PY'
          import ast
          import hashlib
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          ROOT = Path.cwd()

          DEST = (
              Path(os.environ["RUNNER_TEMP"])
              / "x1000-diagnostic"
              / "diagnostic_approfondi.json"
          )

          REQUIRED = (
              "collecte_pmu.py",
              "adapter_collecte_tableau.py",
              "raccorder_moteurs_x1000.py",
              "verifier_raccordement_moteurs.py",
              "preparer_site_pmu.py",
          )

          PAGES = (
              "index.html",
              "tableau-pmu.html",
          )

          EXCLUDED = {
              ".git",
              ".venv",
              "venv",
              "__pycache__",
              "node_modules",
              ".tox",
              ".pytest_cache",
          }

          rapport = {
              "schema": "x1000-diagnostic-approfondi-v3",
              "date_controle": datetime.now(
                  timezone.utc
              ).isoformat(),
              "branche": os.environ.get(
                  "GITHUB_REF_NAME"
              ),
              "statut": "NON_TERMINE",
              "scripts": {},
              "pages": {},
              "moteurs": {},
              "coordination": {},
              "json_existants": {},
              "pmu": {
                  "accessible": False,
                  "courses_france_certifiees": False,
                  "participants_verifies": False,
              },
              "integrite": {},
              "erreurs": [],
              "alertes": [],
              "execution_moteurs_verifiee": False,
              "raccordement_operationnel_verifie": False,
              "pronostics_authentifies": False,
              "figes_authentifies": False,
              "deploiement_effectue": False,
          }

          def erreur(message):
              print("ERREUR:", message, flush=True)
              rapport["erreurs"].append(message)

          def alerte(message):
              print("ALERTE:", message, flush=True)
              rapport["alertes"].append(message)

          def eligible(path):
              if not path.is_file() or path.is_symlink():
                  return False

              try:
                  rel = path.relative_to(ROOT)
              except ValueError:
                  return False

              return not any(
                  part in EXCLUDED
                  for part in rel.parts
              )

          def empreintes():
              result = {}

              for path in ROOT.rglob("*"):
                  if not eligible(path):
                      continue

                  if path.suffix.lower() not in {
                      ".py", ".json", ".html",
                      ".yml", ".yaml",
                  }:
                      continue

                  digest = hashlib.sha256()

                  with path.open("rb") as handle:
                      for bloc in iter(
                          lambda: handle.read(65536),
                          b"",
                      ):
                          digest.update(bloc)

                  result[
                      path.relative_to(ROOT).as_posix()
                  ] = digest.hexdigest()

              return result

          def sauvegarder():
              DEST.write_text(
                  json.dumps(
                      rapport,
                      indent=2,
                      ensure_ascii=False,
                  ) + "\n",
                  encoding="utf-8",
              )

          before = None
          arbres = {}

          try:
              print("=== X1000 AUDIT APPROFONDI ===")
              print("MODE: LECTURE_SEULE")

              before = empreintes()

              print("=== 1. SCRIPTS REQUIS ===")

              for nom in REQUIRED:
                  path = ROOT / nom

                  info = {
                      "present": False,
                      "syntaxe_valide": False,
                  }

                  rapport["scripts"][nom] = info

                  if not eligible(path):
                      erreur(f"SCRIPT_ABSENT: {nom}")
                      continue

                  info["present"] = True

                  try:
                      raw = path.read_bytes()

                      info["sha256"] = hashlib.sha256(
                          raw
                      ).hexdigest()

                      arbre = ast.parse(
                          raw.decode("utf-8-sig"),
                          filename=nom,
                      )

                      arbres[nom] = arbre
                      info["syntaxe_valide"] = True

                      print("SCRIPT_OK:", nom)

                  except (
                      SyntaxError,
                      UnicodeError,
                      OSError,
                  ) as exc:
                      erreur(
                          f"PYTHON_INVALIDE {nom}: {exc}"
                      )

              print("=== 2. INVENTAIRE PYTHON ===")

              for path in sorted(ROOT.rglob("*.py")):
                  if not eligible(path):
                      continue

                  nom = path.relative_to(
                      ROOT
                  ).as_posix()

                  if nom in arbres:
                      continue

                  try:
                      arbre = ast.parse(
                          path.read_text(
                              encoding="utf-8-sig"
                          ),
                          filename=nom,
                      )

                      arbres[nom] = arbre

                      print("PYTHON_OK:", nom)

                  except (
                      SyntaxError,
                      UnicodeError,
                      OSError,
                  ) as exc:
                      erreur(
                          f"PYTHON_INVALIDE {nom}: {exc}"
                      )

              print("=== 3. IDENTIFICATION M1-M5 ===")

              for numero in range(1, 6):
                  moteur = f"M{numero}"

                  motif = re.compile(
                      rf"(?<![A-Za-z0-9])"
                      rf"(?:m{numero}|"
                      rf"moteur[_-]?m?{numero}|"
                      rf"engine[_-]?m?{numero})"
                      rf"(?![A-Za-z0-9])",
                      re.IGNORECASE,
                  )

                  references = []
                  definitions = []

                  for nom, arbre in arbres.items():
                      if motif.search(nom):
                          references.append(nom)

                      for node in ast.walk(arbre):
                          if isinstance(
                              node,
                              (
                                  ast.FunctionDef,
                                  ast.AsyncFunctionDef,
                                  ast.ClassDef,
                              ),
                          ) and motif.search(node.name):
                              definitions.append({
                                  "fichier": nom,
                                  "nom": node.name,
                                  "ligne": node.lineno,
                              })

                  rapport["moteurs"][moteur] = {
                      "references_fichiers": sorted(
                          set(references)
                      ),
                      "definitions": definitions,
                      "execution_verifiee": False,
                      "decision_reelle_verifiee": False,
                  }

                  if definitions:
                      print(
                          moteur,
                          "DEFINITION_STATIQUE_IDENTIFIEE",
                      )
                  elif references:
                      alerte(
                          f"{moteur}: REFERENCE_SEULEMENT"
                      )
                  else:
                      alerte(
                          f"{moteur}: NON_IDENTIFIE_LOCAL"
                      )

              print("=== 4. COORDINATION X1000 ===")

              termes = (
                  "coordination",
                  "arbitrage",
                  "arbitre",
                  "fusion",
                  "consensus",
              )

              definitions = []

              for nom, arbre in arbres.items():
                  for node in ast.walk(arbre):
                      if not isinstance(
                          node,
                          (
                              ast.FunctionDef,
                              ast.AsyncFunctionDef,
                              ast.ClassDef,
                          ),
                      ):
                          continue

                      if any(
                          terme in node.name.lower()
                          for terme in termes
                      ):
                          definitions.append({
                              "fichier": nom,
                              "nom": node.name,
                              "ligne": node.lineno,
                          })

              rapport["coordination"] = {
                  "definitions_potentielles": definitions,
                  "execution_verifiee": False,
              }

              if not definitions:
                  alerte(
                      "COORDINATION_NON_IDENTIFIEE_LOCAL"
                  )

              print("=== 5. PAGES DU SITE ===")

              for nom in PAGES:
                  path = ROOT / nom

                  info = {
                      "present": False,
                      "references": [],
                  }

                  rapport["pages"][nom] = info

                  if not eligible(path):
                      erreur(f"PAGE_ABSENTE: {nom}")
                      continue

                  try:
                      html = path.read_text(
                          encoding="utf-8"
                      )

                      if not html.strip():
                          raise ValueError(
                              "PAGE_VIDE"
                          )

                      info["present"] = True

                      info["references"] = [
                          terme
                          for terme in (
                              "publication_courses.json",
                              "recherche_courses_du_jour.json",
                              "publication_moteurs.json",
                              "pronostics-officiels",
                          )
                          if terme in html
                      ]

                      print("PAGE_OK:", nom)

                  except (
                      OSError,
                      UnicodeError,
                      ValueError,
                  ) as exc:
                      erreur(
                          f"PAGE_INVALIDE {nom}: {exc}"
                      )

              print("=== 6. JSON EXISTANTS ===")

              for nom in (
                  "sortie/publication_courses.json",
                  "sortie/recherche_courses_du_jour.json",
                  "sortie/publication_moteurs.json",
              ):
                  path = ROOT / nom

                  if not path.exists():
                      rapport["json_existants"][nom] = (
                          "ABSENT_NON_BLOQUANT"
                      )

                      alerte(
                          f"JSON_NON_GENERE: {nom}"
                      )
                      continue

                  try:
                      if not eligible(path):
                          raise ValueError(
                              "FICHIER_NON_REGULIER"
                          )

                      data = json.loads(
                          path.read_text(
                              encoding="utf-8"
                          )
                      )

                      if not isinstance(data, dict):
                          raise ValueError(
                              "OBJET_JSON_ATTENDU"
                          )

                      rapport["json_existants"][nom] = (
                          "STRUCTURE_JSON_VALIDE"
                      )

                      print("JSON_OK:", nom)

                  except (
                      ValueError,
                      UnicodeError,
                      OSError,
                  ) as exc:
                      rapport["json_existants"][nom] = (
                          "INVALIDE"
                      )

                      erreur(
                          f"JSON_INVALIDE {nom}: {exc}"
                      )

              print("=== 7. SOURCE PMU ===")

              date = datetime.now(
                  ZoneInfo("Europe/Paris")
              ).strftime("%d%m%Y")

              url = (
                  "https://online.turfinfo.api.pmu.fr"
                  "/rest/client/1/programme/"
                  + date
              )

              rapport["pmu"]["url"] = url

              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "Accept": "application/json",
                          "User-Agent": "X1000-Audit/3.0",
                      },
                  )

                  with urllib.request.urlopen(
                      req, timeout=20
                  ) as response:
                      if response.status != 200:
                          raise ValueError(
                              f"HTTP_{response.status}"
                          )

                      if response.geturl() != url:
                          raise ValueError(
                              "REDIRECTION_INATTENDUE"
                          )

                      raw = response.read(8000001)

                  if len(raw) > 8000000:
                      raise ValueError(
                          "REPONSE_TROP_VOLUMINEUSE"
                      )

                  data = json.loads(
                      raw.decode("utf-8-sig")
                  )

                  if not isinstance(data, dict):
                      raise ValueError(
                          "PROGRAMME_NON_OBJET"
                      )

                  programme = data.get(
                      "programme", data
                  )

                  if not isinstance(programme, dict):
                      raise ValueError(
                          "PROGRAMME_INVALIDE"
                      )

                  reunions = programme.get("reunions")

                  if not isinstance(reunions, list):
                      raise ValueError(
                          "REUNIONS_ABSENTES"
                      )

                  rapport["pmu"]["accessible"] = True
                  rapport["pmu"]["reunions"] = len(
                      reunions
                  )

                  print("PMU_ACCESSIBLE")
                  print("REUNIONS:", len(reunions))

                  if not reunions:
                      alerte("PROGRAMME_PMU_VIDE")

              except (
                  urllib.error.URLError,
                  TimeoutError,
                  ValueError,
                  UnicodeError,
                  OSError,
              ) as exc:
                  erreur(
                      f"SOURCE_PMU_ECHEC: {exc}"
                  )

              print("=== 8. WORKFLOWS ===")

              dossier = (
                  ROOT / ".github" / "workflows"
              )

              if not dossier.is_dir():
                  erreur(
                      "DOSSIER_WORKFLOWS_ABSENT"
                  )
              else:
                  chemins = sorted(
                      list(dossier.glob("*.yml"))
                      + list(dossier.glob("*.yaml"))
                  )

                  rapport["nombre_workflows"] = len(
                      chemins
                  )

                  for path in chemins:
                      print(
                          "WORKFLOW:",
                          path.name
                      )

          except Exception as exc:
              erreur(
                  "ERREUR_GENERALE: "
                  f"{type(exc).__name__}: {exc}"
              )

          finally:
              try:
                  after = empreintes()

                  if before is None:
                      raise RuntimeError(
                          "EMPREINTES_INITIALES_ABSENTES"
                      )

                  ajoutes = sorted(
                      set(after) - set(before)
                  )

                  supprimes = sorted(
                      set(before) - set(after)
                  )

                  modifies = sorted(
                      nom
                      for nom in set(before) & set(after)
                      if before[nom] != after[nom]
                  )

                  rapport["integrite"] = {
                      "fichiers_ajoutes": ajoutes,
                      "fichiers_supprimes": supprimes,
                      "fichiers_modifies": modifies,
                      "depot_inchange": not (
                          ajoutes or supprimes or modifies
                      ),
                  }

                  if ajoutes or supprimes or modifies:
                      erreur(
                          "INTEGRITE_DEPOT_MODIFIEE"
                      )

              except Exception as exc:
                  erreur(
                      "CONTROLE_INTEGRITE_ECHEC: "
                      f"{type(exc).__name__}: {exc}"
                  )

                  rapport["integrite"] = {
                      "depot_inchange": False,
                      "verification_impossible": True,
                  }

              rapport["statut"] = (
                  "DIAGNOSTIC_AVEC_ERREURS"
                  if rapport["erreurs"]
                  else (
                      "DIAGNOSTIC_AVEC_ALERTES"
                      if rapport["alertes"]
                      else "DIAGNOSTIC_STATIQUE_TERMINE"
                  )
              )

              sauvegarder()

              print("=== RESULTAT FINAL ===")
              print("STATUT:", rapport["statut"])
              print(
                  "ERREURS:",
                  len(rapport["erreurs"])
              )
              print(
                  "ALERTES:",
                  len(rapport["alertes"])
              )
              print("RAPPORT:", DEST)
              print("MOTEURS_NON_EXECUTES")
              print("PARTANTS_NON_VERIFIES")
              print("RACCORDEMENT_NON_CERTIFIE")
              print("AUCUN_COMMIT")
              print("AUCUN_PUSH")
              print("AUCUN_DEPLOIEMENT")
              print("AUCUN_FIGE_MODIFIE")
              print("AUCUNE_ARCHIVE_MODIFIEE")
              print("AUCUN_PRONOSTIC_MODIFIE")

          if rapport["erreurs"]:
              raise SystemExit(1)
          PY

      - name: Verifier integrite Git
        if: always()
        run: |
          set -euo pipefail

          git diff --exit-code
          git diff --cached --exit-code

          if test -n "$(git ls-files --others --exclude-standard)"; then
            echo "::error::FICHIERS_NON_SUIVIS"
            exit 1
          fi

          echo "DEPOT_INCHANGE"

      - name: Archiver le diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x1000-diagnostic-approfondi-${{ github.run_id }}
          path: ${{ runner.temp }}/x1000-diagnostic/diagnostic_approfondi.json
          if-no-files-found: warn
          retention-days: 7

      - name: Rapport final
        if: always()
        env:
          RESULTAT: ${{ job.status }}
        run: |
          {
            echo "## X1000 - Diagnostic approfondi M1-M5"
            echo ""
            echo "Resultat : $RESULTAT"
            echo "Branche : $GITHUB_REF_NAME"
            echo ""
            echo "Inventaire des scripts Python"
            echo "Identification statique des moteurs"
            echo "Recherche coordination X1000"
            echo "Controle des pages HTML"
            echo "Controle de la source PMU"
            echo "Verification integrite du depot"
            echo ""
            echo "Execution des moteurs non certifiee"
            echo "Raccordement operationnel non certifie"
            echo "Participants non verifies"
            echo ""
            echo "AUCUN COMMIT AUTOMATIQUE"
            echo "AUCUN PUSH AUTOMATIQUE"
            echo "AUCUN DEPLOIEMENT"
            echo "AUCUN FIGE MODIFIE"
            echo "AUCUNE ARCHIVE MODIFIEE"
            echo "AUCUN PRONOSTIC MODIFIE"
          } >> "$GITHUB_STEP_SUMMARY"
