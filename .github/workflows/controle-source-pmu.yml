name: "X1000 Humaine - Diagnostic source PMU"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x1000-controle-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    if: github.repository == 'yadcaf-cloud/x1000-intelligence-hippique-humaine'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tester acces et schema PMU
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          date = datetime.now(
              ZoneInfo("Europe/Paris")
          ).strftime("%d%m%Y")

          url = (
              "https://online.turfinfo.api.pmu.fr"
              "/rest/client/1/programme/" + date
          )

          req = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/json",
                  "User-Agent": "X1000-Humaine-Source/1.0"
              }
          )

          with urllib.request.urlopen(
              req, timeout=25
          ) as response:
              if (
                  response.status != 200
                  or response.geturl() != url
              ):
                  raise RuntimeError(
                      "HTTP ou redirection inattendue"
                  )
              raw = response.read(5000001)

          if len(raw) > 5000000:
              raise RuntimeError(
                  "Reponse trop volumineuse"
              )

          data = json.loads(raw.decode("utf-8-sig"))

          if not isinstance(data, dict):
              raise RuntimeError("Objet JSON attendu")

          programme = (
              data.get("programme")
              if isinstance(data.get("programme"), dict)
              else data
          )

          reunions = programme.get("reunions")
          if not isinstance(reunions, list):
              raise RuntimeError("Reunions absentes")

          print("HTTP 200 - Reunions:", len(reunions))
          print(
              "Source accessible; pays, horaires "
              "et partants non certifies par ce diagnostic"
          )
          PY
