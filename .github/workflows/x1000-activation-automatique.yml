name: "X1000 - Activation securisee V1.2"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x1000-activation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  activation:
    name: "Collecte PMU, analyses et protection archives"

    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/feature/activation-pmu-analyses-archives'

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: "Recuperer la branche securisee"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: "Installer Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verifier les moteurs et la syntaxe"
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = \
            "refs/heads/feature/activation-pmu-analyses-archives"

          python - <<'PY'
          import ast
          from pathlib import Path

          scripts = (
              "pmu_engine.py",
              "analyse_hippique.py",
              "resultats_archives.py",
          )

          for name in scripts:
              path = Path(name)

              if not path.is_file():
                  raise SystemExit(
                      f"Script absent : {name}"
                  )

              if not path.stat().st_size:
                  raise SystemExit(
                      f"Script vide : {name}"
                  )

              ast.parse(
                  path.read_text(encoding="utf-8-sig"),
                  filename=name,
              )

              print("Syntaxe OK :", name)
          PY

      - name: "Memoriser les archives historiques"
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("data/archives_resultats")
          snapshot = {}

          if root.is_symlink():
              raise SystemExit(
                  "Lien symbolique racine interdit"
              )

          if root.exists():
              if not root.is_dir():
                  raise SystemExit(
                      "Repertoire archives invalide"
                  )

              for path in sorted(root.rglob("*")):
                  if path.is_symlink():
                      raise SystemExit(
                          f"Lien symbolique interdit : {path}"
                      )

                  if path.is_file():
                      relative = path.relative_to(
                          root
                      ).as_posix()

                      snapshot[relative] = hashlib.sha256(
                          path.read_bytes()
                      ).hexdigest()

          destination = (
              Path(os.environ["RUNNER_TEMP"])
              / "x1000-archives-snapshot.json"
          )

          destination.write_text(
              json.dumps(snapshot, sort_keys=True),
              encoding="utf-8",
          )

          print("Archives protegees :", len(snapshot))
          PY

      - name: "Executer les autotests"
        run: |
          set -euo pipefail

          python pmu_engine.py --self-test
          python analyse_hippique.py --self-test
          python resultats_archives.py --self-test

          echo "Trois autotests : OK"

      - name: "Verifier les archives existantes"
        run: |
          set -euo pipefail

          python resultats_archives.py --verify-archives

          echo "Archives existantes : OK"

      - name: "Preparer environnement isole"
        run: |
          set -euo pipefail

          TEST_DIR="$RUNNER_TEMP/x1000"

          mkdir -p "$TEST_DIR/data"

          cp pmu_engine.py "$TEST_DIR/"
          cp analyse_hippique.py "$TEST_DIR/"
          cp resultats_archives.py "$TEST_DIR/"

          test -s "$TEST_DIR/pmu_engine.py"
          test -s "$TEST_DIR/analyse_hippique.py"
          test -s "$TEST_DIR/resultats_archives.py"

          echo "Environnement temporaire : OK"

      - name: "Collecter les donnees PMU reelles"
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/x1000"

          python pmu_engine.py

          test -s data/publication_courses.json
          test -s data/diagnostic_collecte_pmu.json

          echo "Collecte PMU terminee"

      - name: "Verifier donnees et fraicheur"
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/x1000"

          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from analyse_hippique import (
              validate,
              validate_course,
              parse_instant,
          )

          def unique_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(
                          f"Cle JSON dupliquee : {key}"
                      )
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError(
                  f"Constante JSON interdite : {value}"
              )

          def load_json(name):
              return json.loads(
                  Path(name).read_text(encoding="utf-8-sig"),
                  object_pairs_hook=unique_keys,
                  parse_constant=reject_constant,
              )

          payload = load_json(
              "data/publication_courses.json"
          )

          diagnostic = load_json(
              "data/diagnostic_collecte_pmu.json"
          )

          if not isinstance(payload, dict):
              raise SystemExit(
                  "Publication PMU invalide"
              )

          if not isinstance(diagnostic, dict):
              raise SystemExit(
                  "Diagnostic PMU invalide"
              )

          date = validate(payload)

          now = dt.datetime.now(dt.timezone.utc)
          today = now.astimezone(
              ZoneInfo("Europe/Paris")
          ).date().isoformat()

          if date != today:
              raise SystemExit(
                  "Date PMU incorrecte"
              )

          collected = parse_instant(
              payload["collecte_a"]
          ).astimezone(dt.timezone.utc)

          age = (now - collected).total_seconds()

          if not -300 <= age <= 1800:
              raise SystemExit(
                  "Collecte ancienne ou future"
              )

          courses = payload.get("courses")

          if not isinstance(courses, list) or not courses:
              raise SystemExit(
                  "Aucune course PMU verifiee"
              )

          ids = set()
          participants = 0

          for course in courses:
              cid = validate_course(course, date)

              if cid in ids:
                  raise SystemExit(
                      f"Course dupliquee : {cid}"
                  )

              ids.add(cid)
              participants += course["nombre_partants"]

          print("Date Paris :", today)
          print("Courses :", len(ids))
          print("Partants actifs :", participants)
          print("Fraicheur : OK")
          PY

      - name: "Produire les analyses automatiques"
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/x1000"

          python analyse_hippique.py

          test -s data/publication_analyses.json

          echo "Analyses produites"

      - name: "Verifier analyses et SHA256"
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/x1000"

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def unique_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(
                          f"Cle JSON dupliquee : {key}"
                      )
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError(
                  f"Constante interdite : {value}"
              )

          def load_json(raw):
              return json.loads(
                  raw.decode("utf-8-sig"),
                  object_pairs_hook=unique_keys,
                  parse_constant=reject_constant,
              )

          source = Path(
              "data/publication_courses.json"
          ).read_bytes()

          analysis_raw = Path(
              "data/publication_analyses.json"
          ).read_bytes()

          courses = load_json(source)
          analyses = load_json(analysis_raw)

          if not isinstance(analyses, dict):
              raise SystemExit(
                  "Analyses JSON invalides"
              )

          digest = hashlib.sha256(
              source
          ).hexdigest()

          if analyses.get("source_sha256") != digest:
              raise SystemExit(
                  "SHA256 source incoherent"
              )

          source_ids = [
              c["id"] for c in courses["courses"]
          ]

          result_courses = analyses.get("courses")

          if not isinstance(result_courses, list):
              raise SystemExit(
                  "Liste analyses invalide"
              )

          result_ids = [
              c["id"] for c in result_courses
          ]

          if len(result_ids) != len(set(result_ids)):
              raise SystemExit(
                  "Analyses dupliquees"
              )

          if set(result_ids) != set(source_ids):
              raise SystemExit(
                  "Courses analysees incoherentes"
              )

          for course in result_courses:
              for field in (
                  "fige",
                  "resultat",
                  "selection",
              ):
                  if course.get(field) is not None:
                      raise SystemExit(
                          f"Champ non autorise : {field}"
                      )

          print("Analyses :", len(result_ids))
          print("SHA256 :", digest)
          print("FIGE automatique : aucun")
          print("Resultat invente : aucun")
          PY

      - name: "Verifier archives apres execution"
        if: always()
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          snapshot_path = (
              Path(os.environ["RUNNER_TEMP"])
              / "x1000-archives-snapshot.json"
          )

          if not snapshot_path.is_file():
              raise SystemExit(
                  "Snapshot initial absent"
              )

          initial = json.loads(
              snapshot_path.read_text(encoding="utf-8")
          )

          root = Path("data/archives_resultats")
          current = {}

          if root.is_symlink():
              raise SystemExit(
                  "Lien symbolique racine interdit"
              )

          if root.exists():
              if not root.is_dir():
                  raise SystemExit(
                      "Repertoire archives invalide"
                  )

              for path in sorted(root.rglob("*")):
                  if path.is_symlink():
                      raise SystemExit(
                          "Lien symbolique interdit"
                      )

                  if path.is_file():
                      relative = path.relative_to(
                          root
                      ).as_posix()

                      current[relative] = hashlib.sha256(
                          path.read_bytes()
                      ).hexdigest()

          if current != initial:
              raise SystemExit(
                  "Archives historiques modifiees"
              )

          print("Archives historiques intactes")
          PY

          git diff --exit-code HEAD --
          git diff --cached --exit-code

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Fichiers non suivis detectes"
            exit 1
          fi

          echo "Depot Git intact"

      - name: "Conserver les donnees de test"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: x1000-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/x1000/data/publication_courses.json
            ${{ runner.temp }}/x1000/data/publication_analyses.json
            ${{ runner.temp }}/x1000/data/diagnostic_collecte_pmu.json
          retention-days: 7
          if-no-files-found: error

      - name: "Rapport de validation"
        if: success()
        run: |
          {
            echo "## X1000 - Activation securisee V1.2"
            echo ""
            echo "- Branche securisee : OK"
            echo "- Collecte PMU : OK"
            echo "- Fraicheur : OK"
            echo "- Analyses descriptives : OK"
            echo "- SHA256 : OK"
            echo "- Archives : intactes"
            echo "- Publication Git : aucune"
            echo "- Modification main : aucune"
            echo "- FIGE automatique : aucun"
            echo "- Resultat invente : aucun"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Signaler un echec"
        if: failure()
        run: |
          echo "::error::Activation X1000 V1.2 echouee"
          echo "Consulter les etapes precedentes."
          echo "Ne pas fusionner vers main."
