name: "X1000 - Activation securisee V1.6"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x1000-activation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  activation:
    name: "Controle PMU et analyses sans publication"

    if: >-
      github.repository ==
      'yadcaf-cloud/x1000-intelligence-hippique-humaine' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref ==
      'refs/heads/feature/activation-pmu-analyses-archives'

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"
      PMU_API_BASE: "https://online.turfinfo.api.pmu.fr/rest/client/7"
      TEST_DIR: ${{ runner.temp }}/x1000-test

    steps:
      - name: "Recuperer le commit exact"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: "Installer Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verifier branche et scripts"
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = \
            "refs/heads/feature/activation-pmu-analyses-archives"

          test "$GITHUB_REPOSITORY" = \
            "yadcaf-cloud/x1000-intelligence-hippique-humaine"

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          python - <<'PY'
          import ast
          from pathlib import Path

          scripts = (
              "pmu_engine.py",
              "analyse_hippique.py",
              "resultats_archives.py",
          )

          for name in scripts:
              path = Path(name)

              if path.is_symlink() or not path.is_file():
                  raise SystemExit(
                      f"::error::Script absent : {name}"
                  )

              if path.stat().st_size == 0:
                  raise SystemExit(
                      f"::error::Script vide : {name}"
                  )

              ast.parse(
                  path.read_text(encoding="utf-8-sig"),
                  filename=name,
              )

              print("Syntaxe OK :", name)
          PY

      - name: "Memoriser integrite initiale"
        id: snapshot
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          files = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).split(b"\0")

          snapshot = {}

          for raw in files:
              if not raw:
                  continue

              name = os.fsdecode(raw)
              path = Path(name)

              if path.is_symlink() or not path.is_file():
                  raise SystemExit(
                      f"::error::Fichier invalide : {name}"
                  )

              snapshot[name] = hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()

          if not snapshot:
              raise SystemExit("::error::Depot vide")

          destination = (
              Path(os.environ["RUNNER_TEMP"])
              / "x1000-snapshot.json"
          )

          destination.write_text(
              json.dumps(snapshot, sort_keys=True),
              encoding="utf-8",
          )

          print("Integrite initiale : OK")
          print("Fichiers suivis :", len(snapshot))
          PY

      - name: "Executer autotests Python"
        run: |
          set -euo pipefail

          python pmu_engine.py --self-test
          python analyse_hippique.py --self-test
          python resultats_archives.py --self-test

          echo "Autotests : OK"

      - name: "Verifier archives existantes"
        run: |
          set -euo pipefail

          python resultats_archives.py --verify-archives

          echo "Archives : verification terminee"

      - name: "Preparer environnement isole"
        run: |
          set -euo pipefail

          mkdir -p "$TEST_DIR/data"

          python - <<'PY'
          import os
          import shutil
          import subprocess
          from pathlib import Path

          root = Path(os.environ["TEST_DIR"])

          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"]
          )

          for entry in tracked.split(b"\0"):
              if not entry:
                  continue

              name = os.fsdecode(entry)
              source = Path(name)

              if source.is_symlink():
                  raise SystemExit(
                      f"::error::Lien interdit : {name}"
                  )

              if not source.is_file():
                  raise SystemExit(
                      f"::error::Fichier absent : {name}"
                  )

              if (
                  source.suffix == ".py"
                  and "data" not in source.parts
              ):
                  target = root / source
                  target.parent.mkdir(
                      parents=True,
                      exist_ok=True,
                  )
                  shutil.copyfile(source, target)

          for name in (
              "pmu_engine.py",
              "analyse_hippique.py",
              "resultats_archives.py",
          ):
              if not (root / name).is_file():
                  raise SystemExit(
                      f"::error::Script absent : {name}"
                  )

          print("Environnement isole : OK")
          PY

      - name: "Collecter donnees PMU reelles"
        id: collecte
        run: |
          set -euo pipefail

          cd "$TEST_DIR"

          python pmu_engine.py

          test -s data/publication_courses.json
          test -s data/diagnostic_collecte_pmu.json

          echo "Collecte executee"

      - name: "Valider collecte PMU"
        id: validation
        run: |
          set -euo pipefail

          cd "$TEST_DIR"

          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from analyse_hippique import (
              validate,
              validate_course,
          )

          def require(condition, message):
              if not condition:
                  raise SystemExit(
                      f"::error::{message}"
                  )

          def unique_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(
                          f"Cle dupliquee : {key}"
                      )
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError(
                  f"Constante JSON interdite : {value}"
              )

          def load(name):
              path = Path(name)

              require(
                  path.is_file()
                  and not path.is_symlink()
                  and path.stat().st_size > 0,
                  f"Fichier invalide : {name}",
              )

              return json.loads(
                  path.read_text(encoding="utf-8-sig"),
                  object_pairs_hook=unique_keys,
                  parse_constant=reject_constant,
              )

          source = load(
              "data/publication_courses.json"
          )

          diagnostic = load(
              "data/diagnostic_collecte_pmu.json"
          )

          require(
              isinstance(source, dict)
              and isinstance(diagnostic, dict),
              "Structure JSON invalide",
          )

          statut = source.get("statut")

          require(
              statut in ("OK", "PARTIEL"),
              "Statut collecte non valide",
          )

          require(
              source.get("source")
              == os.environ["PMU_API_BASE"],
              "Source PMU non autorisee",
          )

          now = dt.datetime.now(dt.timezone.utc)

          today = now.astimezone(
              ZoneInfo("Europe/Paris")
          ).date().isoformat()

          date = source.get("date")

          require(
              date == today,
              "Date programme PMU incorrecte",
          )

          timestamp = source.get("collecte_a")

          require(
              isinstance(timestamp, str),
              "Horodatage absent",
          )

          try:
              collected = dt.datetime.fromisoformat(
                  timestamp.replace("Z", "+00:00")
              )
          except ValueError:
              raise SystemExit(
                  "::error::Horodatage invalide"
              )

          require(
              collected.tzinfo is not None
              and collected.utcoffset() is not None,
              "Fuseau horaire absent",
          )

          age = (
              now - collected.astimezone(
                  dt.timezone.utc
              )
          ).total_seconds()

          require(
              -60 <= age <= 1800,
              "Collecte trop ancienne ou future",
          )

          courses = source.get("courses")

          require(
              isinstance(courses, list),
              "Liste courses invalide",
          )

          erreurs = source.get("erreurs")

          require(
              isinstance(erreurs, list),
              "Liste erreurs invalide",
          )

          if statut == "OK":
              require(
                  not erreurs,
                  "Statut OK avec erreurs",
              )

          require(
              diagnostic.get("date") == date,
              "Date diagnostic incoherente",
          )

          require(
              diagnostic.get("collecte_a")
              == timestamp,
              "Diagnostic non synchronise",
          )

          require(
              diagnostic.get("courses") == courses,
              "Courses diagnostic differentes",
          )

          require(
              diagnostic.get("statut") == statut,
              "Statut diagnostic different",
          )

          ids = []
          participants = 0

          if courses:
              validate(source)

          for course in courses:
              cid = validate_course(course, date)
              ids.append(cid)

              count = course.get("nombre_partants")

              require(
                  type(count) is int and count >= 0,
                  "Nombre partants invalide",
              )

              participants += count

          require(
              len(ids) == len(set(ids)),
              "Identifiants courses dupliques",
          )

          if not courses:
              require(
                  statut == "PARTIEL",
                  "Collecte OK sans courses",
              )
              print(
                  "::warning::Aucune course exploitable"
              )

          if statut == "PARTIEL":
              print(
                  "::warning::Collecte PMU partielle"
              )

          print("Date Paris :", today)
          print("Statut :", statut)
          print("Courses :", len(ids))
          print("Partants :", participants)
          print("Erreurs source :", len(erreurs))
          print("Validation collecte : OK")

          output = Path(os.environ["GITHUB_OUTPUT"])

          with output.open("a", encoding="utf-8") as f:
              f.write(
                  f"courses_disponibles="
                  f"{str(bool(courses)).lower()}\n"
              )
              f.write(f"statut={statut}\n")
          PY

      - name: "Produire analyses descriptives"
        if: steps.validation.outputs.courses_disponibles == 'true'
        run: |
          set -euo pipefail

          cd "$TEST_DIR"

          python analyse_hippique.py

          test -s data/publication_analyses.json

          echo "Analyses generees"

      - name: "Verifier analyses et SHA256"
        if: steps.validation.outputs.courses_disponibles == 'true'
        run: |
          set -euo pipefail

          cd "$TEST_DIR"

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from analyse_hippique import analyze

          def require(condition, message):
              if not condition:
                  raise SystemExit(
                      f"::error::{message}"
                  )

          def unique_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(
                          f"Cle dupliquee : {key}"
                      )
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError(
                  f"Constante interdite : {value}"
              )

          def load(raw):
              return json.loads(
                  raw.decode("utf-8-sig"),
                  object_pairs_hook=unique_keys,
                  parse_constant=reject_constant,
              )

          source_path = Path(
              "data/publication_courses.json"
          )

          analyses_path = Path(
              "data/publication_analyses.json"
          )

          require(
              source_path.is_file()
              and not source_path.is_symlink()
              and analyses_path.is_file()
              and not analyses_path.is_symlink(),
              "Fichiers analyses invalides",
          )

          raw = source_path.read_bytes()
          source = load(raw)
          published = load(
              analyses_path.read_bytes()
          )

          require(
              isinstance(source, dict)
              and isinstance(published, dict),
              "Structure analyses invalide",
          )

          digest = hashlib.sha256(raw).hexdigest()

          require(
              published.get("source_sha256") == digest,
              "SHA256 incorrect",
          )

          require(
              published.get("statut")
              == "DESCRIPTIF_SANS_PRONOSTIC",
              "Statut analyses invalide",
          )

          require(
              published.get("date")
              == source.get("date"),
              "Date analyses incoherente",
          )

          expected = analyze(source, raw)

          require(
              published.get("courses")
              == expected.get("courses"),
              "Analyses incoherentes",
          )

          entries = published.get("courses")

          require(
              isinstance(entries, list),
              "Liste analyses invalide",
          )

          for course in entries:
              require(
                  isinstance(course, dict),
                  "Entree analyse invalide",
              )

              for field in (
                  "fige",
                  "resultat",
                  "selection",
              ):
                  require(
                      course.get(field) is None,
                      f"Champ interdit : {field}",
                  )

          print("SHA256 :", digest)
          print("Analyses :", len(entries))
          print("Aucun FIGE genere")
          print("Validation analyses : OK")
          PY

      - name: "Verifier integrite finale"
        if: always() && steps.snapshot.outcome == 'success'
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          snapshot_path = (
              Path(os.environ["RUNNER_TEMP"])
              / "x1000-snapshot.json"
          )

          initial = json.loads(
              snapshot_path.read_text(
                  encoding="utf-8"
              )
          )

          current = {}

          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"]
          )

          for raw in tracked.split(b"\0"):
              if not raw:
                  continue

              name = os.fsdecode(raw)
              path = Path(name)

              if path.is_symlink() or not path.is_file():
                  raise SystemExit(
                      f"::error::Fichier invalide : {name}"
                  )

              current[name] = hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()

          if current != initial:
              raise SystemExit(
                  "::error::Depot modifie"
              )

          archives = Path(
              "data/archives_resultats"
          )

          if archives.is_symlink():
              raise SystemExit(
                  "::error::Lien archives interdit"
              )

          if archives.exists():
              if not archives.is_dir():
                  raise SystemExit(
                      "::error::Archives invalides"
                  )

              for path in archives.rglob("*"):
                  if path.is_symlink():
                      raise SystemExit(
                          "::error::Lien archives interdit"
                      )

          print("SHA256 depot : OK")
          print("Archives intactes")
          PY

          git diff --exit-code HEAD --
          git diff --cached --exit-code

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Fichiers non suivis"
            exit 1
          fi

          echo "Integrite finale : OK"

      - name: "Conserver diagnostic et donnees test"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x1000-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/x1000-test/data/publication_courses.json
            ${{ runner.temp }}/x1000-test/data/publication_analyses.json
            ${{ runner.temp }}/x1000-test/data/diagnostic_collecte_pmu.json
          retention-days: 7
          if-no-files-found: warn

      - name: "Rapport final"
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COLLECTE_RESULT: ${{ steps.collecte.outcome }}
          VALIDATION_RESULT: ${{ steps.validation.outcome }}
          COLLECTE_STATUT: ${{ steps.validation.outputs.statut }}
        run: |
          {
            echo "## X1000 - Activation securisee V1.6"
            echo ""
            echo "- Statut job : $JOB_STATUS"
            echo "- Branche : $GITHUB_REF"
            echo "- Commit : $GITHUB_SHA"
            echo "- Collecte : $COLLECTE_RESULT"
            echo "- Validation : $VALIDATION_RESULT"
            echo "- Statut PMU : ${COLLECTE_STATUT:-inconnu}"
            echo "- Publication automatique : aucune"
            echo "- Push automatique : aucun"
            echo "- Modification main : aucune"
            echo "- Archives historiques : lecture seule"
            echo "- Pronostics fictifs : aucun"
            echo ""
            echo "Consulter les etapes en echec si necessaire."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Signaler echec"
        if: failure()
        run: |
          echo "::error::Activation X1000 V1.6 echouee"
          echo "Consulter le rapport final et les etapes."
          echo "Ne pas fusionner vers main."
