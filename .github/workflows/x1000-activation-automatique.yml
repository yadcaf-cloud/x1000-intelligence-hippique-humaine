name: "X1000 - Activation securisee V1.4"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x1000-activation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  activation:
    name: "Collecte PMU, analyses et archives"

    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/feature/activation-pmu-analyses-archives'

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"

    steps:
      - name: "Recuperer la branche securisee"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: "Installer Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verifier la syntaxe Python"
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          for name in (
              "pmu_engine.py",
              "analyse_hippique.py",
              "resultats_archives.py",
          ):
              path = Path(name)

              if not path.is_file():
                  raise SystemExit(f"Script absent : {name}")

              if not path.stat().st_size:
                  raise SystemExit(f"Script vide : {name}")

              ast.parse(
                  path.read_text(encoding="utf-8-sig"),
                  filename=name,
              )

              print("Syntaxe OK :", name)
          PY

      - name: "Memoriser les archives historiques"
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("data/archives_resultats")
          snapshot = {}

          if root.is_symlink():
              raise SystemExit("Lien symbolique racine interdit")

          if root.exists():
              if not root.is_dir():
                  raise SystemExit("Repertoire archives invalide")

              for path in sorted(root.rglob("*")):
                  if path.is_symlink():
                      raise SystemExit(
                          f"Lien symbolique interdit : {path}"
                      )

                  if path.is_file():
                      relative = path.relative_to(root).as_posix()
                      snapshot[relative] = hashlib.sha256(
                          path.read_bytes()
                      ).hexdigest()

          destination = (
              Path(os.environ["RUNNER_TEMP"])
              / "x1000-archives-avant.json"
          )

          destination.write_text(
              json.dumps(snapshot, sort_keys=True),
              encoding="utf-8",
          )

          print("Archives memorisees :", len(snapshot))
          PY

      - name: "Executer les autotests"
        run: |
          set -euo pipefail

          python pmu_engine.py --self-test
          python analyse_hippique.py --self-test
          python resultats_archives.py --self-test

      - name: "Verifier les archives existantes"
        run: |
          set -euo pipefail

          python resultats_archives.py --verify-archives

      - name: "Preparer environnement isole"
        run: |
          set -euo pipefail

          TEST_DIR="$RUNNER_TEMP/x1000"

          mkdir -p "$TEST_DIR/data"

          cp pmu_engine.py "$TEST_DIR/"
          cp analyse_hippique.py "$TEST_DIR/"
          cp resultats_archives.py "$TEST_DIR/"

          test -s "$TEST_DIR/pmu_engine.py"
          test -s "$TEST_DIR/analyse_hippique.py"
          test -s "$TEST_DIR/resultats_archives.py"

      - name: "Collecter les donnees PMU reelles"
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/x1000"

          python pmu_engine.py

          test -s data/publication_courses.json
          test -s data/diagnostic_collecte_pmu.json

      - name: "Valider la collecte PMU"
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/x1000"

          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from analyse_hippique import (
              validate,
              validate_course,
              parse_instant,
          )

          def unique_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(
                          f"Cle JSON dupliquee : {key}"
                      )
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError(
                  f"Constante JSON interdite : {value}"
              )

          def load_json(path):
              return json.loads(
                  Path(path).read_text(encoding="utf-8-sig"),
                  object_pairs_hook=unique_keys,
                  parse_constant=reject_constant,
              )

          payload = load_json(
              "data/publication_courses.json"
          )

          diagnostic = load_json(
              "data/diagnostic_collecte_pmu.json"
          )

          if not isinstance(payload, dict):
              raise SystemExit("Publication PMU invalide")

          if not isinstance(diagnostic, dict):
              raise SystemExit("Diagnostic PMU invalide")

          date = validate(payload)

          now = dt.datetime.now(dt.timezone.utc)

          today = now.astimezone(
              ZoneInfo("Europe/Paris")
          ).date().isoformat()

          if date != today:
              raise SystemExit("Date PMU incorrecte")

          collected = parse_instant(
              payload["collecte_a"]
          ).astimezone(dt.timezone.utc)

          age = (now - collected).total_seconds()

          if not -300 <= age <= 1800:
              raise SystemExit(
                  "Collecte trop ancienne ou future"
              )

          courses = payload.get("courses")

          if not isinstance(courses, list) or not courses:
              raise SystemExit(
                  "Aucune course PMU verifiee"
              )

          ids = set()
          participants = 0

          for course in courses:
              cid = validate_course(course, date)

              if not isinstance(cid, str) or not cid:
                  raise SystemExit(
                      "Identifiant course invalide"
                  )

              if cid in ids:
                  raise SystemExit(
                      f"Course dupliquee : {cid}"
                  )

              ids.add(cid)
              participants += course["nombre_partants"]

          print("Date Paris :", today)
          print("Courses :", len(ids))
          print("Partants actifs :", participants)
          print("Fraicheur : OK")
          PY

      - name: "Produire les analyses automatiques"
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/x1000"

          python analyse_hippique.py

          test -s data/publication_analyses.json

      - name: "Verifier les analyses et SHA256"
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/x1000"

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def unique_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(
                          f"Cle JSON dupliquee : {key}"
                      )
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError(
                  f"Constante interdite : {value}"
              )

          def load_json(raw):
              return json.loads(
                  raw.decode("utf-8-sig"),
                  object_pairs_hook=unique_keys,
                  parse_constant=reject_constant,
              )

          source = Path(
              "data/publication_courses.json"
          ).read_bytes()

          output = Path(
              "data/publication_analyses.json"
          ).read_bytes()

          courses = load_json(source)
          analyses = load_json(output)

          if not isinstance(analyses, dict):
              raise SystemExit(
                  "Publication analyses invalide"
              )

          digest = hashlib.sha256(
              source
          ).hexdigest()

          if analyses.get("source_sha256") != digest:
              raise SystemExit(
                  "Empreinte SHA256 incoherente"
              )

          source_courses = courses.get("courses")

          if not isinstance(source_courses, list):
              raise SystemExit(
                  "Courses source invalides"
              )

          source_ids = []

          for course in source_courses:
              if not isinstance(course, dict):
                  raise SystemExit(
                      "Course source invalide"
                  )

              cid = course.get("id")

              if not isinstance(cid, str) or not cid:
                  raise SystemExit(
                      "Identifiant source invalide"
                  )

              source_ids.append(cid)

          if len(source_ids) != len(set(source_ids)):
              raise SystemExit(
                  "Courses source dupliquees"
              )

          result_courses = analyses.get("courses")

          if not isinstance(result_courses, list):
              raise SystemExit(
                  "Liste analyses invalide"
              )

          result_ids = []

          for course in result_courses:
              if not isinstance(course, dict):
                  raise SystemExit(
                      "Analyse course invalide"
                  )

              cid = course.get("id")

              if not isinstance(cid, str) or not cid:
                  raise SystemExit(
                      "Identifiant analyse invalide"
                  )

              result_ids.append(cid)

              for field in (
                  "fige",
                  "resultat",
                  "selection",
              ):
                  if course.get(field) is not None:
                      raise SystemExit(
                          f"Champ non autorise : {field}"
                      )

          if len(result_ids) != len(set(result_ids)):
              raise SystemExit(
                  "Analyses dupliquees"
              )

          if set(result_ids) != set(source_ids):
              raise SystemExit(
                  "Courses analysees incoherentes"
              )

          print("Analyses :", len(result_ids))
          print("SHA256 : OK")
          print("Aucun FIGE automatique")
          print("Aucun resultat invente")
          PY

      - name: "Verifier archives et integrite depot"
        if: always()
        run: |
          set -euo pipefail

          SNAPSHOT="$RUNNER_TEMP/x1000-archives-avant.json"

          if [ -f "$SNAPSHOT" ]; then
            python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("data/archives_resultats")

          snapshot_path = (
              Path(os.environ["RUNNER_TEMP"])
              / "x1000-archives-avant.json"
          )

          initial = json.loads(
              snapshot_path.read_text(encoding="utf-8")
          )

          current = {}

          if root.is_symlink():
              raise SystemExit(
                  "Lien symbolique racine interdit"
              )

          if root.exists():
              if not root.is_dir():
                  raise SystemExit(
                      "Repertoire archives invalide"
                  )

              for path in sorted(root.rglob("*")):
                  if path.is_symlink():
                      raise SystemExit(
                          "Lien symbolique interdit"
                      )

                  if path.is_file():
                      key = path.relative_to(root).as_posix()
                      current[key] = hashlib.sha256(
                          path.read_bytes()
                      ).hexdigest()

          if current != initial:
              raise SystemExit(
                  "Archives historiques modifiees"
              )

          print("Archives historiques intactes")
          PY
          else
            echo "::warning::Snapshot initial absent"
            echo "Le controle SHA256 initial n'a pas ete execute."
          fi

          if [ -d .git ]; then
            git diff --exit-code HEAD --
            git diff --cached --exit-code

            if [ -n "$(git ls-files --others --exclude-standard)" ]; then
              echo "::error::Fichiers non suivis detectes"
              exit 1
            fi

            echo "Depot Git intact"
          else
            echo "::error::Depot Git indisponible"
            exit 1
          fi

      - name: "Conserver les publications de test"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: x1000-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/x1000/data/publication_courses.json
            ${{ runner.temp }}/x1000/data/publication_analyses.json
            ${{ runner.temp }}/x1000/data/diagnostic_collecte_pmu.json
          retention-days: 7
          if-no-files-found: error

      - name: "Rapport de validation"
        if: success()
        run: |
          {
            echo "## X1000 - Activation securisee V1.4"
            echo ""
            echo "- Branche securisee : OK"
            echo "- Collecte PMU : OK"
            echo "- Fraicheur : OK"
            echo "- Analyses factuelles : OK"
            echo "- SHA256 : OK"
            echo "- Archives : intactes"
            echo "- Depot : intact"
            echo "- Artefacts de test : disponibles"
            echo "- Modification main : aucune"
            echo "- Publication Git : aucune"
            echo "- FIGE automatique : aucun"
            echo "- Resultat invente : aucun"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Signaler un echec"
        if: failure()
        run: |
          echo "::error::Activation X1000 V1.4 echouee"
          echo "Ne pas fusionner vers main."
          echo "Consulter les journaux GitHub Actions."
