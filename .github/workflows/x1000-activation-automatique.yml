name: "X1000 - Reparation et controle securise"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x1000-controle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: "Diagnostic X1000 PMU"
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    if: >-
      github.repository == 'yadcaf-cloud/x1000-intelligence-hippique-humaine' &&
      github.ref == 'refs/heads/feature/activation-pmu-analyses-archives'

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifier les fichiers Python
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          scripts = [
              "pmu_engine.py",
              "analyse_hippique.py",
              "resultats_archives.py",
          ]

          for name in scripts:
              path = Path(name)

              if not path.is_file() or path.is_symlink():
                  raise SystemExit(
                      f"::error::Fichier absent : {name}"
                  )

              ast.parse(
                  path.read_text(encoding="utf-8-sig"),
                  filename=name
              )

              print(f"OK : {name}")

          print("Syntaxe Python valide")
          PY

      - name: Verifier les archives sans modification
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          root = Path("data/archives_resultats")

          if root.is_symlink():
              raise SystemExit(
                  "::error::Archives en lien symbolique"
              )

          if root.exists() and not root.is_dir():
              raise SystemExit(
                  "::error::Chemin archives invalide"
              )

          if root.is_dir():
              for path in root.rglob("*"):
                  if path.is_symlink():
                      raise SystemExit(
                          "::error::Lien symbolique dans archives"
                      )

          print("Controle structurel des archives OK")
          print("Aucune archive modifiee")
          PY

      - name: Verifier les moteurs disponibles
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          for i in range(1, 6):
              name = f"M{i}"
              print(f"{name} : controle a completer")

          print("Aucun moteur execute")
          print("Aucun pronostic modifie")
          PY

      - name: Verifier integrite du depot
        shell: bash
        run: |
          set -euo pipefail

          git diff --exit-code HEAD --
          git diff --cached --exit-code

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Fichiers inattendus"
            exit 1
          fi

          echo "Depot intact"

      - name: Rapport final
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## X1000 PHOENIX"
            echo ""
            echo "Statut : $JOB_STATUS"
            echo "Branche : $GITHUB_REF"
            echo "Commit : $GITHUB_SHA"
            echo ""
            echo "- Diagnostic uniquement"
            echo "- Aucun deploiement"
            echo "- Aucun push automatique"
            echo "- Aucun FIGE genere"
            echo "- Archives non modifiees"
            echo "- Moteurs non executes"
            echo "- Serveur Termux non modifie"
          } >> "$GITHUB_STEP_SUMMARY"
