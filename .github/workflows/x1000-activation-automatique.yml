name: "X1000 - Activation securisee V2.0"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x1000-activation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  activation:
    name: "Controle PMU analyses archives sans publication"

    if: >-
      github.repository == 'yadcaf-cloud/x1000-intelligence-hippique-humaine' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/feature/activation-pmu-analyses-archives'

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"
      PMU_API_BASE: "https://online.turfinfo.api.pmu.fr/rest/client/7"

    steps:
      - name: "Recuperer branche securisee"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: "Installer Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verifier depot et scripts"
        run: |
          set -euo pipefail

          test "$GITHUB_REPOSITORY" = \
            "yadcaf-cloud/x1000-intelligence-hippique-humaine"

          test "$GITHUB_REF" = \
            "refs/heads/feature/activation-pmu-analyses-archives"

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          python - <<'PY'
          import ast
          from pathlib import Path

          scripts = (
              "pmu_engine.py",
              "analyse_hippique.py",
              "resultats_archives.py",
          )

          for name in scripts:
              path = Path(name)

              if path.is_symlink() or not path.is_file():
                  raise SystemExit(
                      f"::error::Script absent ou invalide : {name}"
                  )

              if path.stat().st_size == 0:
                  raise SystemExit(
                      f"::error::Script vide : {name}"
                  )

              ast.parse(
                  path.read_text(encoding="utf-8-sig"),
                  filename=name,
              )

              print("Syntaxe OK :", name)
          PY

      - name: "Preparer environnement isole"
        run: |
          set -euo pipefail

          TEST_DIR="$(mktemp -d "${RUNNER_TEMP}/x1000.XXXXXX")"
          echo "TEST_DIR=$TEST_DIR" >> "$GITHUB_ENV"

          python - "$TEST_DIR" <<'PY'
          import shutil
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          root.mkdir(parents=True, exist_ok=True)

          for name in (
              "pmu_engine.py",
              "analyse_hippique.py",
              "resultats_archives.py",
          ):
              shutil.copy2(name, root / name)

          source = Path("data/archives_resultats")
          target = root / "data/archives_resultats"

          if source.is_symlink():
              raise SystemExit(
                  "::error::Lien symbolique archives interdit"
              )

          if source.is_dir():
              for path in source.rglob("*"):
                  if path.is_symlink():
                      raise SystemExit(
                          "::error::Lien symbolique dans archives"
                      )
              shutil.copytree(source, target)
          else:
              target.mkdir(parents=True, exist_ok=True)

          print("Environnement temporaire pret")
          PY

      - name: "Executer autotests Python"
        run: |
          set -euo pipefail

          cd "$TEST_DIR"

          python pmu_engine.py --self-test
          python analyse_hippique.py --self-test
          python resultats_archives.py --self-test

          echo "Autotests termines"

      - name: "Verifier archives en isolation"
        run: |
          set -euo pipefail

          cd "$TEST_DIR"

          python resultats_archives.py --verify-archives

          echo "Archives verifiees"

      - name: "Collecter donnees PMU reelles"
        id: collecte
        run: |
          set -euo pipefail

          cd "$TEST_DIR"

          python pmu_engine.py

          test -s data/publication_courses.json
          test -s data/diagnostic_collecte_pmu.json

          echo "Collecte PMU disponible"
          echo "Aucune publication distante"

      - name: "Valider collecte PMU"
        id: validation
        run: |
          set -euo pipefail

          cd "$TEST_DIR"

          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from analyse_hippique import validate, validate_course

          def require(condition, message):
              if not condition:
                  raise SystemExit(f"::error::{message}")

          def unique_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(
                          f"Cle JSON dupliquee : {key}"
                      )
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError(
                  f"Constante JSON interdite : {value}"
              )

          def load(name):
              path = Path(name)

              require(
                  path.is_file()
                  and not path.is_symlink()
                  and path.stat().st_size > 0,
                  f"Fichier invalide : {name}",
              )

              return json.loads(
                  path.read_text(encoding="utf-8-sig"),
                  object_pairs_hook=unique_keys,
                  parse_constant=reject_constant,
              )

          source = load("data/publication_courses.json")
          diagnostic = load("data/diagnostic_collecte_pmu.json")

          require(
              isinstance(source, dict)
              and isinstance(diagnostic, dict),
              "Structure PMU invalide",
          )

          require(
              source == diagnostic,
              "Diagnostic et publication differents",
          )

          require(
              source.get("statut") == "OK",
              "Collecte PMU non complete",
          )

          require(
              source.get("source") == os.environ["PMU_API_BASE"],
              "Source PMU incorrecte",
          )

          require(
              source.get("erreurs") == [],
              "Erreurs de collecte PMU",
          )

          today = dt.datetime.now(
              ZoneInfo("Europe/Paris")
          ).date().isoformat()

          require(
              source.get("date") == today,
              "Date PMU incorrecte",
          )

          timestamp = source.get("collecte_a")

          require(
              isinstance(timestamp, str),
              "Horodatage absent",
          )

          try:
              collected = dt.datetime.fromisoformat(
                  timestamp.replace("Z", "+00:00")
              )
          except ValueError:
              raise SystemExit(
                  "::error::Horodatage invalide"
              )

          require(
              collected.utcoffset() is not None,
              "Fuseau horaire absent",
          )

          age = (
              dt.datetime.now(dt.timezone.utc)
              - collected.astimezone(dt.timezone.utc)
          ).total_seconds()

          require(
              -60 <= age <= 1800,
              "Collecte trop ancienne ou future",
          )

          validate(source)

          courses = source.get("courses")

          require(
              isinstance(courses, list) and bool(courses),
              "Aucune course exploitable",
          )

          identifiers = set()
          total_partants = 0

          for course in courses:
              cid = validate_course(course, today)

              require(
                  cid not in identifiers,
                  "Identifiant course duplique",
              )
              identifiers.add(cid)

              require(
                  course.get("localisation_france_verifiee") is True,
                  "Localisation France non verifiee",
              )

              require(
                  course.get("depart_verifie") is True,
                  "Depart non verifie",
              )

              count = course.get("nombre_partants")

              require(
                  type(count) is int and count >= 0,
                  "Nombre partants invalide",
              )

              partants = course.get("partants")

              require(
                  isinstance(partants, list),
                  "Liste partants invalide",
              )

              numeros = set()
              actifs = 0

              for cheval in partants:
                  require(
                      isinstance(cheval, dict),
                      "Cheval invalide",
                  )

                  numero = cheval.get("numero")

                  require(
                      type(numero) is int and numero > 0,
                      "Numero cheval invalide",
                  )

                  require(
                      numero not in numeros,
                      "Numero cheval duplique",
                  )

                  numeros.add(numero)

                  require(
                      isinstance(cheval.get("nom"), str)
                      and bool(cheval["nom"].strip()),
                      "Nom cheval invalide",
                  )

                  require(
                      type(cheval.get("non_partant")) is bool,
                      "Statut non-partant invalide",
                  )

                  if cheval["non_partant"] is False:
                      actifs += 1

              require(
                  actifs == count,
                  "Nombre partants actifs incoherent",
              )

              total_partants += count

          print("Date :", today)
          print("Courses :", len(identifiers))
          print("Partants actifs :", total_partants)
          print("Validation PMU OK")
          PY

      - name: "Produire analyses descriptives"
        id: analyses
        run: |
          set -euo pipefail

          cd "$TEST_DIR"

          python analyse_hippique.py

          test -s data/publication_analyses.json

          echo "Analyses descriptives produites"

      - name: "Verifier analyses et SHA256"
        run: |
          set -euo pipefail

          cd "$TEST_DIR"

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from analyse_hippique import analyze

          def require(condition, message):
              if not condition:
                  raise SystemExit(f"::error::{message}")

          def unique_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(
                          f"Cle JSON dupliquee : {key}"
                      )
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError(
                  f"Constante interdite : {value}"
              )

          def load(raw):
              return json.loads(
                  raw.decode("utf-8-sig"),
                  object_pairs_hook=unique_keys,
                  parse_constant=reject_constant,
              )

          source_path = Path("data/publication_courses.json")
          analyses_path = Path("data/publication_analyses.json")

          for path in (source_path, analyses_path):
              require(
                  path.is_file() and not path.is_symlink(),
                  f"Fichier invalide : {path}",
              )

          raw = source_path.read_bytes()
          source = load(raw)
          published = load(analyses_path.read_bytes())

          require(
              isinstance(published, dict),
              "Structure analyses invalide",
          )

          digest = hashlib.sha256(raw).hexdigest()

          require(
              published.get("source_sha256") == digest,
              "SHA256 incorrect",
          )

          require(
              published.get("date") == source.get("date"),
              "Date analyses incoherente",
          )

          require(
              published.get("statut")
              == "DESCRIPTIF_SANS_PRONOSTIC",
              "Statut analyses incorrect",
          )

          expected = analyze(source, raw)

          require(
              published.get("courses") == expected.get("courses"),
              "Analyses incoherentes",
          )

          entries = published.get("courses")

          require(
              isinstance(entries, list),
              "Liste analyses invalide",
          )

          for course in entries:
              require(
                  isinstance(course, dict),
                  "Entree analyse invalide",
              )

              for field in ("selection", "fige", "resultat"):
                  require(
                      course.get(field) is None,
                      f"Champ interdit : {field}",
                  )

          print("SHA256 :", digest)
          print("Analyses :", len(entries))
          print("Aucun FIGE genere")
          print("Validation analyses OK")
          PY

      - name: "Verifier integrite du depot"
        if: always()
        run: |
          set -euo pipefail

          git diff --exit-code HEAD --
          git diff --cached --exit-code

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Fichiers inattendus dans le depot"
            exit 1
          fi

          echo "Depot original intact"

      - name: "Rapport final"
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COLLECTE_STATUS: ${{ steps.collecte.outcome }}
          VALIDATION_STATUS: ${{ steps.validation.outcome }}
          ANALYSES_STATUS: ${{ steps.analyses.outcome }}
        run: |
          {
            echo "## X1000 - Activation securisee V2.0"
            echo ""
            echo "- Statut : $JOB_STATUS"
            echo "- Branche : $GITHUB_REF"
            echo "- Commit : $GITHUB_SHA"
            echo "- Collecte : $COLLECTE_STATUS"
            echo "- Validation : $VALIDATION_STATUS"
            echo "- Analyses : $ANALYSES_STATUS"
            echo "- Publication : aucune"
            echo "- Push automatique : aucun"
            echo "- Modification main : aucune"
            echo "- Archives : lecture seule"
            echo "- FIGE genere : aucun"
            echo ""
            echo "Ne pas fusionner avant validation complete."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Signaler echec"
        if: failure()
        run: |
          echo "::error::Activation X1000 V2.0 echouee"
          echo "Consulter les etapes du workflow"
          echo "Ne pas fusionner vers main"
