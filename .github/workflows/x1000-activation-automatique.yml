name: "X1000 PHOENIX V2 - Diagnostic securise"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x1000-diagnostic-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controle:
    name: "Controle X1000 PHOENIX"
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifier le depot
        shell: bash
        run: |
          set -euo pipefail
          echo "Depot : $GITHUB_REPOSITORY"
          echo "Branche : $GITHUB_REF_NAME"
          echo "Commit : $GITHUB_SHA"

          test "$GITHUB_REPOSITORY" = \
            "yadcaf-cloud/x1000-intelligence-hippique-humaine"

      - name: Diagnostic Python et moteurs
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          scripts = [
              "pmu_engine.py",
              "analyse_hippique.py",
              "resultats_archives.py",
          ]

          errors = []

          for name in scripts:
              path = Path(name)

              if not path.is_file():
                  errors.append(f"ABSENT : {name}")
                  continue

              try:
                  ast.parse(
                      path.read_text(encoding="utf-8-sig"),
                      filename=name
                  )
                  print(f"OK : {name}")
              except (SyntaxError, UnicodeError) as exc:
                  errors.append(f"ERREUR : {name} : {exc}")

          print("\nCONTROLE DES MOTEURS M1 A M5")

          for number in range(1, 6):
              print(
                  f"M{number} : execution non effectuee"
              )

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              raise SystemExit(1)

          print("Diagnostic Python termine")
          PY

      - name: Controle des archives
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          root = Path("data/archives_resultats")

          if root.is_symlink():
              raise SystemExit(
                  "::error::Archives : lien symbolique"
              )

          if root.exists() and not root.is_dir():
              raise SystemExit(
                  "::error::Archives : chemin invalide"
              )

          if root.is_dir():
              for item in root.rglob("*"):
                  if item.is_symlink():
                      raise SystemExit(
                          "::error::Lien symbolique detecte"
                      )

          print("Archives : controle termine")
          print("Aucune archive modifiee")
          PY

      - name: Rapport final
        if: always()
        shell: bash
        env:
          RESULTAT: ${{ job.status }}
        run: |
          {
            echo "## X1000 PHOENIX V2"
            echo ""
            echo "Statut : $RESULTAT"
            echo ""
            echo "- Controle des fichiers Python"
            echo "- M1 a M5 non executes"
            echo "- Archives non modifiees"
            echo "- Aucun pronostic modifie"
            echo "- Aucun FIGE cree"
            echo "- Aucun deploiement"
            echo "- Aucun push automatique"
            echo "- Serveur Termux non modifie"
          } >> "$GITHUB_STEP_SUMMARY"
