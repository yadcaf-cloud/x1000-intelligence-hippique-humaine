name: "X1000 - Deploiement Pages securise V1.1"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x1000-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verifier:
    name: "Verifier le portail et les JSON"

    if: >-
      github.repository ==
      'yadcaf-cloud/x1000-intelligence-hippique-humaine' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: "Recuperer le commit exact"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: "Installer Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verifier la branche et les fichiers"
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          for file in \
            index.html \
            analyse_hippique.py \
            data/publication_courses.json \
            data/publication_analyses.json
          do
            test -s "$file"
            test ! -L "$file"
          done

          test ! -L data

          echo "Branche et fichiers : OK"

      - name: "Valider les donnees reelles"
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json

          from pathlib import Path
          from analyse_hippique import (
              validate,
              validate_course,
              analyze,
          )

          def unique_keys(pairs):
              result = {}

              for key, value in pairs:
                  if key in result:
                      raise ValueError(
                          "Cle JSON dupliquee : " + key
                      )
                  result[key] = value

              return result

          def reject_constant(value):
              raise ValueError(
                  "Constante interdite : " + value
              )

          def load(path):
              return json.loads(
                  path.read_bytes(),
                  object_pairs_hook=unique_keys,
                  parse_constant=reject_constant,
              )

          source_path = Path(
              "data/publication_courses.json"
          )

          analyses_path = Path(
              "data/publication_analyses.json"
          )

          raw = source_path.read_bytes()

          courses = load(source_path)
          analyses = load(analyses_path)

          date = validate(courses)

          ids = [
              validate_course(course, date)
              for course in courses["courses"]
          ]

          if len(ids) != len(set(ids)):
              raise SystemExit(
                  "Courses PMU dupliquees"
              )

          if courses.get("source") != (
              "https://online.turfinfo.api.pmu.fr"
              "/rest/client/7"
          ):
              raise SystemExit(
                  "Source PMU non autorisee"
              )

          if courses.get("statut") != "OK":
              raise SystemExit(
                  "Collecte incomplete"
              )

          if courses.get("erreurs") != []:
              raise SystemExit(
                  "Erreurs de collecte presentes"
              )

          digest = hashlib.sha256(raw).hexdigest()

          if analyses.get("source_sha256") != digest:
              raise SystemExit(
                  "SHA256 analyses incorrect"
              )

          if analyses.get("statut") != (
              "DESCRIPTIF_SANS_PRONOSTIC"
          ):
              raise SystemExit(
                  "Statut analyses invalide"
              )

          if analyses.get("date") != date:
              raise SystemExit(
                  "Date analyses incorrecte"
              )

          expected = analyze(courses, raw)

          if analyses.get("courses") != expected["courses"]:
              raise SystemExit(
                  "Contenu des analyses incoherent"
              )

          print("Courses PMU :", len(ids))
          print("Analyses descriptives : OK")
          print("SHA256 :", digest)
          print("Validation complete : OK")
          PY

      - name: "Verifier la structure du portail"
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          html = Path("index.html").read_text(
              encoding="utf-8"
          )

          required = (
              "data/publication_courses.json",
              "data/publication_analyses.json",
              "data/publication_moteurs.json",
          )

          for item in required:
              if item not in html:
                  raise SystemExit(
                      "Reference absente : " + item
                  )

          print("References JSON du portail : OK")
          PY

  deployer:
    name: "Deploiement public apres autorisation"

    needs: verifier

    if: >-
      github.repository ==
      'yadcaf-cloud/x1000-intelligence-hippique-humaine' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    defaults:
      run:
        shell: bash

    steps:
      - name: "Recuperer le meme commit"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: "Configurer GitHub Pages"
        uses: actions/configure-pages@v5

      - name: "Preparer les fichiers publics"
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          mkdir -p _site/data

          cp index.html _site/index.html

          cp data/publication_courses.json \
            _site/data/publication_courses.json

          cp data/publication_analyses.json \
            _site/data/publication_analyses.json

          python - <<'PY'
          import hashlib
          import json
          import shutil

          from pathlib import Path

          source = Path(
              "data/publication_courses.json"
          ).read_bytes()

          motors_path = Path(
              "data/publication_moteurs.json"
          )

          if not motors_path.exists():
              print("Moteurs absents : non publies")
          elif motors_path.is_symlink():
              raise SystemExit(
                  "Lien symbolique moteurs interdit"
              )
          else:
              motors = json.loads(
                  motors_path.read_text(
                      encoding="utf-8"
                  )
              )

              digest = hashlib.sha256(
                  source
              ).hexdigest()

              if (
                  isinstance(motors, dict)
                  and motors.get("source_sha256") == digest
                  and motors.get("statut") ==
                  "PUBLICATION_MOTEURS"
                  and isinstance(
                      motors.get("courses"), list
                  )
                  and motors["courses"] == []
              ):
                  shutil.copy2(
                      motors_path,
                      "_site/data/publication_moteurs.json"
                  )

                  print(
                      "Initialisation moteurs vide : OK"
                  )
              else:
                  print(
                      "Moteurs non valides ou FIGEs "
                      "non audites : exclus"
                  )
          PY

          test -s _site/index.html
          test -s _site/data/publication_courses.json
          test -s _site/data/publication_analyses.json

          echo "Artefact public prepare"

      - name: "Envoyer les fichiers GitHub Pages"
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: "Deployer GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4

      - name: "Rapport de deploiement"
        run: |
          {
            echo "## X1000 - Pages V1.1"
            echo ""
            echo "- Branche : main"
            echo "- Validation PMU : OK"
            echo "- Analyses descriptives : OK"
            echo "- FIGEs non audites : exclus"
            echo "- Archives : non publiees"
            echo "- Deploiement Pages : termine"
          } >> "$GITHUB_STEP_SUMMARY"
