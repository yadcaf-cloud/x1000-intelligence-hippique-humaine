name: "X1000 - Deploiement Pages securise V1.2"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x1000-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verifier:
    name: "Verifier portail et publications"

    if: >-
      github.repository ==
      'yadcaf-cloud/x1000-intelligence-hippique-humaine' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"

    steps:
      - name: "Recuperer le commit exact"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: "Installer Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verifier branche et fichiers"
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          for file in \
            index.html \
            analyse_hippique.py \
            data/publication_courses.json \
            data/publication_analyses.json
          do
            if [ ! -s "$file" ] || [ -L "$file" ]; then
              echo "::error::Fichier invalide : $file"
              exit 1
            fi
          done

          test -d data
          test ! -L data

          echo "Branche main : OK"
          echo "Commit exact : OK"
          echo "Fichiers obligatoires : OK"

      - name: "Valider publications PMU reelles"
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from analyse_hippique import (
              validate,
              validate_course,
              analyze,
          )

          def unique_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(
                          f"Cle JSON dupliquee : {key}"
                      )
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError(
                  f"Constante interdite : {value}"
              )

          def load(path):
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(
                      f"Fichier JSON invalide : {path}"
                  )

              raw = path.read_bytes()

              payload = json.loads(
                  raw.decode("utf-8-sig"),
                  object_pairs_hook=unique_keys,
                  parse_constant=reject_constant,
              )

              if not isinstance(payload, dict):
                  raise SystemExit(
                      f"Objet JSON attendu : {path}"
                  )

              return payload, raw

          courses, raw = load(
              Path("data/publication_courses.json")
          )

          analyses, _ = load(
              Path("data/publication_analyses.json")
          )

          date = validate(courses)

          items = courses.get("courses")

          if not isinstance(items, list) or not items:
              raise SystemExit(
                  "Aucune course PMU verifiee"
              )

          ids = set()

          for course in items:
              cid = validate_course(course, date)

              if not isinstance(cid, str) or not cid:
                  raise SystemExit(
                      "Identifiant course invalide"
                  )

              if cid in ids:
                  raise SystemExit(
                      f"Course dupliquee : {cid}"
                  )

              ids.add(cid)

          expected_source = (
              "https://online.turfinfo.api.pmu.fr"
              "/rest/client/7"
          )

          if courses.get("source") != expected_source:
              raise SystemExit(
                  "Source PMU non autorisee"
              )

          if courses.get("statut") != "OK":
              raise SystemExit(
                  "Collecte incomplete"
              )

          if courses.get("erreurs") != []:
              raise SystemExit(
                  "Erreurs de collecte presentes"
              )

          digest = hashlib.sha256(raw).hexdigest()

          if analyses.get("source_sha256") != digest:
              raise SystemExit(
                  "SHA256 analyses incompatible"
              )

          if analyses.get("statut") != (
              "DESCRIPTIF_SANS_PRONOSTIC"
          ):
              raise SystemExit(
                  "Statut analyses invalide"
              )

          if analyses.get("date") != date:
              raise SystemExit(
                  "Date analyses incoherente"
              )

          expected = analyze(courses, raw)

          if analyses.get("courses") != expected["courses"]:
              raise SystemExit(
                  "Analyses descriptives incoherentes"
              )

          print("Date PMU :", date)
          print("Courses verifiees :", len(ids))
          print("SHA256 source :", digest)
          print("Analyses descriptives : OK")
          print("Aucune donnee inventee")
          PY

      - name: "Verifier portail et moteurs"
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          html = Path("index.html").read_text(
              encoding="utf-8-sig"
          )

          for source in (
              "data/publication_courses.json",
              "data/publication_analyses.json",
          ):
              if source not in html:
                  raise SystemExit(
                      f"Reference HTML absente : {source}"
                  )

          motors_path = Path(
              "data/publication_moteurs.json"
          )

          if not motors_path.exists():
              print(
                  "INFO - Moteurs non publies"
              )
          else:
              if (
                  motors_path.is_symlink()
                  or not motors_path.is_file()
              ):
                  raise SystemExit(
                      "Publication moteurs invalide"
                  )

              def unique_keys(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise ValueError(
                              f"Cle dupliquee : {key}"
                          )
                      result[key] = value
                  return result

              def reject_constant(value):
                  raise ValueError(
                      f"Constante interdite : {value}"
                  )

              motors = json.loads(
                  motors_path.read_text(
                      encoding="utf-8-sig"
                  ),
                  object_pairs_hook=unique_keys,
                  parse_constant=reject_constant,
              )

              digest = hashlib.sha256(
                  Path(
                      "data/publication_courses.json"
                  ).read_bytes()
              ).hexdigest()

              if not isinstance(motors, dict):
                  raise SystemExit(
                      "Objet moteurs invalide"
                  )

              if (
                  motors.get("statut")
                  != "PUBLICATION_MOTEURS"
                  or motors.get("source_sha256")
                  != digest
                  or motors.get("courses") != []
                  or type(motors.get("courses")) is not list
              ):
                  print(
                      "INFO - Moteurs non admissibles "
                      "a la publication automatique"
                  )
              else:
                  print(
                      "Publication moteurs vide : OK"
                  )

          print("References portail : OK")
          PY

      - name: "Rapport de verification"
        if: success()
        run: |
          {
            echo "## X1000 - Verification Pages V1.2"
            echo ""
            echo "- Branche main : OK"
            echo "- Commit exact : OK"
            echo "- Source PMU : OK"
            echo "- Courses verifiees : OK"
            echo "- Analyses descriptives : OK"
            echo "- Portail : OK"
            echo "- FIGEs non audites : exclus"
            echo "- Deploiement autorise pour ce commit"
          } >> "$GITHUB_STEP_SUMMARY"

  deployer:
    name: "Deploiement public apres validation"

    needs: verifier

    if: >-
      github.repository ==
      'yadcaf-cloud/x1000-intelligence-hippique-humaine' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    defaults:
      run:
        shell: bash

    steps:
      - name: "Recuperer le meme commit"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: "Configurer GitHub Pages"
        uses: actions/configure-pages@v5

      - name: "Preparer les fichiers publics"
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          test ! -L index.html
          test ! -L data
          test ! -L data/publication_courses.json
          test ! -L data/publication_analyses.json

          mkdir -p _site/data

          cp index.html _site/index.html

          cp data/publication_courses.json \
            _site/data/publication_courses.json

          cp data/publication_analyses.json \
            _site/data/publication_analyses.json

          python - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          def digest(path):
              return hashlib.sha256(
                  Path(path).read_bytes()
              ).hexdigest()

          pairs = (
              (
                  "index.html",
                  "_site/index.html",
              ),
              (
                  "data/publication_courses.json",
                  "_site/data/publication_courses.json",
              ),
              (
                  "data/publication_analyses.json",
                  "_site/data/publication_analyses.json",
              ),
          )

          for source, target in pairs:
              if digest(source) != digest(target):
                  raise SystemExit(
                      f"Copie incoherente : {source}"
                  )

          motors_path = Path(
              "data/publication_moteurs.json"
          )

          if motors_path.exists():
              if (
                  motors_path.is_symlink()
                  or not motors_path.is_file()
              ):
                  raise SystemExit(
                      "Fichier moteurs non regulier"
                  )

              def unique_keys(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise ValueError(
                              f"Cle JSON dupliquee : {key}"
                          )
                      result[key] = value
                  return result

              def reject_constant(value):
                  raise ValueError(
                      f"Constante interdite : {value}"
                  )

              motors = json.loads(
                  motors_path.read_text(
                      encoding="utf-8-sig"
                  ),
                  object_pairs_hook=unique_keys,
                  parse_constant=reject_constant,
              )

              source_hash = digest(
                  "data/publication_courses.json"
              )

              allowed = (
                  isinstance(motors, dict)
                  and motors.get("statut")
                  == "PUBLICATION_MOTEURS"
                  and motors.get("source_sha256")
                  == source_hash
                  and type(motors.get("courses")) is list
                  and motors["courses"] == []
              )

              if allowed:
                  target = Path(
                      "_site/data/publication_moteurs.json"
                  )

                  shutil.copyfile(
                      motors_path, target
                  )

                  if digest(motors_path) != digest(target):
                      raise SystemExit(
                          "Copie moteurs incoherente"
                      )

                  print(
                      "Moteurs vides publies"
                  )
              else:
                  print(
                      "Moteurs exclus : "
                      "FIGEs non audites"
                  )
          else:
              print(
                  "Aucune publication moteurs"
              )

          print("Fichiers publics verifies : OK")
          print("Archives non copiees")
          PY

          test -s _site/index.html
          test -s _site/data/publication_courses.json
          test -s _site/data/publication_analyses.json

          echo "Artefact Pages : OK"

      - name: "Envoyer artefact GitHub Pages"
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: "Deployer GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4

      - name: "Rapport de deploiement"
        if: success()
        run: |
          {
            echo "## X1000 - Pages V1.2"
            echo ""
            echo "- Branche : main"
            echo "- Validation PMU : OK"
            echo "- Analyses descriptives : OK"
            echo "- Integrite des copies : OK"
            echo "- FIGEs non audites : exclus"
            echo "- Archives : non publiees"
            echo "- Deploiement Pages : termine"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Signaler un echec"
        if: failure()
        run: |
          echo "::error::Deploiement Pages V1.2 echoue"
          echo "Consulter les journaux GitHub Actions."
