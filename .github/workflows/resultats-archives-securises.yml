name: "X1000 - Resultats et archives securises"

on:
  workflow_dispatch:

  push:
    branches:
      - "feature/activation-pmu-analyses-archives"
    paths:
      - "resultats_archives.py"
      - "data/archives_resultats/**"
      - ".github/workflows/resultats-archives-securises.yml"

permissions:
  contents: read

concurrency:
  group: x1000-archives-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archives:
    name: "Validation des resultats et archives"

    if: github.ref == 'refs/heads/feature/activation-pmu-analyses-archives'

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"

    steps:
      - name: "Recuperer la branche securisee"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Installer Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verifier la branche et les fichiers"
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = \
            "refs/heads/feature/activation-pmu-analyses-archives"

          test -s resultats_archives.py
          test -s pmu_engine.py
          test -s analyse_hippique.py

          echo "Branche securisee confirmee."
          echo "Trois moteurs Python presents."

      - name: "Verifier la syntaxe Python"
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          scripts = (
              "pmu_engine.py",
              "analyse_hippique.py",
              "resultats_archives.py",
          )

          for name in scripts:
              path = Path(name)

              ast.parse(
                  path.read_text(encoding="utf-8"),
                  filename=name
              )

              print("Syntaxe OK :", name)
          PY

      - name: "Verifier l'etat initial du depot"
        run: |
          set -euo pipefail

          git diff --exit-code
          git diff --cached --exit-code

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Fichiers non suivis avant validation."
            git ls-files --others --exclude-standard
            exit 1
          fi

          echo "Etat initial du depot propre."

      - name: "Executer les autotests des archives"
        run: |
          set -euo pipefail

          python resultats_archives.py --self-test

          echo "Autotests archives termines."

      - name: "Verifier les archives existantes"
        run: |
          set -euo pipefail

          python resultats_archives.py --verify-archives

          echo "Verification des archives terminee."

      - name: "Verifier l'integrite apres validation"
        if: always()
        run: |
          set -euo pipefail

          git diff --exit-code
          git diff --cached --exit-code

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Fichiers non suivis detectes."
            git ls-files --others --exclude-standard
            exit 1
          fi

          echo "Aucune modification du depot detectee."

      - name: "Bilan de reussite"
        if: success()
        run: |
          echo "======================================"
          echo "X1000 - ARCHIVES SECURISEES"
          echo "======================================"
          echo "Branche securisee : OK"
          echo "Syntaxe Python : OK"
          echo "Autotests archives : OK"
          echo "Verification archives : OK"
          echo "Integrite Git : OK"
          echo "Resultat officiel invente : AUCUN"
          echo "FIGE cree : AUCUN"
          echo "Publication : DESACTIVEE"
          echo "Modification main : AUCUNE"
          echo "======================================"

      - name: "Bilan d'echec"
        if: failure()
        run: |
          echo "::error::Validation des archives non reussie."
          echo "Examiner les etapes precedentes."
          echo "Ne pas fusionner vers main."
