name: "X1000 - Analyse hippique securisee V1.3"

on:
  workflow_dispatch:

  push:
    branches:
      - "feature/activation-pmu-analyses-archives"
    paths:
      - "pmu_engine.py"
      - "analyse_hippique.py"
      - "resultats_archives.py"
      - "data/publication_courses.json"
      - "data/publication_analyses.json"
      - "data/archives_resultats/**"
      - ".github/workflows/analyse-hippique-securisee.yml"

permissions:
  contents: read

concurrency:
  group: x1000-analyse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: "Validation analyses sans publication"

    if: >-
      github.repository ==
      'yadcaf-cloud/x1000-intelligence-hippique-humaine' &&
      github.ref ==
      'refs/heads/feature/activation-pmu-analyses-archives'

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"

    steps:
      - name: "Recuperer la branche securisee"
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: "Installer Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verifier branche et fichiers"
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = \
            "refs/heads/feature/activation-pmu-analyses-archives"

          for file in \
            pmu_engine.py \
            analyse_hippique.py \
            resultats_archives.py \
            data/publication_courses.json
          do
            if [ ! -s "$file" ]; then
              echo "::error::Fichier absent ou vide : $file"
              exit 1
            fi
          done

          echo "Branche securisee : OK"
          echo "Fichiers obligatoires : OK"

      - name: "Memoriser integrite initiale"
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          raw = subprocess.check_output(
              ["git", "ls-files", "-z"]
          )

          snapshot = {}

          for item in raw.split(b"\0"):
              if not item:
                  continue

              name = os.fsdecode(item)
              path = Path(name)

              if path.is_symlink():
                  raise SystemExit(
                      f"Lien symbolique interdit : {name}"
                  )

              if not path.is_file():
                  raise SystemExit(
                      f"Fichier suivi absent : {name}"
                  )

              snapshot[name] = hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()

          target = (
              Path(os.environ["RUNNER_TEMP"])
              / "x1000-analyse-snapshot.json"
          )

          target.write_text(
              json.dumps(snapshot, sort_keys=True),
              encoding="utf-8",
          )

          print("Fichiers suivis :", len(snapshot))
          print("Snapshot SHA256 : OK")
          PY

      - name: "Verifier syntaxe Python"
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          files = (
              "pmu_engine.py",
              "analyse_hippique.py",
              "resultats_archives.py",
          )

          for name in files:
              path = Path(name)

              ast.parse(
                  path.read_text(encoding="utf-8-sig"),
                  filename=name,
              )

              print("Syntaxe OK :", name)
          PY

      - name: "Executer les trois autotests"
        run: |
          set -euo pipefail

          python pmu_engine.py --self-test
          python analyse_hippique.py --self-test
          python resultats_archives.py --self-test

          echo "Trois autotests : OK"

      - name: "Verifier donnees PMU reelles"
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          from analyse_hippique import (
              validate,
              validate_course,
          )

          def unique_keys(pairs):
              result = {}

              for key, value in pairs:
                  if key in result:
                      raise ValueError(
                          f"Cle JSON dupliquee : {key}"
                      )
                  result[key] = value

              return result

          def reject_constant(value):
              raise ValueError(
                  f"Constante JSON interdite : {value}"
              )

          path = Path("data/publication_courses.json")

          payload = json.loads(
              path.read_text(encoding="utf-8-sig"),
              object_pairs_hook=unique_keys,
              parse_constant=reject_constant,
          )

          date = validate(payload)
          courses = payload.get("courses")

          if not isinstance(courses, list):
              raise SystemExit(
                  "Liste des courses invalide"
              )

          ids = set()
          total = 0

          for course in courses:
              cid = validate_course(course, date)

              if not isinstance(cid, str) or not cid:
                  raise SystemExit(
                      "Identifiant course invalide"
                  )

              if cid in ids:
                  raise SystemExit(
                      f"Course dupliquee : {cid}"
                  )

              ids.add(cid)
              total += course["nombre_partants"]

          if not ids:
              raise SystemExit(
                  "Aucune course PMU verifiee"
              )

          print("Date PMU :", date)
          print("Courses verifiees :", len(ids))
          print("Partants actifs :", total)
          print("Structure PMU : OK")
          PY

      - name: "Tester analyses sans publication"
        run: |
          set -euo pipefail

          python analyse_hippique.py --dry-run

          echo "Analyse factuelle : OK"
          echo "Aucune publication effectuee"

      - name: "Verifier archives historiques"
        run: |
          set -euo pipefail

          python resultats_archives.py --verify-archives

          echo "Archives historiques : OK"

      - name: "Verifier integrite finale SHA256"
        if: always() && steps.checkout.outcome == 'success'
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          target = (
              Path(os.environ["RUNNER_TEMP"])
              / "x1000-analyse-snapshot.json"
          )

          if not target.is_file():
              raise SystemExit(
                  "::error::Snapshot SHA256 initial absent"
              )

          initial = json.loads(
              target.read_text(encoding="utf-8")
          )

          raw = subprocess.check_output(
              ["git", "ls-files", "-z"]
          )

          current = {}

          for item in raw.split(b"\0"):
              if not item:
                  continue

              name = os.fsdecode(item)
              path = Path(name)

              if path.is_symlink():
                  raise SystemExit(
                      f"Lien symbolique interdit : {name}"
                  )

              if not path.is_file():
                  raise SystemExit(
                      f"Fichier suivi absent : {name}"
                  )

              current[name] = hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()

          if current != initial:
              changed = sorted(
                  name
                  for name
                  in set(initial) | set(current)
                  if initial.get(name) != current.get(name)
              )

              for name in changed:
                  print(
                      f"::error::Fichier modifie : {name}"
                  )

              raise SystemExit(
                  "Integrite SHA256 non respectee"
              )

          print("SHA256 des fichiers suivis : OK")
          PY

          git diff --exit-code HEAD --
          git diff --cached --exit-code

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Fichiers non suivis detectes"
            exit 1
          fi

          if [ -n "$(git ls-files --others --ignored --exclude-standard)" ]; then
            echo "::warning::Fichiers ignores presents"
          fi

          echo "Integrite Git : OK"

      - name: "Rapport final de validation"
        if: success()
        run: |
          {
            echo "## X1000 - Analyse hippique V1.3"
            echo ""
            echo "- Branche securisee : OK"
            echo "- Syntaxe Python : OK"
            echo "- Trois autotests : OK"
            echo "- Structure PMU : OK"
            echo "- Analyses dry-run : OK"
            echo "- Archives historiques : OK"
            echo "- Integrite SHA256 : OK"
            echo "- Publication : aucune"
            echo "- FIGE automatique : aucun"
            echo "- Modification main : aucune"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Signaler un echec"
        if: failure()
        run: |
          echo "::error::Analyse hippique V1.3 echouee"
          echo "Ne pas fusionner vers main."
          echo "Consulter les journaux GitHub Actions."
