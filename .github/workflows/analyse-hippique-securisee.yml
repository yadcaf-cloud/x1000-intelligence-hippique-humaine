name: "X1000 - Analyse hippique securisee"

on:
  workflow_dispatch:

  push:
    branches:
      - "feature/activation-pmu-analyses-archives"
    paths:
      - "pmu_engine.py"
      - "analyse_hippique.py"
      - ".github/workflows/analyse-hippique-securisee.yml"

permissions:
  contents: write

concurrency:
  group: x1000-analyse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyse-hippique:
    name: "Collecte PMU et analyse securisee"

    if: >-
      github.ref == 'refs/heads/feature/activation-pmu-analyses-archives'

    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: "Recuperer la branche securisee"
        uses: actions/checkout@v4
        with:
          ref: feature/activation-pmu-analyses-archives
          persist-credentials: true

      - name: "Installer Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verifier les moteurs necessaires"
        run: |
          set -euo pipefail

          for fichier in pmu_engine.py analyse_hippique.py; do
            if [ ! -s "$fichier" ]; then
              echo "::error::Fichier absent ou vide : $fichier"
              exit 1
            fi
          done

          mkdir -p data

          echo "Moteurs presents."
          echo "Repertoire de donnees pret."

      - name: "Verifier la syntaxe Python"
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          for name in (
              "pmu_engine.py",
              "analyse_hippique.py",
          ):
              source = Path(name)
              ast.parse(source.read_text(encoding="utf-8"))
              print("Syntaxe valide :", name)
          PY

      - name: "Executer les autotests"
        run: |
          set -euo pipefail

          python pmu_engine.py --self-test
          python analyse_hippique.py --self-test

          echo "Autotests termines."

      - name: "Tester le collecteur sans ecriture"
        run: |
          set -euo pipefail

          python pmu_engine.py --dry-run

      - name: "Collecter les donnees PMU reelles"
        run: |
          set -euo pipefail

          python pmu_engine.py

          if [ ! -s data/publication_courses.json ]; then
            echo "::error::Collecte PMU absente ou vide."
            exit 1
          fi

      - name: "Verifier les courses PMU"
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/publication_courses.json")

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          if not isinstance(data, dict):
              raise ValueError("Format collecte invalide")

          if data.get("statut") != "OK":
              raise ValueError("Collecte non validee")

          courses = data.get("courses")

          if not isinstance(courses, list) or not courses:
              raise ValueError("Aucune course verifiee")

          ids = set()

          for course in courses:
              if not isinstance(course, dict):
                  raise ValueError("Course invalide")

              cid = course.get("id")
              if not isinstance(cid, str) or not cid:
                  raise ValueError("Identifiant absent")

              if cid in ids:
                  raise ValueError("Course dupliquee")
              ids.add(cid)

              if course.get(
                  "localisation_france_verifiee"
              ) is not True:
                  raise ValueError(
                      f"{cid}: France non verifiee"
                  )

              if course.get("depart_verifie") is not True:
                  raise ValueError(
                      f"{cid}: depart non verifie"
                  )

              if not course.get("discipline"):
                  raise ValueError(
                      f"{cid}: discipline absente"
                  )

              partants = course.get("partants")

              if not isinstance(partants, list) or not partants:
                  raise ValueError(
                      f"{cid}: partants absents"
                  )

              if not isinstance(
                  course.get("nombre_partants"), int
              ) or course["nombre_partants"] <= 0:
                  raise ValueError(
                      f"{cid}: nombre de partants invalide"
                  )

          print("Collecte PMU validee.")
          print("Courses :", len(courses))
          PY

      - name: "Tester l'analyse sans ecriture"
        run: |
          set -euo pipefail

          python analyse_hippique.py --dry-run

      - name: "Generer les analyses factuelles"
        run: |
          set -euo pipefail

          python analyse_hippique.py

          test -s data/publication_analyses.json

      - name: "Verifier les analyses generees"
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          source = Path("data/publication_courses.json")
          output = Path("data/publication_analyses.json")

          collecte = json.loads(
              source.read_text(encoding="utf-8")
          )
          analyses = json.loads(
              output.read_text(encoding="utf-8")
          )

          empreinte = hashlib.sha256(
              source.read_bytes()
          ).hexdigest()

          if analyses.get("source_sha256") != empreinte:
              raise ValueError(
                  "Empreinte SHA256 incorrecte"
              )

          if analyses.get("date") != collecte.get("date"):
              raise ValueError(
                  "Dates incompatibles"
              )

          courses = analyses.get("courses")

          if not isinstance(courses, list) or not courses:
              raise ValueError(
                  "Analyses absentes"
              )

          for course in courses:
              if course.get("selection") is not None:
                  raise ValueError(
                      "Selection non autorisee"
                  )

              chevaux = course.get("chevaux")

              if not isinstance(chevaux, list):
                  raise ValueError(
                      "Liste de chevaux invalide"
                  )

              for cheval in chevaux:
                  if cheval.get(
                      "evaluation_sportive"
                  ) != "NON_EVALUE":
                      raise ValueError(
                          "Evaluation non autorisee"
                      )

          print("Analyses factuelles verifiees.")
          print("Courses :", len(courses))
          print("SHA256 :", empreinte)
          PY

      - name: "Verifier les fichiers de publication"
        run: |
          set -euo pipefail

          git add -- \
            data/publication_courses.json \
            data/publication_analyses.json

          if [ -f data/diagnostic_collecte_pmu.json ]; then
            git add -- data/diagnostic_collecte_pmu.json
          fi

          python - <<'PY'
          import subprocess

          allowed = {
              "data/publication_courses.json",
              "data/publication_analyses.json",
              "data/diagnostic_collecte_pmu.json",
          }

          result = subprocess.run(
              ["git", "diff", "--cached", "--name-only"],
              check=True,
              capture_output=True,
              text=True,
          )

          changed = set(result.stdout.splitlines())

          forbidden = changed - allowed

          if forbidden:
              raise ValueError(
                  "Modifications interdites : "
                  + ", ".join(sorted(forbidden))
              )

          print("Publication autorisee :", sorted(changed))
          PY

      - name: "Publier sur la branche securisee"
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "Aucune modification a publier."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m \
            "data: collecte et analyses factuelles X1000"

          git push origin \
            HEAD:feature/activation-pmu-analyses-archives

      - name: "Rapport final"
        if: always()
        run: |
          echo "================================="
          echo "X1000 - INTELLIGENCE HIPPIQUE"
          echo "================================="
          echo "Branche securisee uniquement"
          echo "Collecte PMU reelle controlee"
          echo "Analyse factuelle controlee"
          echo "Aucun pronostic fictif"
          echo "Aucun FIGE cree"
          echo "Aucun resultat officiel invente"
          echo "Aucun acces M1-M5"
          echo "Aucune modification Phoenix"
          echo "================================="
