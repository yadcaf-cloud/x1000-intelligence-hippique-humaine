name: "X1000 - Pipeline PMU et analyses securise"

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/activation-pmu-analyses-archives"
    paths:
      - "pmu_engine.py"
      - "analyse_hippique.py"
      - ".github/workflows/analyse-hippique-securisee.yml"

permissions:
  contents: write

concurrency:
  group: x1000-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    name: "Collecte analyse validation publication"

    if: github.ref == 'refs/heads/feature/activation-pmu-analyses-archives'

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"
      BRANCHE_SECUR ISEE: ""
