name: "X1000 PHOENIX - Controle courses France PMU"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/controle-courses-france-pmu.yml"

permissions:
  contents: read

concurrency:
  group: x1000-pmu-france-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controle-pmu:
    name: "Controle PMU France - reunions courses partants"
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installation Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verification du depot
        shell: bash
        run: |
          set -euo pipefail
          echo "Depot : $GITHUB_REPOSITORY"
          echo "Branche : $GITHUB_REF_NAME"

          test "$GITHUB_REPOSITORY" = \
            "yadcaf-cloud/x1000-intelligence-hippique-humaine"

          echo "DEPOT_VERIFIE"

      - name: Controle reel PMU TurfInfo
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          import re
          import sys
          import time
          import urllib.error
          import urllib.request

          from datetime import datetime
          from zoneinfo import ZoneInfo

          BASE = (
              "https://online.turfinfo.api.pmu.fr"
              "/rest/client/1/programme"
          )

          DATE = datetime.now(
              ZoneInfo("Europe/Paris")
          ).strftime("%d%m%Y")

          MAX_REUNIONS = 30
          MAX_COURSES = 40
          MAX_REQUETES = 250
          MAX_OCTETS = 8_000_000

          requetes = 0
          erreurs = []
          courses_valides = 0
          courses_incompletes = 0
          courses_etrangeres = 0
          courses_indeterminees = 0
          partants_valides = 0

          print("===================================")
          print("X1000 PHOENIX")
          print("CONTROLE REEL PMU FRANCE")
          print("===================================")
          print("Date PMU :", DATE)
          print("Mode : lecture seule")
          print("FIGES : intouchables")
          print("Archives : intouchables")
          print("Pronostics : intouchables")
          print("Aucun commit ou deploiement")
          print()

          def erreur(code, detail=""):
              message = f"{code}: {detail}"
              erreurs.append(message)
              print("ERREUR", message)

          def lire_json(url):
              global requetes

              if not url.startswith(BASE + "/"):
                  raise ValueError(
                      "URL hors source PMU autorisee"
                  )

              requetes += 1

              if requetes > MAX_REQUETES:
                  raise RuntimeError(
                      "Limite de requetes atteinte"
                  )

              demande = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": (
                          "X1000-PHOENIX-Audit/1.0"
                      )
                  },
                  method="GET"
              )

              try:
                  with urllib.request.urlopen(
                      demande,
                      timeout=18
                  ) as reponse:

                      if reponse.status != 200:
                          raise RuntimeError(
                              f"HTTP {reponse.status}"
                          )

                      if reponse.geturl() != url:
                          raise RuntimeError(
                              "Redirection non autorisee"
                          )

                      contenu = reponse.read(
                          MAX_OCTETS + 1
                      )

                      if len(contenu) > MAX_OCTETS:
                          raise RuntimeError(
                              "Reponse JSON trop volumineuse"
                          )

                      return json.loads(
                          contenu.decode("utf-8-sig")
                      )

              except urllib.error.HTTPError as exc:
                  raise RuntimeError(
                      f"HTTP {exc.code}"
                  ) from exc

              except urllib.error.URLError as exc:
                  raise RuntimeError(
                      f"Reseau : {exc.reason}"
                  ) from exc

              except json.JSONDecodeError as exc:
                  raise RuntimeError(
                      f"JSON invalide : {exc}"
                  ) from exc

          def objet(x):
              return isinstance(x, dict)

          def texte(x):
              if isinstance(x, str):
                  return x.strip()
              if isinstance(x, (int, float)):
                  return str(x)
              return ""

          def premier(d, *cles):
              if not objet(d):
                  return None
              for cle in cles:
                  valeur = d.get(cle)
                  if valeur is not None and valeur != "":
                      return valeur
              return None

          def liste_reunions(data):
              if not objet(data):
                  return None

              programme = data.get("programme")

              if objet(programme):
                  reunions = programme.get("reunions")
              else:
                  reunions = data.get("reunions")

              return (
                  reunions
                  if isinstance(reunions, list)
                  else None
              )

          def liste_courses(reunion):
              courses = premier(
                  reunion,
                  "courses",
                  "listeCourses"
              )

              return (
                  courses
                  if isinstance(courses, list)
                  else None
              )

          def liste_partants(data):
              if isinstance(data, list):
                  return data

              if objet(data):
                  for cle in (
                      "participants",
                      "partants",
                      "listeParticipants"
                  ):
                      valeur = data.get(cle)
                      if isinstance(valeur, list):
                          return valeur

              return None

          def numero(x):
              if isinstance(x, bool):
                  return None

              if isinstance(x, int):
                  return x if x > 0 else None

              if isinstance(x, str):
                  x = x.strip()
                  if re.fullmatch(r"[1-9][0-9]*", x):
                      return int(x)

              return None

          def est_france(reunion):
              hippo = reunion.get("hippodrome")
              infos = [reunion]

              if objet(hippo):
                  infos.append(hippo)

              champs = (
                  "pays",
                  "codePays",
                  "nomPays",
                  "country",
                  "countryCode",
                  "codePaysHippodrome"
              )

              codes = []

              for source in infos:
                  for champ in champs:
                      valeur = source.get(champ)

                      if objet(valeur):
                          valeur = premier(
                              valeur,
                              "code",
                              "nom",
                              "libelle"
                          )

                      if valeur is not None:
                          codes.append(
                              texte(valeur).upper()
                          )

              codes = [
                  c for c in codes if c
              ]

              france = {
                  "FR",
                  "FRA",
                  "FRANCE",
                  "FRANCAISE"
              }

              if not codes:
                  return None

              if all(c in france for c in codes):
                  return True

              if any(c not in france for c in codes):
                  return False

              return None

          def nom_hippodrome(reunion):
              hippo = reunion.get("hippodrome")

              if isinstance(hippo, str):
                  return hippo.strip()

              if objet(hippo):
                  return texte(
                      premier(
                          hippo,
                          "libelleCourt",
                          "libelleLong",
                          "nom",
                          "libelle"
                      )
                  )

              return texte(
                  premier(
                      reunion,
                      "nomHippodrome",
                      "hippodromeLibelle"
                  )
              )

          def depart_valide(course):
              depart = premier(
                  course,
                  "heureDepart",
                  "heure_depart",
                  "depart",
                  "heureDepartReelle"
              )

              if depart is None:
                  return False

              if isinstance(depart, (int, float)):
                  return depart > 0

              if isinstance(depart, str):
                  return bool(depart.strip())

              return False

          def verifier_partants(partants):
              if not isinstance(partants, list):
                  return False, 0, (
                      "liste de participants absente"
                  )

              if not partants:
                  return False, 0, (
                      "aucun participant"
                  )

              vus = set()
              actifs = 0

              for cheval in partants:
                  if not objet(cheval):
                      return False, 0, (
                          "participant non conforme"
                      )

                  n = numero(
                      premier(
                          cheval,
                          "numPmu",
                          "numero",
                          "num"
                      )
                  )

                  nom = texte(
                      premier(
                          cheval,
                          "nom",
                          "nomCheval",
                          "cheval"
                      )
                  )

                  if n is None or not nom:
                      return False, 0, (
                          "numero ou nom absent"
                      )

                  if n in vus:
                      return False, 0, (
                          "numero de partant en doublon"
                      )

                  vus.add(n)

                  np = premier(
                      cheval,
                      "nonPartant",
                      "non_partant",
                      "np"
                  )

                  if np is True:
                      continue

                  if isinstance(np, str) and (
                      np.strip().lower()
                      in ("true", "oui", "1")
                  ):
                      continue

                  actifs += 1

              if actifs == 0:
                  return False, 0, (
                      "aucun partant actif"
                  )

              return True, actifs, "OK"

          try:
              url = BASE + "/" + DATE
              programme = lire_json(url)

              reunions = liste_reunions(
                  programme
              )

              if reunions is None:
                  erreur(
                      "FORMAT_PROGRAMME_INCONNU",
                      "reunions absentes"
                  )
                  sys.exit(1)

              if not reunions:
                  erreur(
                      "PROGRAMME_VIDE",
                      "aucune reunion recue"
                  )
                  sys.exit(1)

              if len(reunions) > MAX_REUNIONS:
                  erreur(
                      "VOLUME_ANORMAL",
                      "trop de reunions"
                  )
                  sys.exit(1)

              print(
                  "Reunions recues :",
                  len(reunions)
              )

              identifiants = set()

              for reunion in reunions:
                  if not objet(reunion):
                      erreur(
                          "REUNION_INVALIDE",
                          "objet attendu"
                      )
                      continue

                  nr = numero(
                      premier(
                          reunion,
                          "numOfficiel",
                          "numeroReunion",
                          "numero"
                      )
                  )

                  if nr is None:
                      erreur(
                          "NUMERO_REUNION_ABSENT"
                      )
                      continue

                  hippo = nom_hippodrome(
                      reunion
                  )

                  localisation = est_france(
                      reunion
                  )

                  if localisation is False:
                      courses_etrangeres += 1
                      print(
                          "REUNION_EXCLUE_ETRANGER",
                          "R" + str(nr),
                          hippo
                      )
                      continue

                  if localisation is None:
                      courses_indeterminees += 1
                      print(
                          "REUNION_NON_VERIFIEE",
                          "R" + str(nr),
                          "pays absent ou inconnu"
                      )
                      continue

                  if not hippo:
                      erreur(
                          "HIPPODROME_ABSENT",
                          "R" + str(nr)
                      )
                      continue

                  courses = liste_courses(
                      reunion
                  )

                  if courses is None:
                      erreur(
                          "COURSES_ABSENTES",
                          "R" + str(nr)
                      )
                      continue

                  if len(courses) > MAX_COURSES:
                      erreur(
                          "TROP_DE_COURSES",
                          "R" + str(nr)
                      )
                      continue

                  for course in courses:
                      if not objet(course):
                          courses_incompletes += 1
                          continue

                      nc = numero(
                          premier(
                              course,
                              "numOrdre",
                              "numeroCourse",
                              "numero"
                          )
                      )

                      if nc is None:
                          courses_incompletes += 1
                          erreur(
                              "NUMERO_COURSE_ABSENT",
                              "R" + str(nr)
                          )
                          continue

                      code = (
                          f"R{nr}C{nc}"
                      )

                      identifiant = (
                          DATE,
                          nr,
                          nc
                      )

                      if identifiant in identifiants:
                          courses_incompletes += 1
                          erreur(
                              "COURSE_EN_DOUBLON",
                              code
                          )
                          continue

                      identifiants.add(
                          identifiant
                      )

                      if not depart_valide(course):
                          courses_incompletes += 1
                          erreur(
                              "DEPART_ABSENT",
                              code
                          )
                          continue

                      url_partants = (
                          BASE
                          + "/"
                          + DATE
                          + f"/R{nr}/C{nc}/participants"
                      )

                      try:
                          donnees_partants = lire_json(
                              url_partants
                          )

                      except Exception as exc:
                          courses_incompletes += 1
                          erreur(
                              "PARTANTS_INACCESSIBLES",
                              code + " " + str(exc)
                          )
                          continue

                      partants = liste_partants(
                          donnees_partants
                      )

                      ok, actifs, raison = (
                          verifier_partants(partants)
                      )

                      if not ok:
                          courses_incompletes += 1
                          erreur(
                              "PARTANTS_INVALIDES",
                              code + " " + raison
                          )
                          continue

                      courses_valides += 1
                      partants_valides += actifs

                      print(
                          "COURSE_STRUCTURE_VALIDEE",
                          code,
                          "hippodrome:",
                          hippo,
                          "partants_actifs:",
                          actifs
                      )

                      time.sleep(0.15)

          except Exception as exc:
              erreur(
                  "ERREUR_GENERALE_PMU",
                  str(exc)
              )

          print()
          print("===================================")
          print("BILAN X1000 PHOENIX")
          print("===================================")
          print(
              "Courses structurellement valides :",
              courses_valides
          )
          print(
              "Courses incompletes :",
              courses_incompletes
          )
          print(
              "Reunions etrangeres exclues :",
              courses_etrangeres
          )
          print(
              "Reunions non localisees :",
              courses_indeterminees
          )
          print(
              "Partants actifs controles :",
              partants_valides
          )
          print(
              "Requetes HTTP :",
              requetes
          )
          print(
              "Erreurs :",
              len(erreurs)
          )

          print(
              "Controle UTC :",
              datetime.now(
                  ZoneInfo("UTC")
              ).isoformat()
          )

          print()
          print("Aucune donnee inventee")
          print("Aucun FIGE modifie")
          print("Aucune archive modifiee")
          print("Aucun pronostic modifie")
          print("Aucun commit automatique")
          print("Aucun deploiement automatique")

          if courses_valides == 0:
              print(
                  "ECHEC : aucune course "
                  "francaise structurellement valide"
              )
              sys.exit(1)

          if erreurs:
              print(
                  "ECHEC_PARTIEL : anomalies detectees"
              )
              sys.exit(1)

          print(
              "CONTROLE_STRUCTURE_TERMINE"
          )
          print(
              "Authenticite et statut officiel "
              "non certifies par ce workflow"
          )
          PY

      - name: Bilan de securite
        if: always()
        shell: bash
        run: |
          echo "=================================="
          echo "X1000 PHOENIX - SECURITE"
          echo "=================================="
          echo "Workflow en lecture seule"
          echo "Aucun FIGE cree ou modifie"
          echo "Aucune archive modifiee"
          echo "Aucun pronostic modifie"
          echo "Aucun commit"
          echo "Aucun push"
          echo "Aucun deploiement"
          echo "Controle termine"
