name: "X1000 PHOENIX - Controle courses France PMU"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/controle-courses-france-pmu.yml"

permissions:
  contents: read

concurrency:
  group: x1000-controle-france-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controle:
    name: "Verification PMU France - courses et partants"
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installation Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Controle du depot
        shell: bash
        run: |
          set -euo pipefail
          echo "Depot : $GITHUB_REPOSITORY"
          echo "Branche : $GITHUB_REF_NAME"

          test "$GITHUB_REPOSITORY" = \
            "yadcaf-cloud/x1000-intelligence-hippique-humaine"

      - name: Controle PMU France
        shell: bash
        env:
          PMU_COURSES_URL: ${{ vars.PMU_COURSES_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          from datetime import datetime, timezone

          print("=== X1000 PHOENIX ===")
          print("Controle des donnees PMU France")
          print("Mode lecture seule")
          print("FIGES et archives proteges")

          url = os.getenv("PMU_COURSES_URL", "").strip()

          if not url:
              print("SOURCE_NON_CONFIGUREE")
              print("Configurer PMU_COURSES_URL")
              sys.exit(1)

          if not url.startswith("https://"):
              print("ERREUR : HTTPS obligatoire")
              sys.exit(1)

          try:
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "X1000-PHOENIX-Controle/1.0",
                      "Accept": "application/json"
                  }
              )

              with urllib.request.urlopen(
                  req, timeout=20
              ) as response:
                  data = json.load(response)

          except Exception as exc:
              print("ERREUR_CONNEXION_PMU")
              print(type(exc).__name__, str(exc))
              sys.exit(1)

          if isinstance(data, list):
              courses = data
          elif isinstance(data, dict):
              courses = data.get("courses", [])
          else:
              courses = []

          if not isinstance(courses, list):
              print("FORMAT_COURSES_INVALIDE")
              sys.exit(1)

          print("Courses recues :", len(courses))

          valides = 0
          incompletes = 0
          exclues = 0

          for course in courses:
              if not isinstance(course, dict):
                  incompletes += 1
                  continue

              pays = str(
                  course.get("pays")
                  or course.get("country")
                  or ""
              ).upper().strip()

              if pays not in ("FR", "FRA", "FRANCE"):
                  exclues += 1
                  continue

              identifiant = (
                  course.get("id")
                  or course.get("course_id")
              )

              hippodrome = course.get("hippodrome")
              depart = (
                  course.get("depart")
                  or course.get("heure_depart")
              )
              partants = course.get("partants")

              if (
                  not identifiant
                  or not hippodrome
                  or not depart
                  or not isinstance(partants, list)
                  or not partants
              ):
                  incompletes += 1
                  continue

              numeros = set()
              coherent = True

              for cheval in partants:
                  if not isinstance(cheval, dict):
                      coherent = False
                      break

                  numero = cheval.get("numero")
                  nom = cheval.get("nom")

                  if (
                      numero is None
                      or not nom
                      or str(numero) in numeros
                  ):
                      coherent = False
                      break

                  numeros.add(str(numero))

              if not coherent:
                  incompletes += 1
                  continue

              valides += 1

              print(
                  "COURSE_VALIDEE",
                  identifiant,
                  hippodrome,
                  depart,
                  "partants:",
                  len(partants)
              )

          print("=== BILAN ===")
          print("Courses France valides :", valides)
          print("Courses incompletes :", incompletes)
          print("Courses exclues :", exclues)
          print(
              "Controle UTC :",
              datetime.now(timezone.utc).isoformat()
          )

          if valides == 0:
              print("AUCUNE_COURSE_FRANCE_VALIDEE")
              sys.exit(1)

          print("CONTROLE_TERMINE")
          print("Aucune modification des donnees")
          PY

      - name: Bilan de securite
        if: always()
        shell: bash
        run: |
          echo "X1000 PHOENIX"
          echo "Controle en lecture seule"
          echo "Aucun FIGE cree ou modifie"
          echo "Aucune archive modifiee"
          echo "Aucun pronostic modifie"
          echo "Aucun commit automatique"
          echo "Aucun deploiement automatique"
