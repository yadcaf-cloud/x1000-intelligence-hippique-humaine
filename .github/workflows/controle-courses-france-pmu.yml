name: "X1000 Humaine - Controle courses France PMU"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x1000-controle-courses-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controle:
    if: github.repository == 'yadcaf-cloud/x1000-intelligence-hippique-humaine'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Controle structurel du programme PMU
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.request
          import re
          from datetime import datetime
          from zoneinfo import ZoneInfo

          date = datetime.now(
              ZoneInfo("Europe/Paris")
          ).strftime("%d%m%Y")

          base = (
              "https://online.turfinfo.api.pmu.fr"
              "/rest/client/1/programme/" + date
          )

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "X1000-Humaine-Controle/1.0"
                  }
              )
              with urllib.request.urlopen(req, timeout=18) as r:
                  if r.status != 200 or r.geturl() != url:
                      raise RuntimeError("HTTP/redirection inattendue")
                  raw = r.read(8000001)

              if len(raw) > 8000000:
                  raise RuntimeError("Reponse trop volumineuse")
              return json.loads(raw.decode("utf-8-sig"))

          def val(d, *keys):
              if not isinstance(d, dict):
                  return None
              for k in keys:
                  if d.get(k) is not None and d.get(k) != "":
                      return d[k]
              return None

          def num(v):
              if type(v) is int and v > 0:
                  return v
              if isinstance(v, str) and re.fullmatch(
                  r"[1-9][0-9]*", v
              ):
                  return int(v)
              return None

          def country(r):
              hip = r.get("hippodrome")
              values = []
              for obj in (r, hip):
                  if not isinstance(obj, dict):
                      continue
                  for key in (
                      "pays", "codePays", "nomPays",
                      "countryCode", "codePaysHippodrome"
                  ):
                      v = obj.get(key)
                      if isinstance(v, dict):
                          v = val(v, "code", "nom", "libelle")
                      if v is not None:
                          values.append(str(v).strip().upper())

              france = (
                  "FR", "FRA", "FRANCE",
                  "FRANCAISE", "FRANÇAISE"
              )
              return bool(values) and all(
                  v in france for v in values
              )

          data = fetch(base)
          programme = val(data, "programme") or data
          reunions = val(programme, "reunions")

          if not isinstance(reunions, list) or not reunions:
              raise SystemExit("Programme/reunions absents")

          if len(reunions) > 30:
              raise SystemExit("Nombre de reunions anormal")

          valid = 0
          anomalies = []
          seen = set()
          total = 0

          for r in reunions:
              if not isinstance(r, dict) or not country(r):
                  continue

              nr = num(val(
                  r, "numOfficiel", "numeroReunion",
                  "numReunion", "numero"
              ))
              courses = val(r, "courses", "listeCourses")

              if nr is None or not isinstance(courses, list):
                  anomalies.append("Reunion incomplete")
                  continue

              if len(courses) > 40:
                  anomalies.append(f"R{nr}: trop de courses")
                  continue

              for c in courses:
                  if not isinstance(c, dict):
                      continue

                  nc = num(val(
                      c, "numOrdre", "numCourse",
                      "numeroCourse", "numero"
                  ))

                  if nc is None:
                      anomalies.append(
                          f"R{nr}: numero course absent"
                      )
                      continue

                  cid = (nr, nc)
                  if cid in seen:
                      anomalies.append(
                          f"R{nr}C{nc}: doublon"
                      )
                      continue
                  seen.add(cid)

                  depart = val(
                      c, "heureDepart",
                      "heureDepartInitiale",
                      "heureDepartPrevue"
                  )
                  if isinstance(depart, bool) or not depart:
                      anomalies.append(
                          f"R{nr}C{nc}: depart absent"
                      )
                      continue

                  try:
                      ps = fetch(
                          base + f"/R{nr}/C{nc}/participants"
                      )
                      if isinstance(ps, dict):
                          ps = val(
                              ps, "participants",
                              "partants", "listeParticipants"
                          )
                      if not isinstance(ps, list) or not ps:
                          raise ValueError("Partants absents")

                      numeros = set()
                      actifs = 0

                      for p in ps:
                          n = num(val(
                              p, "numPmu", "numero", "num"
                          ))
                          nom = val(p, "nom", "nomCheval")

                          if (
                              n is None or n in numeros
                              or not isinstance(nom, str)
                              or not nom.strip()
                          ):
                              raise ValueError("Partant invalide")

                          numeros.add(n)
                          np = val(
                              p, "nonPartant", "non_partant"
                          )
                          if np not in (True, "true", "oui", "1"):
                              actifs += 1

                      if not actifs:
                          raise ValueError("Aucun actif")

                      valid += 1
                      total += actifs
                      print(
                          f"R{nr}C{nc}: {actifs} partants actifs"
                      )

                  except Exception as e:
                      anomalies.append(f"R{nr}C{nc}: {e}")

          print(
              "Courses valides:", valid,
              "Partants actifs:", total,
              "Anomalies:", len(anomalies)
          )

          for e in anomalies[:40]:
              print("ANOMALIE:", e)

          if valid == 0:
              raise SystemExit(
                  "Aucune course francaise valide"
              )
          if anomalies:
              raise SystemExit(
                  "Controle partiel: anomalies detectees"
              )
          PY
