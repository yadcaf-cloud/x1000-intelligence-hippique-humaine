name: "X1000 - Intelligence Hippique Humaine - Collecte PMU France"

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: x1000-collecte-pmu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collecte-pmu:
    name: "Controle PMU France - reunions courses partants"
    if: >-
      github.repository == 'yadcaf-cloud/x1000-intelligence-hippique-humaine' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installation Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Controle de securite
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "yadcaf-cloud/x1000-intelligence-hippique-humaine"
          test "$GITHUB_REF_NAME" = "main"
          echo "DEPOT_VERIFIE / MODE_LECTURE_SEULE"
          mkdir -p sortie

      - name: Collecte reelle PMU TurfInfo
        id: collecte
        shell: bash
        env:
          TZ: Europe/Paris
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request
          import urllib.error
          from datetime import datetime
          from zoneinfo import ZoneInfo

          BASES = [
              "https://online.turfinfo.api.pmu.fr/rest/client/1",
              "https://offline.turfinfo.api.pmu.fr/rest/client/7",
              "https://online.turfinfo.api.pmu.fr/rest/client/7",
              "https://offline.turfinfo.api.pmu.fr/rest/client/1",
          ]

          now = datetime.now(ZoneInfo("Europe/Paris"))
          date_pmu = now.strftime("%d%m%Y")
          iso_date = now.strftime("%Y-%m-%d")

          errors = []
          warnings = []
          attempts = []

          def field(obj, *keys):
              if not isinstance(obj, dict):
                  return None
              for key in keys:
                  value = obj.get(key)
                  if value is not None and value != "":
                      return value
              return None

          def entries(obj, *keys):
              value = field(obj, *keys)
              return value if isinstance(value, list) else []

          def positive_int(value):
              if isinstance(value, bool):
                  return None
              try:
                  number = int(value)
                  return number if number > 0 else None
              except (TypeError, ValueError, OverflowError):
                  return None

          def extract_list(obj, keys):
              if isinstance(obj, list):
                  return obj
              if not isinstance(obj, dict):
                  return []
              for key in keys:
                  value = obj.get(key)
                  if isinstance(value, list):
                      return value
              for wrapper in ("programme", "data", "resultat"):
                  nested = obj.get(wrapper)
                  if isinstance(nested, (dict, list)):
                      result = extract_list(nested, keys)
                      if result:
                          return result
              return []

          def fetch(base, path):
              url = base + path
              for attempt in range(2):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={
                              "Accept": "application/json",
                              "User-Agent": "Mozilla/5.0 X1000-PHOENIX-ReadOnly",
                          },
                      )
                      with urllib.request.urlopen(request, timeout=12) as response:
                          raw = response.read(8_000_001)
                          status = response.status
                          content_type = response.headers.get("Content-Type", "")

                      if len(raw) > 8_000_000:
                          raise ValueError("Reponse trop volumineuse")

                      data = json.loads(raw.decode("utf-8-sig"))
                      if not isinstance(data, (dict, list)):
                          raise ValueError("Structure JSON invalide")

                      attempts.append({
                          "url": url,
                          "http": status,
                          "content_type": content_type,
                          "statut": "HTTP_OK",
                          "taille": len(raw),
                          "cles": list(data.keys())[:30] if isinstance(data, dict) else [],
                      })
                      return data, url

                  except Exception as exc:
                      attempts.append({
                          "url": url,
                          "statut": "ERREUR",
                          "tentative": attempt + 1,
                          "message": f"{type(exc).__name__}: {exc}"[:500],
                      })
                      if attempt == 0:
                          time.sleep(0.5)
              return None, None

          def country_of(meeting):
              keys = ("pays", "codePays", "paysCode", "codePaysHippodrome")
              value = field(meeting, *keys)
              hippo = field(meeting, "hippodrome")
              if value is None and isinstance(hippo, dict):
                  value = field(hippo, *keys)
              if isinstance(value, dict):
                  value = field(value, "code", "nom", "libelle")
              if isinstance(value, str):
                  return value.strip().upper()
              return None

          def hippo_name(meeting):
              value = field(meeting, "hippodrome")
              if isinstance(value, dict):
                  value = field(value, "libelleCourt", "libelleLong", "nom")
              if isinstance(value, str) and value.strip():
                  return value.strip()
              return None

          def valid_departure(value):
              if isinstance(value, bool) or value is None:
                  return False
              if isinstance(value, (int, float)):
                  return value > 0
              return isinstance(value, str) and bool(value.strip())

          def write_json(filename, obj):
              os.makedirs("sortie", exist_ok=True)
              with open(os.path.join("sortie", filename), "w", encoding="utf-8") as handle:
                  json.dump(obj, handle, ensure_ascii=False, indent=2)

          diagnostic = {
              "systeme": "X1000 PHOENIX",
              "mode": "LECTURE_SEULE",
              "source": "PMU TurfInfo",
              "date": iso_date,
              "collecte_a": now.isoformat(),
              "statut": "EN_COURS",
              "reunions_france": 0,
              "courses_france": 0,
              "partants_identifies": 0,
              "erreurs": errors,
              "avertissements": warnings,
              "tentatives_http": attempts,
          }

          output = {
              "systeme": "X1000 PHOENIX",
              "date": iso_date,
              "source": "PMU TurfInfo",
              "verification": "collecte_structurelle",
              "reunions": [],
          }

          try:
              programme = None
              programme_url = None
              meetings = []

              for base in BASES:
                  candidate, url = fetch(base, f"/programme/{date_pmu}")
                  if candidate is None:
                      continue

                  found = extract_list(candidate, ("reunions", "réunions"))
                  if found:
                      programme = candidate
                      programme_url = url
                      meetings = found
                      break

                  warnings.append(
                      f"Programme sans reunions exploitables: {url}"
                  )

              if not meetings:
                  raise RuntimeError(
                      "Aucune reunion exploitable dans les reponses TurfInfo"
                  )

              diagnostic["url_programme"] = programme_url
              seen_meetings = set()
              seen_races = set()

              for meeting in meetings:
                  if not isinstance(meeting, dict):
                      warnings.append("Reunion de format invalide")
                      continue

                  nr = positive_int(field(
                      meeting, "numOfficiel", "numeroReunion", "numReunion"
                  ))
                  if nr is None:
                      warnings.append("Reunion sans numero officiel")
                      continue

                  if nr in seen_meetings:
                      errors.append(f"R{nr}: reunion dupliquee")
                      continue
                  seen_meetings.add(nr)

                  country = country_of(meeting)
                  if country not in ("FRANCE", "FR", "FRA"):
                      warnings.append(
                          f"R{nr}: pays non francais ou non verifie ({country})"
                      )
                      continue

                  hippo = hippo_name(meeting)
                  if not hippo:
                      warnings.append(f"R{nr}: hippodrome non identifiable")
                      continue

                  courses = extract_list(meeting, ("courses",))
                  if not courses:
                      warnings.append(f"R{nr}: aucune course fournie")
                      continue

                  item = {
                      "id": f"{iso_date}-R{nr}",
                      "numero": nr,
                      "hippodrome": hippo,
                      "pays": country,
                      "courses": [],
                  }

                  for course in courses:
                      if not isinstance(course, dict):
                          warnings.append(f"R{nr}: course invalide")
                          continue

                      nc = positive_int(field(
                          course, "num", "numCourse",
                          "numeroCourse", "numOfficiel"
                      ))
                      if nc is None:
                          warnings.append(f"R{nr}: course sans numero")
                          continue

                      cid = f"{iso_date}-R{nr}-C{nc}"
                      if cid in seen_races:
                          errors.append(f"{cid}: course dupliquee")
                          continue
                      seen_races.add(cid)

                      start = field(
                          course, "heureDepart", "heureDepartInitiale"
                      )
                      if not valid_departure(start):
                          errors.append(f"{cid}: horaire invalide")
                          continue

                      pdata = None
                      participants_url = None
                      participants = []

                      path = (
                          f"/programme/{date_pmu}/R{nr}/C{nc}/participants"
                      )

                      for base in BASES:
                          candidate, url = fetch(base, path)
                          if candidate is None:
                              continue
                          found = extract_list(
                              candidate, ("participants", "partants")
                          )
                          if found:
                              pdata = candidate
                              participants_url = url
                              participants = found
                              break

                      if not participants:
                          errors.append(
                              f"{cid}: aucun participant exploitable"
                          )
                          continue

                      horses = []
                      seen_numbers = set()
                      invalid = False

                      for p in participants:
                          if not isinstance(p, dict):
                              errors.append(f"{cid}: participant invalide")
                              invalid = True
                              break

                          num = positive_int(field(
                              p, "numPmu", "numero", "num"
                          ))
                          name = field(p, "nom", "nomCheval")

                          if num is None or not isinstance(name, str) or not name.strip():
                              errors.append(
                                  f"{cid}: participant sans numero ou nom"
                              )
                              invalid = True
                              break

                          if num in seen_numbers:
                              errors.append(
                                  f"{cid}: numero duplique {num}"
                              )
                              invalid = True
                              break

                          seen_numbers.add(num)
                          non_runner = field(p, "nonPartant")
                          if not isinstance(non_runner, bool):
                              non_runner = None

                          horses.append({
                              "numero": num,
                              "nom": name.strip(),
                              "jockey": field(p, "jockey", "driver"),
                              "entraineur": field(p, "entraineur"),
                              "non_partant": non_runner,
                          })

                      if invalid or not horses:
                          continue

                      item["courses"].append({
                          "id": cid,
                          "reunion": nr,
                          "course": nc,
                          "nom": field(
                              course, "libelle", "libelleCourt", "nom"
                          ),
                          "heure_depart": start,
                          "distance": field(course, "distance"),
                          "discipline": field(course, "discipline"),
                          "nombre_partants": len(horses),
                          "partants": horses,
                          "source": participants_url,
                          "statut": "COLLECTE_STRUCTURELLE_VERIFIEE",
                      })

                      diagnostic["courses_france"] += 1
                      diagnostic["partants_identifies"] += len(horses)
                      time.sleep(0.15)

                  if item["courses"]:
                      output["reunions"].append(item)
                      diagnostic["reunions_france"] += 1

              if diagnostic["courses_france"] == 0:
                  raise RuntimeError(
                      "Aucune course francaise exploitable avec partants"
                  )

              diagnostic["statut"] = (
                  "PARTIEL" if errors or warnings else "OK"
              )

          except Exception as exc:
              errors.append(f"{type(exc).__name__}: {exc}")
              diagnostic["statut"] = "ECHEC"

          finally:
              output["statut_collecte"] = diagnostic["statut"]
              write_json("courses-pmu-france.json", output)
              write_json("diagnostic-collecte-pmu.json", diagnostic)
              print(json.dumps(diagnostic, ensure_ascii=False, indent=2))

          if diagnostic["statut"] == "ECHEC":
              sys.exit(1)
          PY

      - name: Validation des fichiers JSON
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json

          with open("sortie/diagnostic-collecte-pmu.json", encoding="utf-8") as f:
              d = json.load(f)

          with open("sortie/courses-pmu-france.json", encoding="utf-8") as f:
              data = json.load(f)

          assert d["statut"] in ("OK", "PARTIEL", "ECHEC")
          assert data["date"] == d["date"]
          assert data["statut_collecte"] == d["statut"]
          assert len(data["reunions"]) == d["reunions_france"]

          race_ids = set()
          meeting_ids = set()
          total_races = 0
          total_horses = 0

          for meeting in data["reunions"]:
              assert meeting["pays"] in ("FRANCE", "FR", "FRA")
              assert meeting["id"] not in meeting_ids
              meeting_ids.add(meeting["id"])
              assert meeting["hippodrome"] and meeting["courses"]

              for race in meeting["courses"]:
                  assert race["id"] not in race_ids
                  race_ids.add(race["id"])
                  assert race["heure_depart"] is not None
                  assert race["source"]
                  assert race["partants"]

                  nums = [p["numero"] for p in race["partants"]]
                  assert len(nums) == len(set(nums))
                  assert len(nums) == race["nombre_partants"]

                  for horse in race["partants"]:
                      assert type(horse["numero"]) is int
                      assert horse["numero"] > 0
                      assert isinstance(horse["nom"], str)
                      assert horse["nom"].strip()

                  total_races += 1
                  total_horses += len(nums)

          assert total_races == d["courses_france"]
          assert total_horses == d["partants_identifies"]

          if d["statut"] != "ECHEC":
              assert total_races > 0
              assert total_horses > 0

          print("VALIDATION_JSON_X1000_OK")
          print(
              f"Statut={d['statut']} "
              f"Reunions={len(meeting_ids)} "
              f"Courses={total_races} "
              f"Partants={total_horses}"
          )
          PY

      - name: Publier les diagnostics en artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x1000-collecte-pmu-france-${{ github.run_id }}
          path: sortie/
          if-no-files-found: warn
          retention-days: 7

      - name: Resume de securite
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## X1000 PHOENIX - Collecte PMU France"
            echo ""
            echo "- Depot : $GITHUB_REPOSITORY"
            echo "- Branche : $GITHUB_REF_NAME"
            echo "- Mode : lecture seule"
            echo "- Source : PMU TurfInfo"
            echo "- FIGEs, archives, pronostics, M1-M5 : non modifies"
            echo "- Commit, push, deploiement : aucun"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f sortie/diagnostic-collecte-pmu.json ]]; then
            python - <<'PY'
          import json
          import os

          with open("sortie/diagnostic-collecte-pmu.json", encoding="utf-8") as f:
              d = json.load(f)

          lines = [
              "### Diagnostic PMU",
              "",
              f"- Statut : {d['statut']}",
              f"- Reunions : {d['reunions_france']}",
              f"- Courses : {d['courses_france']}",
              f"- Partants : {d['partants_identifies']}",
              f"- Erreurs : {len(d['erreurs'])}",
              f"- Avertissements : {len(d['avertissements'])}",
              f"- Tentatives HTTP : {len(d.get('tentatives_http', []))}",
              "",
          ]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY
          fi

          echo "Diagnostics disponibles dans les artifacts." >> "$GITHUB_STEP_SUMMARY"
