
name: "X1000 - Intelligence Hippique Humaine - Collecte PMU France"

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: x1000-collecte-pmu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collecte-pmu:
    name: "Controle PMU France - reunions courses partants"
    if: >-
      github.repository == 'yadcaf-cloud/x1000-intelligence-hippique-humaine' &&
      (github.event_name == 'schedule' ||
       github.ref_name == 'fix/pmu-github-tableau-20261117')
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installation Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Controle de securite
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REPOSITORY" = \
            "yadcaf-cloud/x1000-intelligence-hippique-humaine"

          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            test "$GITHUB_REF_NAME" = \
              "fix/pmu-github-tableau-20261117"
          fi

          echo "DEPOT_ET_BRANCHE_VERIFIES"
          echo "MODE_LECTURE_SEULE"
          mkdir -p sortie

      - name: Collecte reelle PMU TurfInfo
        shell: bash
        env:
          TZ: Europe/Paris
        run: |
          set -euo pipefail
          mkdir -p sortie

          cat > /tmp/x1000_collecte.py <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request
          import urllib.error
          from datetime import datetime
          from zoneinfo import ZoneInfo

          BASES = [
              "https://online.turfinfo.api.pmu.fr/rest/client/1",
              "https://offline.turfinfo.api.pmu.fr/rest/client/7",
          ]

          NOW = datetime.now(ZoneInfo("Europe/Paris"))
          DATE = NOW.strftime("%d%m%Y")
          ISO_DATE = NOW.strftime("%Y-%m-%d")

          ERRORS = []
          WARNINGS = []
          FRANCE = {"FRANCE", "FR", "FRA"}

          def field(obj, *keys):
              if not isinstance(obj, dict):
                  return None
              for key in keys:
                  value = obj.get(key)
                  if value is not None and value != "":
                      return value
              return None

          def number(value):
              if isinstance(value, bool):
                  return None
              try:
                  n = int(value)
                  return n if n > 0 else None
              except (ValueError, TypeError, OverflowError):
                  return None

          def list_field(obj, *keys):
              value = field(obj, *keys)
              return value if isinstance(value, list) else []

          def get_json(path):
              failures = []

              for base in BASES:
                  url = base + path

                  for attempt in range(2):
                      try:
                          req = urllib.request.Request(
                              url,
                              headers={
                                  "Accept": "application/json",
                                  "User-Agent": "Mozilla/5.0 X1000-PHOENIX",
                              },
                          )

                          with urllib.request.urlopen(
                              req, timeout=15
                          ) as response:
                              raw = response.read(8_000_001)

                          if len(raw) > 8_000_000:
                              raise ValueError(
                                  "Reponse PMU trop volumineuse"
                              )

                          data = json.loads(raw)

                          if not isinstance(data, (dict, list)):
                              raise ValueError(
                                  "Structure JSON PMU invalide"
                              )

                          return data, url

                      except Exception as exc:
                          failures.append(
                              f"{url}: {type(exc).__name__}: {exc}"
                          )

                          if attempt == 0:
                              time.sleep(1)

              raise RuntimeError(" | ".join(failures))

          def country_of(reunion):
              keys = (
                  "pays",
                  "codePays",
                  "paysCode",
                  "codePaysHippodrome",
              )

              value = field(reunion, *keys)
              hippo = field(reunion, "hippodrome")

              if isinstance(hippo, dict):
                  value = value or field(hippo, *keys)

              if isinstance(value, dict):
                  value = field(
                      value, "code", "nom", "libelle"
                  )

              if not isinstance(value, str):
                  return None

              return value.strip().upper()

          def meeting_number(reunion):
              return number(field(
                  reunion,
                  "numOfficiel",
                  "numeroReunion",
                  "numReunion",
              ))

          def race_number(course):
              return number(field(
                  course,
                  "num",
                  "numCourse",
                  "numeroCourse",
                  "numOfficiel",
              ))

          def participants_of(data):
              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  return list_field(
                      data, "participants", "partants"
                  )

              return []

          def save_json(filename, obj):
              os.makedirs("sortie", exist_ok=True)

              path = os.path.join("sortie", filename)

              with open(
                  path, "w", encoding="utf-8"
              ) as f:
                  json.dump(
                      obj,
                      f,
                      ensure_ascii=False,
                      indent=2,
                      default=str,
                  )

          def valid_depart(value):
              if value is None or isinstance(value, bool):
                  return False

              if isinstance(value, (int, float)):
                  return value > 0

              if isinstance(value, str):
                  return bool(value.strip())

              return False

          report = {
              "systeme": "X1000 PHOENIX",
              "mode": "LECTURE_SEULE",
              "source": "PMU TurfInfo",
              "date": ISO_DATE,
              "collecte_a": NOW.isoformat(),
              "statut": "EN_COURS",
              "reunions_france": 0,
              "courses_france": 0,
              "partants_identifies": 0,
              "erreurs": ERRORS,
              "avertissements": WARNINGS,
          }

          output = {
              "systeme": "X1000 PHOENIX",
              "date": ISO_DATE,
              "source": "PMU TurfInfo",
              "verification": "collecte_structurelle",
              "reunions": [],
          }

          try:
              programme, source = get_json(
                  f"/programme/{DATE}"
              )

              report["url_programme"] = source

              if not isinstance(programme, dict):
                  raise ValueError(
                      "Programme PMU non conforme"
                  )

              reunions = list_field(
                  programme, "reunions"
              )

              if not reunions:
                  raise ValueError(
                      "Aucune reunion PMU disponible"
                  )

              meeting_ids = set()
              race_ids = set()

              for reunion in reunions:
                  if not isinstance(reunion, dict):
                      continue

                  nr = meeting_number(reunion)

                  if nr is None:
                      WARNINGS.append(
                          "Reunion sans numero officiel"
                      )
                      continue

                  if nr in meeting_ids:
                      ERRORS.append(
                          f"Reunion R{nr} dupliquee"
                      )
                      continue

                  meeting_ids.add(nr)

                  pays = country_of(reunion)

                  if pays not in FRANCE:
                      WARNINGS.append(
                          f"R{nr}: pays non francais "
                          "ou non verifie"
                      )
                      continue

                  hippo = field(
                      reunion, "hippodrome"
                  )

                  if isinstance(hippo, dict):
                      hippo = field(
                          hippo,
                          "libelleCourt",
                          "libelleLong",
                          "nom",
                      )

                  if not isinstance(hippo, str) or not hippo.strip():
                      WARNINGS.append(
                          f"R{nr}: hippodrome non identifiable"
                      )
                      continue

                  item = {
                      "id": f"{ISO_DATE}-R{nr}",
                      "numero": nr,
                      "hippodrome": hippo,
                      "pays": pays,
                      "courses": [],
                  }

                  courses = list_field(
                      reunion, "courses"
                  )

                  if not courses:
                      WARNINGS.append(
                          f"R{nr}: aucune course fournie"
                      )
                      continue

                  for course in courses:
                      if not isinstance(course, dict):
                          continue

                      nc = race_number(course)

                      if nc is None:
                          WARNINGS.append(
                              f"R{nr}: course sans numero"
                          )
                          continue

                      course_id = (
                          f"{ISO_DATE}-R{nr}-C{nc}"
                      )

                      if course_id in race_ids:
                          ERRORS.append(
                              f"{course_id}: identifiant duplique"
                          )
                          continue

                      race_ids.add(course_id)

                      depart = field(
                          course,
                          "heureDepart",
                          "heureDepartInitiale",
                      )

                      if not valid_depart(depart):
                          ERRORS.append(
                              f"{course_id}: horaire absent "
                              "ou invalide"
                          )
                          continue

                      path = (
                          f"/programme/{DATE}"
                          f"/R{nr}/C{nc}/participants"
                      )

                      try:
                          pdata, psource = get_json(path)
                          participants = participants_of(pdata)

                          if not participants:
                              raise ValueError(
                                  "Liste des participants vide"
                              )

                          chevaux = []
                          seen = set()
                          invalides = 0

                          for p in participants:
                              if not isinstance(p, dict):
                                  invalides += 1
                                  continue

                              num = number(field(
                                  p,
                                  "numPmu",
                                  "numero",
                                  "num",
                              ))

                              nom = field(
                                  p, "nom", "nomCheval"
                              )

                              if (
                                  num is None
                                  or not isinstance(nom, str)
                                  or not nom.strip()
                              ):
                                  invalides += 1
                                  continue

                              if num in seen:
                                  invalides += 1
                                  WARNINGS.append(
                                      f"{course_id}: "
                                      f"numero duplique {num}"
                                  )
                                  continue

                              seen.add(num)

                              non_partant = field(
                                  p, "nonPartant"
                              )

                              if not isinstance(non_partant, bool):
                                  non_partant = None

                              chevaux.append({
                                  "numero": num,
                                  "nom": nom.strip(),
                                  "jockey": field(
                                      p, "jockey", "driver"
                                  ),
                                  "entraineur": field(
                                      p, "entraineur"
                                  ),
                                  "non_partant": non_partant,
                              })

                          if invalides:
                              raise ValueError(
                                  f"{invalides} participant(s) "
                                  "invalides ou dupliques"
                              )

                          if not chevaux:
                              raise ValueError(
                                  "Aucun cheval identifiable"
                              )

                          race = {
                              "id": course_id,
                              "reunion": nr,
                              "course": nc,
                              "nom": field(
                                  course,
                                  "libelle",
                                  "libelleCourt",
                                  "nom",
                              ),
                              "heure_depart": depart,
                              "distance": field(
                                  course, "distance"
                              ),
                              "discipline": field(
                                  course, "discipline"
                              ),
                              "nombre_partants": len(chevaux),
                              "partants": chevaux,
                              "source": psource,
                              "statut": "COLLECTE_VERIFIEE",
                          }

                          item["courses"].append(race)

                          report["courses_france"] += 1
                          report["partants_identifies"] += len(
                              chevaux
                          )

                      except Exception as exc:
                          ERRORS.append(
                              f"{course_id}: {exc}"
                          )

                      time.sleep(0.2)

                  if item["courses"]:
                      output["reunions"].append(item)
                      report["reunions_france"] += 1

              if report["courses_france"] == 0:
                  report["statut"] = "ECHEC"
                  raise RuntimeError(
                      "Aucune course francaise "
                      "exploitable avec partants"
                  )

              report["statut"] = (
                  "PARTIEL" if ERRORS else "OK"
              )

          except Exception as exc:
              ERRORS.append(str(exc))

              if report["statut"] == "EN_COURS":
                  report["statut"] = "ECHEC"

          finally:
              output["statut_collecte"] = report["statut"]

              save_json(
                  "courses-pmu-france.json", output
              )

              save_json(
                  "diagnostic-collecte-pmu.json", report
              )

              print(json.dumps(
                  report,
                  ensure_ascii=False,
                  indent=2,
              ))

          if report["statut"] == "ECHEC":
              sys.exit(1)
          PY

          python /tmp/x1000_collecte.py

      - name: Validation des fichiers JSON
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          with open(
              "sortie/diagnostic-collecte-pmu.json",
              encoding="utf-8",
          ) as f:
              diagnostic = json.load(f)

          with open(
              "sortie/courses-pmu-france.json",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          assert diagnostic["statut"] in (
              "OK", "PARTIEL"
          ), "Statut de collecte invalide"

          assert diagnostic["courses_france"] > 0
          assert diagnostic["partants_identifies"] > 0

          assert data["date"] == diagnostic["date"]
          assert data["statut_collecte"] == diagnostic["statut"]

          reunions = data["reunions"]

          assert isinstance(reunions, list)
          assert len(reunions) == diagnostic["reunions_france"]

          total_courses = 0
          total_partants = 0
          ids = set()
          reunions_ids = set()

          for reunion in reunions:
              assert reunion["pays"] in (
                  "FRANCE", "FR", "FRA"
              )

              assert reunion["id"] not in reunions_ids
              reunions_ids.add(reunion["id"])

              assert reunion["hippodrome"]
              assert reunion["courses"]

              for course in reunion["courses"]:
                  cid = course["id"]

                  assert cid not in ids
                  ids.add(cid)

                  assert course["partants"]
                  assert course["heure_depart"] is not None
                  assert course["source"]

                  numeros = [
                      p["numero"]
                      for p in course["partants"]
                  ]

                  assert len(numeros) == len(set(numeros))
                  assert len(numeros) == course["nombre_partants"]

                  for p in course["partants"]:
                      assert isinstance(p["numero"], int)
                      assert p["numero"] > 0
                      assert isinstance(p["nom"], str)
                      assert p["nom"].strip()

                  total_courses += 1
                  total_partants += len(numeros)

          assert total_courses == diagnostic["courses_france"]
          assert total_partants == diagnostic["partants_identifies"]

          print("VALIDATION_X1000_OK")
          print("Statut :", diagnostic["statut"])
          print("Reunions :", len(reunions))
          print("Courses :", total_courses)
          print("Partants :", total_partants)
          print(
              "Erreurs partielles :",
              len(diagnostic["erreurs"])
          )
          PY

      - name: Publier les diagnostics en artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x1000-collecte-pmu-france-${{ github.run_id }}
          path: sortie/
          if-no-files-found: warn
          retention-days: 7

      - name: Resume de securite
        if: always()
        shell: bash
        run: |
          {
            echo "## X1000 PHOENIX - Collecte PMU France"
            echo ""
            echo "- Depot : $GITHUB_REPOSITORY"
            echo "- Branche : $GITHUB_REF_NAME"
            echo "- Mode : lecture seule"
            echo "- Source : PMU TurfInfo"
            echo "- FIGEs : non modifies"
            echo "- Archives : non modifiees"
            echo "- Pronostics : non modifies"
            echo "- Moteurs M1-M5 : non modifies"
            echo "- Commit automatique : aucun"
            echo "- Push automatique : aucun"
            echo "- Deploiement : aucun"
            echo ""

            if [[ -f sortie/diagnostic-collecte-pmu.json ]]; then
              python - <<'PY'
          import json
          import os

          with open(
              "sortie/diagnostic-collecte-pmu.json",
              encoding="utf-8"
          ) as f:
              d = json.load(f)

          lines = [
              "### Diagnostic PMU",
              "",
              f"- Statut : {d['statut']}",
              f"- Reunions : {d['reunions_france']}",
              f"- Courses : {d['courses_france']}",
              f"- Partants : {d['partants_identifies']}",
              f"- Erreurs : {len(d['erreurs'])}",
              f"- Avertissements : {len(d['avertissements'])}",
              "",
          ]

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(lines) + "\n")
          PY
            fi

            echo "Les fichiers JSON sont disponibles dans les artifacts." \
              >> "$GITHUB_STEP_SUMMARY"
          } 
