name: "X1000 Humaine - Diagnostic secondaire PMU"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x1000-diagnostic-secondaire-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.repository == 'yadcaf-cloud/x1000-intelligence-hippique-humaine'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Diagnostic collecte et format tableau
        shell: bash
        env:
          X1000_SORTIE: sortie
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test -f collecte_pmu.py
          python -m py_compile collecte_pmu.py
          python collecte_pmu.py

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("sortie/publication_courses.json")
          if not p.is_file():
              raise SystemExit("JSON de publication absent")

          d = json.loads(p.read_text(encoding="utf-8"))
          if d.get("schema") != "x1000-pmu-france-v1":
              raise SystemExit("Schema inattendu")

          courses = d.get("courses")
          if not isinstance(courses, list):
              raise SystemExit("Courses non listees")

          print("Branche diagnostic - courses:", len(courses))

          if not courses:
              raise SystemExit("Aucune course valide")
          PY

      - name: Conserver le diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x1000-diagnostic-secondaire-${{ github.run_id }}
          path: sortie/
          if-no-files-found: warn
          retention-days: 7
