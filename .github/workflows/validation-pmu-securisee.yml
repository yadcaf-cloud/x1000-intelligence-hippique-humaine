name: "X1000 - Validation generale securisee V1.3"

on:
  workflow_dispatch:

  push:
    branches:
      - "feature/activation-pmu-analyses-archives"
    paths:
      - "pmu_engine.py"
      - "analyse_hippique.py"
      - "resultats_archives.py"
      - "data/**"
      - ".github/workflows/validation-pmu-securisee.yml"

  pull_request:
    branches:
      - main
    paths:
      - "pmu_engine.py"
      - "analyse_hippique.py"
      - "resultats_archives.py"
      - "data/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: x1000-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: "Validation complete sans publication"

    if: >-
      (github.event_name != 'pull_request' &&
       github.ref == 'refs/heads/feature/activation-pmu-analyses-archives')
      ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'feature/activation-pmu-analyses-archives' &&
       github.base_ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository)

    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: "."

    steps:
      - name: "Recuperer le depot"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: "Installer Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verifier le contexte GitHub"
        run: |
          set -euo pipefail

          BRANCH="feature/activation-pmu-analyses-archives"

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$GITHUB_HEAD_REF" = "$BRANCH"
            test "$GITHUB_BASE_REF" = "main"
          else
            test "$GITHUB_REF" = "refs/heads/$BRANCH"
          fi

          echo "Contexte autorise : OK"

      - name: "Verifier les fichiers obligatoires"
        run: |
          set -euo pipefail

          for file in \
            pmu_engine.py \
            analyse_hippique.py \
            resultats_archives.py \
            data/publication_courses.json \
            data/publication_analyses.json \
            data/diagnostic_collecte_pmu.json
          do
            if [ ! -s "$file" ]; then
              echo "::error::Fichier absent ou vide : $file"
              exit 1
            fi
          done

          echo "Fichiers obligatoires : OK"

      - name: "Memoriser les empreintes initiales"
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          snapshot = {}

          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              snapshot[path.as_posix()] = hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()

          Path("/tmp/x1000-snapshot.json").write_text(
              json.dumps(snapshot, sort_keys=True),
              encoding="utf-8"
          )

          print("Fichiers proteges :", len(snapshot))
          PY

      - name: "Verifier la syntaxe Python"
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          for name in (
              "pmu_engine.py",
              "analyse_hippique.py",
              "resultats_archives.py",
          ):
              ast.parse(
                  Path(name).read_text(encoding="utf-8-sig"),
                  filename=name
              )
              print("Syntaxe OK :", name)
          PY

      - name: "Executer les trois autotests"
        run: |
          set -euo pipefail

          python pmu_engine.py --self-test
          python analyse_hippique.py --self-test
          python resultats_archives.py --self-test

          echo "Autotests : OK"

      - name: "Verifier donnees PMU et analyses"
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from analyse_hippique import (
              validate,
              validate_course,
              analyze,
          )

          def read(path):
              raw = Path(path).read_bytes()
              def unique_pairs(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise ValueError(
                              "Cle JSON dupliquee : " + key
                          )
                      result[key] = value
                  return result
              def reject_constant(value):
                  raise ValueError(
                      "Constante JSON interdite : " + value
                  )
              return json.loads(
                  raw.decode("utf-8-sig"),
                  object_pairs_hook=unique_pairs,
                  parse_constant=reject_constant
              ), raw

          courses, source_raw = read(
              "data/publication_courses.json"
          )
          analyses, _ = read(
              "data/publication_analyses.json"
          )
          diagnostic, _ = read(
              "data/diagnostic_collecte_pmu.json"
          )

          for label, obj in (
              ("Publication", courses),
              ("Diagnostic", diagnostic),
              ("Analyses", analyses),
          ):
              if not isinstance(obj, dict):
                  raise ValueError(label + " : objet attendu")

          if courses.get("statut") != "OK":
              raise ValueError("Publication PMU non OK")

          if diagnostic.get("statut") != "OK":
              raise ValueError("Diagnostic PMU non OK")

          if diagnostic.get("erreurs") != []:
              raise ValueError("Diagnostic PMU avec erreurs")

          if courses.get("erreurs", []) != []:
              raise ValueError("Publication PMU avec erreurs")

          for key in (
              "version",
              "date",
              "collecte_a",
              "source",
              "statut",
              "courses",
          ):
              if diagnostic.get(key) != courses.get(key):
                  raise ValueError(
                      "Diagnostic incoherent : " + key
                  )

          date = validate(courses)

          ids = set()
          actifs = 0

          for course in courses["courses"]:
              cid = validate_course(course, date)

              if cid in ids:
                  raise ValueError(
                      "Course dupliquee : " + cid
                  )

              ids.add(cid)
              actifs += course["nombre_partants"]

          if not ids:
              raise ValueError("Aucune course valide")

          if analyses.get("statut") != (
              "DESCRIPTIF_SANS_PRONOSTIC"
          ):
              raise ValueError(
                  "Statut analyses incorrect"
              )

          if analyses.get("date") != date:
              raise ValueError("Dates incoherentes")

          sha = hashlib.sha256(source_raw).hexdigest()

          if analyses.get("source_sha256") != sha:
              raise ValueError(
                  "Empreinte source incorrecte"
              )

          expected = analyze(courses, source_raw)

          if analyses != expected:
              raise ValueError(
                  "Publication analyses non conforme au moteur"
              )

          analyzed_ids = set()

          for course in analyses["courses"]:
              cid = course["id"]

              if cid in analyzed_ids:
                  raise ValueError(
                      "Analyse dupliquee : " + cid
                  )

              analyzed_ids.add(cid)

              for key in (
                  "selection",
                  "fige",
                  "resultat",
              ):
                  if course.get(key) is not None:
                      raise ValueError(
                          "Champ interdit : " + key
                      )

              if course.get("statut") != (
                  "ANALYSE_DESCRIPTIVE"
              ):
                  raise ValueError(
                      "Statut course incorrect"
                  )

              for horse in course["chevaux"]:
                  if horse.get(
                      "evaluation_sportive"
                  ) != "NON_EVALUE":
                      raise ValueError(
                          "Evaluation sportive non autorisee"
                      )

          if ids != analyzed_ids:
              raise ValueError(
                  "Courses et analyses non concordantes"
              )

          print("Date PMU :", date)
          print("Courses :", len(ids))
          print("Partants actifs :", actifs)
          print("SHA256 :", sha)
          print("Analyses descriptives : OK")
          PY

      - name: "Tester analyse sans ecriture"
        run: |
          set -euo pipefail

          python analyse_hippique.py --dry-run

          echo "Analyse lecture seule : OK"

      - name: "Verifier les archives"
        run: |
          set -euo pipefail

          python resultats_archives.py --verify-archives

          echo "Verification archives terminee"

      - name: "Verifier integrite finale"
        if: always()
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          snapshot_path = Path(
              "/tmp/x1000-snapshot.json"
          )

          if not snapshot_path.is_file():
              raise SystemExit(
                  "Empreintes initiales absentes"
              )

          snapshot = json.loads(
              snapshot_path.read_text(encoding="utf-8")
          )

          current = {}

          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              current[path.as_posix()] = hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()

          changed = sorted(
              name for name in set(snapshot) | set(current)
              if snapshot.get(name) != current.get(name)
          )

          if changed:
              for name in changed:
                  print(
                      "::error::Modification detectee :",
                      name
                  )
              raise SystemExit(
                  "Integrite du depot non respectee"
              )

          print("Empreintes SHA256 : OK")
          PY

          git diff --exit-code
          git diff --cached --exit-code

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Fichiers non suivis detectes"
            git ls-files --others --exclude-standard
            exit 1
          fi

          echo "Integrite Git : OK"

      - name: "Bilan de reussite"
        if: success()
        run: |
          {
            echo "## X1000 - Validation securisee V1.3"
            echo ""
            echo "- Contexte GitHub : OK"
            echo "- Syntaxe Python : OK"
            echo "- Trois autotests : OK"
            echo "- Donnees PMU : OK"
            echo "- Diagnostic collecte : OK"
            echo "- Analyses descriptives : OK"
            echo "- SHA256 source : OK"
            echo "- Archives : OK"
            echo "- Integrite du depot : OK"
            echo "- Publication : DESACTIVEE"
            echo "- Fusion main : AUCUNE"
            echo "- FIGE cree : AUCUN"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Bilan d'echec"
        if: failure()
        run: |
          {
            echo "## X1000 - Validation echouee"
            echo ""
            echo "Une ou plusieurs verifications ont echoue."
            echo "Ne pas fusionner vers main."
            echo "Consulter les journaux GitHub Actions."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::Validation X1000 echouee."
