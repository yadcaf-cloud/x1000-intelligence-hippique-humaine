name: "X1000 - Validation generale securisee"

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/activation-pmu-analyses-archives"
    paths:
      - "pmu_engine.py"
      - "analyse_hippique.py"
      - "resultats_archives.py"
      - "data/publication_courses.json"
      - "data/publication_analyses.json"
      - "data/diagnostic_collecte_pmu.json"
      - "data/archives_resultats/**"
      - ".github/workflows/validation-pmu-securisee.yml"

permissions:
  contents: read

concurrency:
  group: x1000-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: "Validation complete sans publication"
    if: github.ref == 'refs/heads/feature/activation-pmu-analyses-archives'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"

    steps:
      - name: "Recuperer la branche securisee"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Installer Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verifier la branche et les fichiers"
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = \
            "refs/heads/feature/activation-pmu-analyses-archives"

          test -s pmu_engine.py
          test -s analyse_hippique.py
          test -s resultats_archives.py

          test -s data/publication_courses.json
          test -s data/publication_analyses.json
          test -s data/diagnostic_collecte_pmu.json

          echo "Branche et fichiers requis : OK"

      - name: "Verifier la syntaxe Python"
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          scripts = (
              "pmu_engine.py",
              "analyse_hippique.py",
              "resultats_archives.py",
          )

          for name in scripts:
              path = Path(name)

              ast.parse(
                  path.read_text(encoding="utf-8"),
                  filename=name
              )

              print("Syntaxe OK :", name)
          PY

      - name: "Executer les trois autotests"
        run: |
          set -euo pipefail

          python pmu_engine.py --self-test
          python analyse_hippique.py --self-test
          python resultats_archives.py --self-test

      - name: "Verifier les donnees et analyses"
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import hashlib
          from pathlib import Path
          from datetime import datetime

          def load_json(path):
              file = Path(path)

              if not file.is_file() or file.stat().st_size == 0:
                  raise ValueError(f"Fichier absent ou vide : {path}")

              return json.loads(file.read_text(encoding="utf-8"))

          source = Path("data/publication_courses.json")

          courses = load_json(source)
          analyses = load_json("data/publication_analyses.json")
          diagnostic = load_json(
              "data/diagnostic_collecte_pmu.json"
          )

          if not isinstance(courses, dict):
              raise ValueError("Format courses invalide")

          if courses.get("statut") != "OK":
              raise ValueError("Statut PMU non OK")

          if courses.get("erreurs") != []:
              raise ValueError("Erreurs PMU detectees")

          if not isinstance(courses.get("courses"), list):
              raise ValueError("Liste des courses absente")

          if not courses["courses"]:
              raise ValueError("Aucune course exploitable")

          if diagnostic != courses:
              raise ValueError(
                  "Diagnostic et courses non concordants"
              )

          collected_at = datetime.fromisoformat(
              courses["collecte_a"]
          )

          if collected_at.tzinfo is None:
              raise ValueError("Collecte sans fuseau horaire")

          if analyses.get("statut") != (
              "DESCRIPTIF_SANS_PRONOSTIC"
          ):
              raise ValueError("Statut analyses invalide")

          if analyses.get("date") != courses.get("date"):
              raise ValueError("Dates non concordantes")

          sha = hashlib.sha256(
              source.read_bytes()
          ).hexdigest()

          if analyses.get("source_sha256") != sha:
              raise ValueError("SHA256 source incorrect")

          originals = courses["courses"]
          analyzed = analyses.get("courses")

          if not isinstance(analyzed, list):
              raise ValueError("Liste analyses absente")

          original_ids = []
          analyzed_ids = []

          for course in originals:
              if not isinstance(course, dict):
                  raise ValueError("Course invalide")

              cid = course.get("id")

              if not isinstance(cid, str) or not cid:
                  raise ValueError("ID course invalide")

              if course.get(
                  "localisation_france_verifiee"
              ) is not True:
                  raise ValueError("Course France non verifiee")

              if course.get("depart_verifie") is not True:
                  raise ValueError("Depart non verifie")

              if not course.get("discipline"):
                  raise ValueError("Discipline absente")

              if not isinstance(course.get("partants"), list):
                  raise ValueError("Partants invalides")

              original_ids.append(cid)

          for course in analyzed:
              if not isinstance(course, dict):
                  raise ValueError("Analyse invalide")

              cid = course.get("id")

              if not isinstance(cid, str) or not cid:
                  raise ValueError("ID analyse invalide")

              analyzed_ids.append(cid)

              if course.get("selection") is not None:
                  raise ValueError("Selection inattendue")

              if course.get("fige") is not None:
                  raise ValueError("FIGE inattendu")

              if course.get("resultat") is not None:
                  raise ValueError("Resultat inattendu")

              chevaux = course.get("chevaux")

              if not isinstance(chevaux, list):
                  raise ValueError("Liste chevaux invalide")

              for horse in chevaux:
                  if horse.get(
                      "evaluation_sportive"
                  ) != "NON_EVALUE":
                      raise ValueError(
                          "Evaluation sportive non autorisee"
                      )

          if len(set(original_ids)) != len(original_ids):
              raise ValueError("Doublons courses")

          if len(set(analyzed_ids)) != len(analyzed_ids):
              raise ValueError("Doublons analyses")

          if set(original_ids) != set(analyzed_ids):
              raise ValueError(
                  "Correspondance courses/analyses invalide"
              )

          print("Courses validees :", len(original_ids))
          print("Analyses validees :", len(analyzed_ids))
          print("SHA256 :", sha)
          print("Collecte :", collected_at.isoformat())
          print("Validation JSON : OK")
          PY

      - name: "Verifier les archives officielles"
        run: |
          set -euo pipefail

          python resultats_archives.py --verify-archives

          echo "Verification archives : OK"

      - name: "Verifier l'integrite du depot"
        if: always()
        run: |
          set -euo pipefail

          git diff --exit-code
          git diff --cached --exit-code

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Fichiers non suivis detectes"
            git ls-files --others --exclude-standard
            exit 1
          fi

          echo "Integrite Git : OK"

      - name: "Bilan de reussite"
        if: success()
        run: |
          echo "======================================"
          echo "X1000 - VALIDATION GENERALE SECURISEE"
          echo "======================================"
          echo "Branche securisee : OK"
          echo "Syntaxe Python : OK"
          echo "Autotests : OK"
          echo "Donnees PMU : OK"
          echo "Analyses descriptives : OK"
          echo "Correspondance SHA256 : OK"
          echo "Verification archives : OK"
          echo "Integrite Git : OK"
          echo "Publication : DESACTIVEE"
          echo "Fusion vers main : AUCUNE"
          echo "======================================"

      - name: "Bilan d'echec"
        if: failure()
        run: |
          echo "::error::Validation generale X1000 non reussie."
          echo "Consulter les erreurs des etapes precedentes."
          echo "Ne pas fusionner vers main."
