name: "X1000 - Validation PMU et archives V2.1"

on:
  workflow_dispatch:

  push:
    branches:
      - "feature/activation-pmu-analyses-archives"
    paths:
      - "pmu_engine.py"
      - "analyse_hippique.py"
      - "resultats_archives.py"
      - "data/**"
      - ".github/workflows/validation-pmu-securisee.yml"

  pull_request:
    branches:
      - main
    paths:
      - "pmu_engine.py"
      - "analyse_hippique.py"
      - "resultats_archives.py"
      - "data/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: x1000-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: "Validation PMU, analyses et archives"

    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/feature/activation-pmu-analyses-archives') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/feature/activation-pmu-analyses-archives') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'feature/activation-pmu-analyses-archives' &&
       github.base_ref == 'main')

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"

    steps:
      - name: "Recuperer le code et historique complet"
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: "Installer Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Determiner les references Git"
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$(git rev-parse origin/main)"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

          echo "Base : $BASE_SHA"
          echo "Branche : $HEAD_SHA"

      - name: "Verifier syntaxe des scripts Python"
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          scripts = (
              "pmu_engine.py",
              "analyse_hippique.py",
              "resultats_archives.py",
          )

          for name in scripts:
              path = Path(name)

              if not path.is_file() or not path.stat().st_size:
                  raise SystemExit(
                      f"Script absent ou vide : {name}"
                  )

              ast.parse(
                  path.read_text(encoding="utf-8-sig"),
                  filename=name,
              )

              print("Syntaxe OK :", name)
          PY

      - name: "Executer les autotests"
        run: |
          set -euo pipefail

          python pmu_engine.py --self-test
          python analyse_hippique.py --self-test
          python resultats_archives.py --self-test

      - name: "Verifier les publications JSON"
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          def unique_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(
                          f"Cle JSON dupliquee : {key}"
                      )
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError(
                  f"Constante JSON interdite : {value}"
              )

          files = (
              "data/publication_courses.json",
              "data/publication_analyses.json",
              "data/diagnostic_collecte_pmu.json",
          )

          for name in files:
              path = Path(name)

              if not path.is_file() or not path.stat().st_size:
                  raise ValueError(
                      f"Publication absente ou vide : {name}"
                  )

              payload = json.loads(
                  path.read_text(encoding="utf-8-sig"),
                  object_pairs_hook=unique_keys,
                  parse_constant=reject_constant,
              )

              if not isinstance(payload, dict):
                  raise ValueError(
                      f"Objet JSON attendu : {name}"
                  )

              print("Publication valide :", name)
          PY

      - name: "Verifier coherence courses et analyses"
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from analyse_hippique import analyze

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          def unique_keys(pairs):
              result = {}
              for key, value in pairs:
                  require(
                      key not in result,
                      f"Cle JSON dupliquee : {key}",
                  )
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError(
                  f"Constante JSON interdite : {value}"
              )

          def load(path):
              require(
                  path.is_file(),
                  f"Fichier absent : {path}",
              )

              raw = path.read_bytes()
              require(
                  bool(raw),
                  f"Fichier vide : {path}",
              )

              payload = json.loads(
                  raw.decode("utf-8-sig"),
                  object_pairs_hook=unique_keys,
                  parse_constant=reject_constant,
              )

              require(
                  isinstance(payload, dict),
                  f"Objet JSON attendu : {path}",
              )

              return payload, raw

          source = Path("data/publication_courses.json")
          target = Path("data/publication_analyses.json")

          courses, raw = load(source)
          published, _ = load(target)

          digest = hashlib.sha256(raw).hexdigest()

          require(
              published.get("source_sha256") == digest,
              "SHA256 source incompatible",
          )

          expected = analyze(courses, raw)

          # L'horodatage de generation est variable.
          # Tous les autres champs doivent correspondre.
          require(
              "analyse_a" in published,
              "Horodatage analyse absent",
          )

          from datetime import datetime

          timestamp = published["analyse_a"]
          require(
              isinstance(timestamp, str),
              "Horodatage analyse invalide",
          )

          parsed = datetime.fromisoformat(
              timestamp.replace("Z", "+00:00")
          )

          require(
              parsed.tzinfo is not None
              and parsed.utcoffset() is not None,
              "Horodatage analyse sans fuseau",
          )

          published_comparable = dict(published)
          expected_comparable = dict(expected)

          published_comparable.pop("analyse_a")
          expected_comparable.pop("analyse_a")

          require(
              published_comparable == expected_comparable,
              "Analyses publiees differentes "
              "des donnees descriptives attendues",
          )

          entries = published["courses"]

          require(
              isinstance(entries, list),
              "Liste des analyses invalide",
          )

          total_horses = sum(
              len(entry["chevaux"])
              for entry in entries
          )

          print("Coherence PMU / analyses : OK")
          print("SHA256 source :", digest)
          print("Courses :", len(entries))
          print("Chevaux :", total_horses)
          print("Aucune prediction inventee")
          PY

      - name: "Verifier analyses sans publication"
        run: |
          set -euo pipefail
          python analyse_hippique.py --dry-run

      - name: "Verifier archives existantes"
        run: |
          set -euo pipefail
          python resultats_archives.py --verify-archives

      - name: "Proteger les archives historiques"
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          from resultats_archives import verify_archive

          PREFIX = "data/archives_resultats/"

          def git(*args):
              return subprocess.check_output(
                  ["git", *args]
              )

          def tracked(ref):
              raw = git(
                  "ls-tree", "-r", "-z",
                  ref, "--", PREFIX
              )

              result = {}

              for entry in raw.split(b"\0"):
                  if not entry:
                      continue

                  metadata, path = entry.split(b"\t", 1)
                  mode, kind, sha = (
                      metadata.decode("ascii").split()
                  )

                  name = path.decode(
                      "utf-8",
                      errors="surrogateescape",
                  )

                  if mode != "100644" or kind != "blob":
                      raise ValueError(
                          f"Archive non reguliere : {name}"
                      )

                  if not name.endswith(".json"):
                      raise ValueError(
                          f"Extension interdite : {name}"
                      )

                  result[name] = sha

              return result

          def preserve(before, after, label):
              for name, sha in before.items():
                  if after.get(name) != sha:
                      raise ValueError(
                          f"{label}: archive modifiee "
                          f"ou supprimee : {name}"
                      )

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]

          merge_base = git(
              "merge-base", base, head
          ).decode().strip()

          if not merge_base:
              raise ValueError(
                  "Ancetre commun introuvable"
              )

          main_archives = tracked(base)
          origin_archives = tracked(merge_base)
          final = tracked(head)

          preserve(
              main_archives,
              final,
              "Protection main",
          )

          preserve(
              origin_archives,
              final,
              "Protection origine",
          )

          commits = git(
              "rev-list",
              "--reverse",
              "--topo-order",
              f"{merge_base}..{head}",
          ).decode().splitlines()

          for commit in commits:
              current = tracked(commit)

              parents = git(
                  "rev-list",
                  "--parents",
                  "-n", "1",
                  commit,
              ).decode().strip().split()[1:]

              for parent in parents:
                  previous = tracked(parent)

                  preserve(
                      previous,
                      current,
                      f"Commit {commit[:12]}",
                  )

          # Controle de chaque archive finale
          # avec le validateur officiel du projet.
          for name in final:
              path = Path(name)

              if not path.is_file():
                  raise ValueError(
                      f"Archive absente : {name}"
                  )

              verify_archive(path)

          print("Commits controles :", len(commits))
          print("Archives main :", len(main_archives))
          print("Archives branche :", len(final))
          print("Protection historique : OK")
          PY

      - name: "Verifier aucune modification locale"
        if: always() && steps.checkout.outcome == 'success'
        run: |
          set -euo pipefail

          git diff --exit-code HEAD --
          git diff --cached --exit-code

          if [ -n "$(
            git ls-files --others --exclude-standard
          )" ]; then
            echo "::error::Fichiers non suivis detectes"
            git ls-files --others --exclude-standard
            exit 1
          fi

          echo "Depot de travail intact : OK"

      - name: "Rapport de validation"
        if: success()
        run: |
          {
            echo "## X1000 - Validation PMU V2.1"
            echo ""
            echo "- Syntaxe Python : OK"
            echo "- Autotests : OK"
            echo "- Publications JSON : OK"
            echo "- Coherence courses / analyses : OK"
            echo "- SHA256 des analyses : OK"
            echo "- Analyse dry-run : OK"
            echo "- Archives existantes : OK"
            echo "- Archives historiques preservees : OK"
            echo "- Integrite Git : OK"
            echo "- Fusion automatique : aucune"
            echo "- Publication automatique : aucune"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Signaler un echec"
        if: failure()
        run: |
          echo "::error::Validation X1000 V2.1 echouee"
          echo "Consulter les journaux GitHub Actions."
          echo "Ne pas fusionner vers main."
