name: "X1000 - Validation PMU et archives V2.2"

on:
  workflow_dispatch:

  push:
    branches:
      - "feature/activation-pmu-analyses-archives"
    paths:
      - "pmu_engine.py"
      - "analyse_hippique.py"
      - "resultats_archives.py"
      - "data/**"
      - ".github/workflows/validation-pmu-securisee.yml"

  pull_request:
    branches:
      - main
    paths:
      - "pmu_engine.py"
      - "analyse_hippique.py"
      - "resultats_archives.py"
      - "data/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: x1000-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: "Validation PMU analyses et archives"

    if: >-
      github.repository ==
      'yadcaf-cloud/x1000-intelligence-hippique-humaine' &&
      (
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref ==
          'refs/heads/feature/activation-pmu-analyses-archives'
        ) ||
        (
          github.event_name == 'push' &&
          github.ref ==
          'refs/heads/feature/activation-pmu-analyses-archives'
        ) ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name ==
          github.repository &&
          github.head_ref ==
          'feature/activation-pmu-analyses-archives' &&
          github.base_ref == 'main'
        )
      )

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"

    steps:
      - name: "Recuperer commit exact et historique"
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: "Installer Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Determiner references Git"
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main

          MAIN_SHA="$(git rev-parse origin/main)"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$MAIN_SHA"
            HEAD_SHA="$GITHUB_SHA"
          fi

          test -n "$BASE_SHA"
          test -n "$HEAD_SHA"

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git cat-file -e "${MAIN_SHA}^{commit}"

          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          test -n "$MERGE_BASE"

          {
            echo "BASE_SHA=$BASE_SHA"
            echo "HEAD_SHA=$HEAD_SHA"
            echo "MAIN_SHA=$MAIN_SHA"
            echo "MERGE_BASE=$MERGE_BASE"
          } >> "$GITHUB_ENV"

          echo "References Git : OK"

      - name: "Verifier scripts Python"
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          scripts = (
              "pmu_engine.py",
              "analyse_hippique.py",
              "resultats_archives.py",
          )

          for name in scripts:
              path = Path(name)

              if (
                  not path.is_file()
                  or path.is_symlink()
                  or path.stat().st_size == 0
              ):
                  raise SystemExit(
                      f"Script invalide : {name}"
                  )

              ast.parse(
                  path.read_text(encoding="utf-8-sig"),
                  filename=name,
              )

              print("Syntaxe OK :", name)
          PY

      - name: "Memoriser integrite initiale"
        id: snapshot
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(
                  ["git", *args]
              )

          snapshot = {}

          raw = git("ls-files", "-z")

          for entry in raw.split(b"\0"):
              if not entry:
                  continue

              name = os.fsdecode(entry)
              path = Path(name)

              if path.is_symlink() or not path.is_file():
                  raise SystemExit(
                      f"Fichier suivi invalide : {name}"
                  )

              snapshot[name] = hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()

          if not snapshot:
              raise SystemExit("Depot vide")

          target = (
              Path(os.environ["RUNNER_TEMP"])
              / "x1000-validation-snapshot.json"
          )

          target.write_text(
              json.dumps(snapshot, sort_keys=True),
              encoding="utf-8",
          )

          print("Fichiers memorises :", len(snapshot))
          PY

      - name: "Verifier publications JSON"
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          def unique_keys(pairs):
              result = {}

              for key, value in pairs:
                  if key in result:
                      raise ValueError(
                          f"Cle JSON dupliquee : {key}"
                      )
                  result[key] = value

              return result

          def reject_constant(value):
              raise ValueError(
                  f"Constante interdite : {value}"
              )

          files = (
              "data/publication_courses.json",
              "data/publication_analyses.json",
              "data/diagnostic_collecte_pmu.json",
          )

          for name in files:
              path = Path(name)

              if (
                  not path.is_file()
                  or path.is_symlink()
                  or path.stat().st_size == 0
              ):
                  raise SystemExit(
                      f"Publication invalide : {name}"
                  )

              payload = json.loads(
                  path.read_text(encoding="utf-8-sig"),
                  object_pairs_hook=unique_keys,
                  parse_constant=reject_constant,
              )

              if not isinstance(payload, dict):
                  raise SystemExit(
                      f"Objet JSON attendu : {name}"
                  )

              print("JSON valide :", name)
          PY

      - name: "Verifier coherence PMU et analyses"
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime
          from pathlib import Path

          from analyse_hippique import (
              analyze,
              validate,
              validate_course,
          )

          def require(condition, message):
              if not condition:
                  raise SystemExit(
                      f"::error::{message}"
                  )

          def unique_keys(pairs):
              result = {}

              for key, value in pairs:
                  if key in result:
                      raise ValueError(
                          f"Cle dupliquee : {key}"
                      )
                  result[key] = value

              return result

          def reject_constant(value):
              raise ValueError(
                  f"Constante interdite : {value}"
              )

          def load(path):
              require(
                  path.is_file() and not path.is_symlink(),
                  f"Fichier invalide : {path}",
              )

              raw = path.read_bytes()

              require(bool(raw), f"Fichier vide : {path}")

              payload = json.loads(
                  raw.decode("utf-8-sig"),
                  object_pairs_hook=unique_keys,
                  parse_constant=reject_constant,
              )

              require(
                  isinstance(payload, dict),
                  f"Objet JSON invalide : {path}",
              )

              return payload, raw

          courses, raw = load(
              Path("data/publication_courses.json")
          )

          published, _ = load(
              Path("data/publication_analyses.json")
          )

          diagnostic, _ = load(
              Path("data/diagnostic_collecte_pmu.json")
          )

          date = validate(courses)

          items = courses.get("courses")

          require(
              isinstance(items, list),
              "Liste courses invalide",
          )

          ids = []

          for course in items:
              cid = validate_course(course, date)

              require(
                  isinstance(cid, str) and bool(cid),
                  "Identifiant course invalide",
              )

              ids.append(cid)

          require(
              len(ids) == len(set(ids)),
              "Courses PMU dupliquees",
          )

          digest = hashlib.sha256(raw).hexdigest()

          require(
              published.get("source_sha256") == digest,
              "SHA256 analyses incorrect",
          )

          require(
              published.get("statut")
              == "DESCRIPTIF_SANS_PRONOSTIC",
              "Statut analyses invalide",
          )

          require(
              published.get("date") == date,
              "Date analyses incorrecte",
          )

          expected = analyze(courses, raw)

          require(
              isinstance(expected, dict),
              "Resultat analyse invalide",
          )

          timestamp = published.get("analyse_a")

          require(
              isinstance(timestamp, str),
              "Horodatage analyse absent",
          )

          try:
              parsed = datetime.fromisoformat(
                  timestamp.replace("Z", "+00:00")
              )
          except ValueError:
              raise SystemExit(
                  "::error::Horodatage analyse invalide"
              )

          require(
              parsed.tzinfo is not None
              and parsed.utcoffset() is not None,
              "Horodatage sans fuseau",
          )

          actual = dict(published)
          calculated = dict(expected)

          actual.pop("analyse_a", None)
          calculated.pop("analyse_a", None)

          require(
              actual == calculated,
              "Analyses publiees incoherentes",
          )

          entries = published.get("courses")

          require(
              isinstance(entries, list),
              "Liste analyses invalide",
          )

          total_horses = 0

          for entry in entries:
              require(
                  isinstance(entry, dict),
                  "Entree analyse invalide",
              )

              horses = entry.get("chevaux")

              require(
                  isinstance(horses, list),
                  "Liste chevaux invalide",
              )

              total_horses += len(horses)

          require(
              diagnostic.get("date") == date,
              "Date diagnostic incoherente",
          )

          require(
              diagnostic.get("collecte_a")
              == courses.get("collecte_a"),
              "Collecte diagnostic non synchronisee",
          )

          print("Coherence analyses : OK")
          print("Courses :", len(ids))
          print("Chevaux :", total_horses)
          print("SHA256 :", digest)
          PY

      - name: "Proteger archives historiques"
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          PREFIX = "data/archives_resultats/"
          MAX_SIZE = 2_000_000

          def git(*args):
              return subprocess.check_output(
                  ["git", *args]
              )

          def tracked(ref):
              raw = git(
                  "ls-tree", "-r", "-z",
                  ref, "--", PREFIX
              )

              result = {}

              for entry in raw.split(b"\0"):
                  if not entry:
                      continue

                  metadata, path = entry.split(b"\t", 1)

                  mode, kind, sha = (
                      metadata.decode("ascii").split()
                  )

                  name = os.fsdecode(path)

                  if kind != "blob" or mode != "100644":
                      raise SystemExit(
                          f"Archive non reguliere : {name}"
                      )

                  if not name.endswith(".json"):
                      raise SystemExit(
                          f"Extension interdite : {name}"
                      )

                  result[name] = sha

              return result

          def preserve(before, after, label):
              for name, sha in before.items():
                  if after.get(name) != sha:
                      raise SystemExit(
                          f"{label} : archive modifiee "
                          f"ou supprimee : {name}"
                      )

          def unique_keys(pairs):
              result = {}

              for key, value in pairs:
                  if key in result:
                      raise ValueError(
                          f"Cle JSON dupliquee : {key}"
                      )
                  result[key] = value

              return result

          def reject_constant(value):
              raise ValueError(
                  f"Constante interdite : {value}"
              )

          def validate_json(name, sha):
              size = int(
                  git("cat-file", "-s", sha)
                  .decode().strip()
              )

              if not 0 < size <= MAX_SIZE:
                  raise SystemExit(
                      f"Taille archive invalide : {name}"
                  )

              raw = git("cat-file", "blob", sha)

              payload = json.loads(
                  raw.decode("utf-8-sig"),
                  object_pairs_hook=unique_keys,
                  parse_constant=reject_constant,
              )

              if not isinstance(payload, dict):
                  raise SystemExit(
                      f"Objet archive invalide : {name}"
                  )

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          main = os.environ["MAIN_SHA"]
          ancestor = os.environ["MERGE_BASE"]

          final = tracked(head)

          preserve(
              tracked(base),
              final,
              "Protection base",
          )

          preserve(
              tracked(main),
              final,
              "Protection main actuelle",
          )

          preserve(
              tracked(ancestor),
              final,
              "Protection ancetre",
          )

          commits = git(
              "rev-list",
              "--reverse",
              "--topo-order",
              f"{ancestor}..{head}",
          ).decode().splitlines()

          for commit in commits:
              current = tracked(commit)

              parents = git(
                  "rev-list",
                  "--parents",
                  "-n", "1",
                  commit,
              ).decode().strip().split()[1:]

              for parent in parents:
                  previous = tracked(parent)

                  preserve(
                      previous,
                      current,
                      f"Commit {commit[:12]}",
                  )

                  for name, sha in current.items():
                      if name not in previous:
                          validate_json(name, sha)

          for name, sha in final.items():
              validate_json(name, sha)

              path = Path(name)

              if path.is_symlink() or not path.is_file():
                  raise SystemExit(
                      f"Archive locale invalide : {name}"
                  )

          print("Commits controles :", len(commits))
          print("Archives finales :", len(final))
          print("Protection historique : OK")
          PY

      - name: "Executer autotests"
        run: |
          set -euo pipefail

          python pmu_engine.py --self-test
          python analyse_hippique.py --self-test
          python resultats_archives.py --self-test

      - name: "Verifier analyses sans publication"
        run: |
          set -euo pipefail

          python analyse_hippique.py --dry-run

      - name: "Verifier archives existantes"
        run: |
          set -euo pipefail

          python resultats_archives.py --verify-archives

      - name: "Verifier integrite finale"
        if: always() && steps.checkout.outcome == 'success'
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          target = (
              Path(os.environ["RUNNER_TEMP"])
              / "x1000-validation-snapshot.json"
          )

          if not target.is_file():
              raise SystemExit(
                  "::error::Snapshot initial absent"
              )

          initial = json.loads(
              target.read_text(encoding="utf-8")
          )

          if not isinstance(initial, dict) or not initial:
              raise SystemExit(
                  "::error::Snapshot invalide"
              )

          current = {}

          raw = subprocess.check_output(
              ["git", "ls-files", "-z"]
          )

          for entry in raw.split(b"\0"):
              if not entry:
                  continue

              name = os.fsdecode(entry)
              path = Path(name)

              if path.is_symlink() or not path.is_file():
                  raise SystemExit(
                      f"Fichier suivi invalide : {name}"
                  )

              current[name] = hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()

          if current != initial:
              changed = sorted(
                  name
                  for name in set(initial) | set(current)
                  if initial.get(name) != current.get(name)
              )

              for name in changed:
                  print(
                      f"::error::Fichier modifie : {name}"
                  )

              raise SystemExit(
                  "Integrite SHA256 non respectee"
              )

          print("Integrite SHA256 : OK")
          PY

          git diff --exit-code HEAD --
          git diff --cached --exit-code

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Fichiers non suivis detectes"
            git ls-files --others --exclude-standard
            exit 1
          fi

          echo "Depot Git intact : OK"

      - name: "Rapport de validation"
        if: success()
        run: |
          {
            echo "## X1000 - Validation PMU V2.2"
            echo ""
            echo "- Syntaxe Python : OK"
            echo "- Publications JSON : OK"
            echo "- Coherence courses et analyses : OK"
            echo "- SHA256 analyses : OK"
            echo "- Protection archives : OK"
            echo "- Autotests : OK"
            echo "- Analyse dry-run : OK"
            echo "- Verification archives : OK"
            echo "- Integrite SHA256 : OK"
            echo "- Publication automatique : aucune"
            echo "- Fusion automatique : aucune"
            echo "- Branche main : inchangee"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Signaler echec"
        if: failure()
        run: |
          echo "::error::Validation X1000 V2.2 echouee"
          echo "Consulter les journaux GitHub Actions."
          echo "Ne pas fusionner vers main."
