from datetime import datetime, timezone

          def verifier_horodatage(valeur, nom):
              if not isinstance(valeur, str) or not valeur.strip():
                  raise ValueError(
                      f"Horodatage absent ou invalide : {nom}"
                  )

              try:
                  instant = datetime.fromisoformat(
                      valeur.replace("Z", "+00:00")
                  )
              except ValueError as exc:
                  raise ValueError(
                      f"Format ISO invalide : {nom}"
                  ) from exc

              if instant.tzinfo is None:
                  raise ValueError(
                      f"Fuseau horaire absent : {nom}"
                  )

              if instant.utcoffset() is None:
                  raise ValueError(
                      f"Decalage UTC invalide : {nom}"
                  )

              if instant > datetime.now(timezone.utc):
                  raise ValueError(
                      f"Horodatage futur interdit : {nom}"
                  )

              return instant

          verifier_horodatage(
              analyses.get("analyse_a"),
              "publication_analyses"
          )

          verifier_horodatage(
              expected.get("analyse_a"),
              "moteur_analyse"
          )

          actual_stable = {
              key: value
              for key, value in analyses.items()
              if key != "analyse_a"
          }

          expected_stable = {
              key: value
              for key, value in expected.items()
              if key != "analyse_a"
          }

          if actual_stable != expected_stable:
              raise ValueError(
                  "Analyses publiees non conformes au moteur"
              )

          print(
              "Horodatages ISO et fuseaux : OK"
          )
          print(
              "Comparaison des analyses : OK"
          )
