- name: "Proteger les archives historiques avant fusion"
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          echo "Verification des archives historiques"

          git fetch --no-tags origin \
            "$BASE_SHA" "$HEAD_SHA"

          python - <<'PY'
          import os
          import subprocess

          PREFIX = "data/archives_resultats/"

          def tracked(ref):
              raw = subprocess.check_output([
                  "git",
                  "ls-tree",
                  "-r",
                  "-z",
                  ref,
                  "--",
                  PREFIX,
              ])

              result = {}

              for entry in raw.split(b"\0"):
                  if not entry:
                      continue

                  metadata, path = entry.split(b"\t", 1)

                  mode, kind, sha = (
                      metadata.decode("ascii").split()
                  )

                  filename = path.decode(
                      "utf-8",
                      errors="surrogateescape"
                  )

                  result[filename] = {
                      "mode": mode,
                      "kind": kind,
                      "sha": sha,
                  }

              return result

          base_sha = os.environ["BASE_SHA"]
          head_sha = os.environ["HEAD_SHA"]

          original = tracked(base_sha)
          candidate = tracked(head_sha)

          changed = []

          for path, metadata in original.items():
              if candidate.get(path) != metadata:
                  changed.append(path)

          if changed:
              for path in sorted(changed):
                  print(
                      "::error::Archive historique "
                      f"modifiee ou supprimee : {path}"
                  )

              raise SystemExit(
                  "Protection des archives : ECHEC"
              )

          added = sorted(
              set(candidate) - set(original)
          )

          print(
              "Archives historiques preservees :",
              len(original)
          )

          print(
              "Nouvelles archives detectees :",
              len(added)
          )

          print(
              "Protection des archives : OK"
          )
          PY
