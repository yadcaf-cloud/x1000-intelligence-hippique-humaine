- name: "Proteger les archives historiques avant fusion"
  if: github.event_name == 'pull_request'
  env:
    BASE_SHA: ${{ github.event.pull_request.base.sha }}
    HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  run: |
    set -euo pipefail

    echo "Verification des archives historiques"

    git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"

    git cat-file -e "${BASE_SHA}^{commit}"
    git cat-file -e "${HEAD_SHA}^{commit}"

    python - <<'PY'
    import os
    import subprocess

    PREFIX = "data/archives_resultats/"

    def tracked(ref):
        raw = subprocess.check_output([
            "git", "ls-tree", "-r", "-z",
            ref, "--", PREFIX
        ])

        result = {}

        for entry in raw.split(b"\0"):
            if not entry:
                continue

            metadata, path = entry.split(b"\t", 1)
            mode, kind, sha = metadata.decode("ascii").split()

            filename = path.decode(
                "utf-8", errors="surrogateescape"
            )

            result[filename] = (mode, kind, sha)

        return result

    def report_error(message):
        safe = (
            message
            .replace("%", "%25")
            .replace("\r", "%0D")
            .replace("\n", "%0A")
        )
        print(f"::error::{safe}")

    base = tracked(os.environ["BASE_SHA"])
    head = tracked(os.environ["HEAD_SHA"])

    changed = sorted(
        path for path, metadata in base.items()
        if head.get(path) != metadata
    )

    invalid = sorted(
        path for path, metadata in head.items()
        if metadata[0] != "100644"
        or metadata[1] != "blob"
    )

    if changed or invalid:
        for path in changed:
            report_error(
                f"Archive historique modifiee "
                f"ou supprimee : {path}"
            )

        for path in invalid:
            report_error(
                f"Type d'archive non autorise : {path}"
            )

        raise SystemExit(
            "Protection des archives : ECHEC"
        )

    added = sorted(set(head) - set(base))

    print("Archives preservees :", len(base))
    print("Nouvelles archives :", len(added))
    print("Protection des archives : OK")
    PY
