name: "X1000 - Validation PMU et protection des archives V1.6"

on:
  workflow_dispatch:

  push:
    branches:
      - feature/activation-pmu-analyses-archives
    paths:
      - "pmu_engine.py"
      - "analyse_hippique.py"
      - "resultats_archives.py"
      - "data/**"
      - ".github/workflows/validation-pmu-securisee.yml"

  pull_request:
    branches:
      - main
    paths:
      - "pmu_engine.py"
      - "analyse_hippique.py"
      - "resultats_archives.py"
      - "data/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: x1000-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: "Validation et archives historiques"

    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/feature/activation-pmu-analyses-archives') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/feature/activation-pmu-analyses-archives') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'feature/activation-pmu-analyses-archives' &&
       github.base_ref == 'main')

    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"

    steps:
      - name: "Recuperer le depot"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Installer Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verifier la syntaxe Python"
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          scripts = (
              "pmu_engine.py",
              "analyse_hippique.py",
              "resultats_archives.py",
          )

          for name in scripts:
              path = Path(name)

              if not path.is_file():
                  raise SystemExit(
                      f"Script manquant : {name}"
                  )

              ast.parse(
                  path.read_text(encoding="utf-8-sig"),
                  filename=name,
              )

              print("Syntaxe OK :", name)
          PY

      - name: "Executer les autotests"
        run: |
          set -euo pipefail

          python pmu_engine.py --self-test
          python analyse_hippique.py --self-test
          python resultats_archives.py --self-test

      - name: "Verifier les publications JSON"
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          def unique_keys(pairs):
              result = {}

              for key, value in pairs:
                  if key in result:
                      raise ValueError(
                          f"Cle JSON dupliquee : {key}"
                      )
                  result[key] = value

              return result

          def reject_constant(value):
              raise ValueError(
                  f"Constante JSON interdite : {value}"
              )

          files = (
              "data/publication_courses.json",
              "data/publication_analyses.json",
              "data/diagnostic_collecte_pmu.json",
          )

          for name in files:
              path = Path(name)

              if not path.is_file():
                  raise SystemExit(
                      f"Publication manquante : {name}"
                  )

              with path.open(
                  encoding="utf-8-sig"
              ) as f:
                  data = json.load(
                      f,
                      object_pairs_hook=unique_keys,
                      parse_constant=reject_constant,
                  )

              if not isinstance(data, dict):
                  raise SystemExit(
                      f"Objet JSON attendu : {name}"
                  )

              print("Publication JSON valide :", name)
          PY

      - name: "Verifier les analyses sans publication"
        run: |
          set -euo pipefail

          python analyse_hippique.py --dry-run

      - name: "Verifier les archives existantes"
        run: |
          set -euo pipefail

          python resultats_archives.py --verify-archives

      - name: "Proteger les archives historiques"
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

        run: |
          set -euo pipefail

          echo "Protection des archives historiques"

          # Checkout complet, sans modification du depot.
          # Aucune nouvelle authentification necessaire.

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$(
              git rev-parse refs/remotes/origin/main
            )"
            HEAD_SHA="$(
              git rev-parse HEAD
            )"
          fi

          export BASE_SHA HEAD_SHA

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess

          PREFIX = "data/archives_resultats/"

          def git(*args):
              return subprocess.check_output(
                  ["git", *args]
              )

          def tracked(ref):
              raw = git(
                  "ls-tree",
                  "-r",
                  "-z",
                  ref,
                  "--",
                  PREFIX,
              )

              result = {}

              for entry in raw.split(b"\0"):
                  if not entry:
                      continue

                  metadata, path = entry.split(
                      b"\t", 1
                  )

                  mode, kind, sha = (
                      metadata.decode("ascii").split()
                  )

                  filename = path.decode(
                      "utf-8",
                      errors="surrogateescape"
                  )

                  result[filename] = (
                      mode,
                      kind,
                      sha,
                  )

              return result

          def error(message):
              safe = (
                  message
                  .replace("%", "%25")
                  .replace("\r", "%0D")
                  .replace("\n", "%0A")
              )

              print(f"::error::{safe}")

          def unique_keys(pairs):
              result = {}

              for key, value in pairs:
                  if key in result:
                      raise ValueError(
                          "Cle JSON dupliquee"
                      )

                  result[key] = value

              return result

          def reject_constant(value):
              raise ValueError(
                  "Constante JSON interdite"
              )

          base = tracked(
              os.environ["BASE_SHA"]
          )

          head = tracked(
              os.environ["HEAD_SHA"]
          )

          problems = []

          # Interdire modification ou suppression.
          for path, metadata in base.items():
              if head.get(path) != metadata:
                  problems.append(
                      "Archive historique modifiee "
                      f"ou supprimee : {path}"
                  )

          # Interdire liens symboliques et types invalides.
          for path, metadata in head.items():
              mode, kind, sha = metadata

              if mode != "100644" or kind != "blob":
                  problems.append(
                      "Type non autorise : "
                      + path
                  )

          added = sorted(
              set(head) - set(base)
          )

          # Verifier toutes les nouvelles archives.
          for path in added:
              mode, kind, sha = head[path]

              if mode != "100644" or kind != "blob":
                  continue

              if not path.lower().endswith(".json"):
                  problems.append(
                      "Extension non autorisee : "
                      + path
                  )
                  continue

              try:
                  raw = git(
                      "show",
                      f"{os.environ['HEAD_SHA']}:{path}"
                  )

                  if len(raw) > 2_000_000:
                      raise ValueError(
                          "Archive trop volumineuse"
                      )

                  data = json.loads(
                      raw.decode("utf-8-sig"),
                      object_pairs_hook=unique_keys,
                      parse_constant=reject_constant,
                  )

                  if not isinstance(data, dict):
                      raise ValueError(
                          "Objet JSON attendu"
                      )

                  digest = hashlib.sha256(
                      raw
                  ).hexdigest()

                  print(
                      "Nouvelle archive valide :",
                      path,
                  )

                  print(
                      "SHA256 :",
                      digest,
                  )

              except (
                  ValueError,
                  UnicodeError,
                  subprocess.CalledProcessError,
              ) as exc:
                  problems.append(
                      f"Archive invalide : {path} "
                      f"({exc})"
                  )

          if problems:
              for message in problems:
                  error(message)

              raise SystemExit(
                  "Protection des archives : ECHEC"
              )

          print(
              "Archives historiques preservees :",
              len(base),
          )

          print(
              "Nouvelles archives controlees :",
              len(added),
          )

          print(
              "Protection des archives : OK"
          )
          PY

      - name: "Verifier aucune modification locale"
        run: |
          set -euo pipefail

          git diff --exit-code
          git diff --cached --exit-code

          if [ -n "$(
            git ls-files --others --exclude-standard
          )" ]; then

            echo "::error::Fichiers non suivis detectes"

            git ls-files --others --exclude-standard

            exit 1
          fi

      - name: "Rapport officiel"
        if: success()
        run: |
          {
            echo "## X1000 - Validation V1.6"
            echo ""
            echo "- Syntaxe Python : OK"
            echo "- Autotests : OK"
            echo "- Publications JSON : OK"
            echo "- Analyse dry-run : OK"
            echo "- Verification archives : OK"
            echo "- Protection historique : OK"
            echo "- Modifications locales : AUCUNE"
            echo "- Fusion automatique : AUCUNE"
            echo "- Publication automatique : AUCUNE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Signaler un echec"
        if: failure()
        run: |
          echo "::error::Validation X1000 echouee"
          echo "Ne pas fusionner vers main."
