name: "X1000 - Validation generale securisee"

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/activation-pmu-analyses-archives"
    paths:
      - "pmu_engine.py"
      - "analyse_hippique.py"
      - "resultats_archives.py"
      - "data/publication_courses.json"
      - "data/publication_analyses.json"
      - "data/diagnostic_collecte_pmu.json"
      - "data/archives_resultats/**"
      - ".github/workflows/validation-pmu-securisee.yml"

permissions:
  contents: read

concurrency:
  group: x1000-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: "Validation complete sans publication"
    if: github.ref == 'refs/heads/feature/activation-pmu-analyses-archives'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"

    steps:
      - name: "Recuperer la branche securisee"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: "Installer Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verifier branche et fichiers"
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = \
            "refs/heads/feature/activation-pmu-analyses-archives"

          for file in \
            pmu_engine.py \
            analyse_hippique.py \
            resultats_archives.py \
            data/publication_courses.json \
            data/publication_analyses.json \
            data/diagnostic_collecte_pmu.json
          do
            test -s "$file" || {
              echo "::error::Fichier absent ou vide : $file"
              exit 1
            }
          done

          python --version
          echo "Branche et fichiers : OK"

      - name: "Memoriser l'etat initial du depot"
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          snapshot = {}

          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if ".git" in path.parts:
                  continue

              snapshot[path.as_posix()] = (
                  hashlib.sha256(
                      path.read_bytes()
                  ).hexdigest()
              )

          Path("/tmp/x1000-validation-snapshot.json").write_text(
              json.dumps(snapshot, sort_keys=True),
              encoding="utf-8"
          )

          print("Fichiers proteges :", len(snapshot))
          PY

      - name: "Verifier syntaxe Python"
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          scripts = (
              "pmu_engine.py",
              "analyse_hippique.py",
              "resultats_archives.py",
          )

          for name in scripts:
              ast.parse(
                  Path(name).read_text(
                      encoding="utf-8-sig"
                  ),
                  filename=name
              )
              print("Syntaxe OK :", name)
          PY

      - name: "Executer les trois autotests"
        run: |
          set -euo pipefail

          python pmu_engine.py --self-test
          python analyse_hippique.py --self-test
          python resultats_archives.py --self-test

          echo "Trois autotests : OK"

      - name: "Verifier donnees PMU et analyses"
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from analyse_hippique import (
              validate,
              validate_course,
              analyze,
          )

          def read(path):
              p = Path(path)
              raw = p.read_bytes()
              return json.loads(raw), raw

          source = Path("data/publication_courses.json")

          courses, source_raw = read(source)

          analyses, _ = read(
              "data/publication_analyses.json"
          )

          diagnostic, _ = read(
              "data/diagnostic_collecte_pmu.json"
          )

          if not isinstance(courses, dict):
              raise ValueError("Publication PMU invalide")

          if courses.get("statut") != "OK":
              raise ValueError("Statut PMU non OK")

          if courses.get("erreurs") != []:
              raise ValueError("Erreurs PMU presentes")

          if diagnostic != courses:
              raise ValueError(
                  "Diagnostic et publication non concordants"
              )

          date = validate(courses)

          ids = set()
          actifs = 0

          for course in courses["courses"]:
              cid = validate_course(course, date)

              if cid in ids:
                  raise ValueError(
                      "Course dupliquee : " + cid
                  )

              ids.add(cid)
              actifs += course["nombre_partants"]

          if not isinstance(analyses, dict):
              raise ValueError("Analyses invalides")

          if analyses.get("statut") != (
              "DESCRIPTIF_SANS_PRONOSTIC"
          ):
              raise ValueError(
                  "Statut des analyses incorrect"
              )

          if analyses.get("date") != date:
              raise ValueError(
                  "Dates PMU et analyses differentes"
              )

          sha = hashlib.sha256(
              source_raw
          ).hexdigest()

          if analyses.get("source_sha256") != sha:
              raise ValueError(
                  "Empreinte SHA256 source incorrecte"
              )

          expected = analyze(courses, source_raw)

          actual_courses = analyses.get("courses")
          expected_courses = expected.get("courses")

          if actual_courses != expected_courses:
              raise ValueError(
                  "Analyses publiees non conformes "
                  "au moteur descriptif actuel"
              )

          for key in (
              "version",
              "source",
              "collecte_a",
              "statut",
              "date",
          ):
              if analyses.get(key) != expected.get(key):
                  raise ValueError(
                      "Champ d'analyse incoherent : " + key
                  )

          analyzed_ids = set()

          for course in actual_courses:
              cid = course["id"]

              if cid in analyzed_ids:
                  raise ValueError(
                      "Analyse dupliquee : " + cid
                  )

              analyzed_ids.add(cid)

              for key in (
                  "selection",
                  "fige",
                  "resultat",
              ):
                  if course.get(key) is not None:
                      raise ValueError(
                          "Champ interdit : " + key
                      )

              if course.get("statut") != (
                  "ANALYSE_DESCRIPTIVE"
              ):
                  raise ValueError(
                      "Statut de course incorrect"
                  )

              for horse in course["chevaux"]:
                  if horse.get(
                      "evaluation_sportive"
                  ) != "NON_EVALUE":
                      raise ValueError(
                          "Evaluation sportive non autorisee"
                      )

          if ids != analyzed_ids:
              raise ValueError(
                  "Correspondance courses/analyses invalide"
              )

          print("Date PMU :", date)
          print("Courses :", len(ids))
          print("Partants actifs :", actifs)
          print("SHA256 source :", sha)
          print("Analyses descriptives : OK")
          PY

      - name: "Valider analyse en lecture seule"
        run: |
          set -euo pipefail

          python analyse_hippique.py --dry-run

          echo "Analyse sans ecriture : OK"

      - name: "Verifier archives officielles"
        run: |
          set -euo pipefail

          python resultats_archives.py --verify-archives

          echo "Archives : verification terminee"

      - name: "Verifier integrite du depot"
        if: always()
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          snapshot_path = Path(
              "/tmp/x1000-validation-snapshot.json"
          )

          if not snapshot_path.is_file():
              raise SystemExit(
                  "Empreintes initiales absentes"
              )

          snapshot = json.loads(
              snapshot_path.read_text(
                  encoding="utf-8"
              )
          )

          current = {}

          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if ".git" in path.parts:
                  continue

              current[path.as_posix()] = (
                  hashlib.sha256(
                      path.read_bytes()
                  ).hexdigest()
              )

          changed = sorted(
              name for name in
              set(snapshot) | set(current)
              if snapshot.get(name) != current.get(name)
          )

          if changed:
              for name in changed:
                  print(
                      "::error::Modification detectee :",
                      name
                  )
              raise SystemExit(
                  "Integrite du depot non respectee"
              )

          print("Empreintes SHA256 : OK")
          PY

          git diff --exit-code
          git diff --cached --exit-code

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Fichiers non suivis detectes"
            git ls-files --others --exclude-standard
            exit 1
          fi

          echo "Integrite Git : OK"

      - name: "Bilan de reussite"
        if: success()
        run: |
          {
            echo "## X1000 - Validation generale securisee"
            echo ""
            echo "- Branche securisee : OK"
            echo "- Syntaxe Python : OK"
            echo "- Trois autotests : OK"
            echo "- Donnees PMU : OK"
            echo "- Analyses descriptives : OK"
            echo "- SHA256 source : OK"
            echo "- Archives : verification reussie"
            echo "- Integrite du depot : OK"
            echo "- Publication : DESACTIVEE"
            echo "- Fusion main : AUCUNE"
            echo "- FIGE cree : AUCUN"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Bilan d'echec"
        if: failure()
        run: |
          {
            echo "## X1000 - Validation echouee"
            echo ""
            echo "Une ou plusieurs verifications ont echoue."
            echo ""
            echo "Ne pas fusionner vers main."
            echo "Consulter les journaux GitHub Actions."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::Validation generale X1000 echouee."
