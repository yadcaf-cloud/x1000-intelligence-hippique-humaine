
name: "X1000 - Validation PMU securisee V1.3"

on:
  workflow_dispatch:

  push:
    branches:
      - "feature/activation-pmu-analyses-archives"
    paths:
      - "pmu_engine.py"
      - ".github/workflows/validation-pmu-securisee.yml"

permissions:
  contents: read

concurrency:
  group: x1000-validation-pmu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation-pmu:
    name: "Validation PMU - Tests sans publication"

    if: github.ref == 'refs/heads/feature/activation-pmu-analyses-archives'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"

    steps:
      - name: "Recuperer la branche securisee"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: "Installer Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verifier la branche et les fichiers"
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = \
            "refs/heads/feature/activation-pmu-analyses-archives"

          test -f pmu_engine.py

          echo "Branche securisee confirmee."
          echo "Moteur PMU present."
          python --version

      - name: "Verifier la syntaxe Python"
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          source = Path("pmu_engine.py").read_bytes()
          compile(source, "pmu_engine.py", "exec")

          print("Syntaxe Python valide.")
          PY

      - name: "Executer les tests internes"
        run: |
          set -euo pipefail

          python pmu_engine.py --self-test

          echo "Tests internes termines."

      - name: "Preparer une copie temporaire"
        run: |
          set -euo pipefail

          TEST_DIR="$RUNNER_TEMP/x1000-pmu-test"

          mkdir -p "$TEST_DIR"

          cp pmu_engine.py "$TEST_DIR/pmu_engine.py"

          test -f "$TEST_DIR/pmu_engine.py"

          echo "Copie isolee preparee."

      - name: "Tester la collecte PMU reelle"
        run: |
          set -euo pipefail

          TEST_DIR="$RUNNER_TEMP/x1000-pmu-test"

          cd "$TEST_DIR"

          echo "=================================="
          echo "X1000 - TEST COLLECTE PMU REELLE"
          echo "=================================="

          echo "Mode DRY-RUN : aucune ecriture."
          echo "Debut de la collecte PMU."

          if python pmu_engine.py --dry-run; then
            echo "Collecte PMU validee."
          else
            echo "::error::La collecte PMU a echoue."
            echo "::error::Verifier les erreurs API et les donnees PMU."
            exit 1
          fi

          echo "Test termine sans publication."

      - name: "Verifier la copie temporaire"
        if: always()
        run: |
          set -euo pipefail

          TEST_DIR="$RUNNER_TEMP/x1000-pmu-test"

          if [ ! -d "$TEST_DIR" ]; then
            echo "::warning::Copie temporaire absente."
            exit 0
          fi

          if [ -d "$TEST_DIR/data" ]; then
            echo "::error::Repertoire data cree pendant le test."
            exit 1
          fi

          if [ -d "$TEST_DIR/__pycache__" ]; then
            echo "::error::Cache Python cree pendant le test."
            exit 1
          fi

          echo "Aucune publication detectee dans la copie."

      - name: "Verifier les fichiers suivis"
        if: always()
        run: |
          set -euo pipefail

          if ! git diff --quiet; then
            echo "::error::Fichiers suivis modifies."
            exit 1
          fi

          if ! git diff --cached --quiet; then
            echo "::error::Index Git modifie."
            exit 1
          fi

          echo "Aucun fichier suivi modifie."

      - name: "Verifier les nouveaux fichiers"
        if: always()
        run: |
          set -euo pipefail

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Nouveaux fichiers non suivis detectes."
            git ls-files --others --exclude-standard
            exit 1
          fi

          echo "Aucun nouveau fichier non suivi."

      - name: "Rapport de securite"
        if: always()
        run: |
          echo "=================================="
          echo "X1000 - VALIDATION PMU SECURISEE"
          echo "=================================="
          echo "Branche : $GITHUB_REF"
          echo "Date UTC : $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Aucun git push execute."
          echo "Aucun deploiement execute."
          echo "Aucune publication PMU demandee."
          echo "Aucun pronostic genere par le workflow."
          echo "Aucun FIGE genere par le workflow."
          echo "Moteurs M1-M5 non executes."
          echo "=================================="
