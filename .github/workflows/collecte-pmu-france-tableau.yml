name: "X1000 Humaine - Collecte principale PMU France"

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: x1000-collecte-principale-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collecte-pmu:
    if: github.repository == 'yadcaf-cloud/x1000-intelligence-hippique-humaine'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier le collecteur
        shell: bash
        run: |
          set -euo pipefail
          test -f collecte_pmu.py
          python -m py_compile collecte_pmu.py
          echo "COLLECTEUR_PRESENT"

      - name: Collecter les donnees PMU
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUNBUFFERED: "1"
          X1000_SORTIE: "sortie"
        run: |
          set -euo pipefail
          mkdir -p sortie
          python collecte_pmu.py

      - name: Valider le JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("sortie/publication_courses.json")
          if not p.is_file():
              raise SystemExit("PUBLICATION_ABSENTE")

          d = json.loads(p.read_text(encoding="utf-8"))
          if d.get("schema") != "x1000-pmu-france-v1":
              raise SystemExit("SCHEMA_INCORRECT")

          courses = d.get("courses")
          if not isinstance(courses, list) or not courses:
              raise SystemExit("AUCUNE_COURSE_VALIDE")

          ids = set()
          for c in courses:
              if not isinstance(c, dict):
                  raise SystemExit("COURSE_INVALIDE")
              if c.get("pays_verifie") != "FR":
                  raise SystemExit("PAYS_NON_VERIFIE")
              cid = c.get("course_id")
              if not isinstance(cid, str) or not cid or cid in ids:
                  raise SystemExit("IDENTIFIANT_INVALIDE")
              ids.add(cid)
              if not c.get("depart"):
                  raise SystemExit("DEPART_ABSENT")

              chevaux = c.get("partants")
              if not isinstance(chevaux, list) or not chevaux:
                  raise SystemExit("PARTANTS_ABSENTS")

              numeros = set()
              for ch in chevaux:
                  if not isinstance(ch, dict):
                      raise SystemExit("CHEVAL_INVALIDE")
                  n = ch.get("numero")
                  nom = ch.get("nom")
                  if type(n) is not int or n <= 0 or n in numeros:
                      raise SystemExit("NUMERO_INVALIDE")
                  if not isinstance(nom, str) or not nom.strip():
                      raise SystemExit("NOM_INVALIDE")
                  numeros.add(n)

          print("VALIDATION_OK", len(courses))
          PY

      - name: Conserver les donnees
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x1000-collecte-principale-${{ github.run_id }}
          path: sortie/
          if-no-files-found: warn
          retention-days: 7

      - name: Rapport
        if: always()
        shell: bash
        run: |
          {
            echo "## X1000 Humaine - Collecte principale"
            echo "- Depot : $GITHUB_REPOSITORY"
            echo "- Branche : $GITHUB_REF_NAME"
            echo "- Mode : lecture seule"
            echo "- Aucun FIGE, pronostic ou archive modifie"
            echo "- Aucun commit, push ou deploiement"
          } >> "$GITHUB_STEP_SUMMARY"
