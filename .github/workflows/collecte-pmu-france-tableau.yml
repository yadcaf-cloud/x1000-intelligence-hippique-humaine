name: "X1000 Humaine - Collecte PMU France - Validation tableau"

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: x1000-collecte-principale-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collecte-pmu:
    if: github.repository == 'yadcaf-cloud/x1000-intelligence-hippique-humaine'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier les scripts
        shell: bash
        run: |
          set -euo pipefail

          test -f collecte_pmu.py
          test -f adapter_collecte_tableau.py

          python -m py_compile \
            collecte_pmu.py \
            adapter_collecte_tableau.py

      - name: Collecter les donnees reelles PMU
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUNBUFFERED: "1"
          X1000_SORTIE: sortie
        run: |
          set -euo pipefail

          mkdir -p sortie

          python collecte_pmu.py

      - name: Convertir au format attendu par index.html
        shell: bash
        run: |
          set -euo pipefail

          python adapter_collecte_tableau.py

      - name: Verifier le raccordement entre les deux JSON
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          a = json.loads(
              Path(
                  "sortie/publication_courses.json"
              ).read_text(encoding="utf-8")
          )

          b = json.loads(
              Path(
                  "sortie/recherche_courses_du_jour.json"
              ).read_text(encoding="utf-8")
          )

          assert b["schema"] == "x1000-candidates-v1"

          assert a["date_pmu"] == b["date"]

          assert len(a["courses"]) == len(
              b["courses_candidates"]
          ) > 0

          assert {
              c["course_id"]
              for c in a["courses"]
          } == {
              c["course_id"]
              for c in b["courses_candidates"]
          }

          assert all(
              c["pays_verifie"] == "FR"
              and c["partants"]
              for c in b["courses_candidates"]
          )

          print(
              "RACCORDEMENT_FORMAT_OK",
              len(b["courses_candidates"])
          )
          PY

      - name: Conserver les rapports pour verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x1000-collecte-validee-${{ github.run_id }}
          path: |
            sortie/publication_courses.json
            sortie/recherche_courses_du_jour.json
          if-no-files-found: warn
          retention-days: 7

      - name: Rapport de controle
        if: always()
        shell: bash
        run: |
          {
            echo "## X1000 - Collecte et raccordement"
            echo "- Depot : $GITHUB_REPOSITORY"
            echo "- Branche : $GITHUB_REF_NAME"
            echo "- Fichiers attendus : publication_courses.json et recherche_courses_du_jour.json"
            echo "- Lecture seule : aucun commit, push, deploiement ou FIGE"
            echo "- Attention : artefacts non publies sur GitHub Pages"
          } >> "$GITHUB_STEP_SUMMARY"
