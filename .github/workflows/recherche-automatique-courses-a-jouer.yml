name: "🇸🇳🧠🔥 X1000 - Intelligence Hippique Humaine - Recherche quotidienne"

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * *"

permissions:
  contents: read

concurrency:
  group: x1000-recherche-quotidienne-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recherche-courses:
    name: "Recherche des courses PMU France"
    if: github.repository == 'yadcaf-cloud/x1000-intelligence-hippique-humaine'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rechercher les courses du jour
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          mkdir -p sortie

          python - <<'PY'
          import json
          import re
          import sys
          import urllib.request
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          TITRE = (
              "🇸🇳🧠🔥 X1000 — "
              "Intelligence Hippique Humaine"
          )

          now = datetime.now(ZoneInfo("Europe/Paris"))
          date_pmu = now.strftime("%d%m%Y")
          date_iso = now.strftime("%Y-%m-%d")

          BASE = (
              "https://online.turfinfo.api.pmu.fr"
              "/rest/client/1/programme"
          )

          def champ(obj, *cles):
              if not isinstance(obj, dict):
                  return None
              for cle in cles:
                  valeur = obj.get(cle)
                  if valeur is not None and valeur != "":
                      return valeur
              return None

          def numero(valeur):
              if isinstance(valeur, bool):
                  return None
              if isinstance(valeur, int):
                  return valeur if valeur > 0 else None
              if isinstance(valeur, str):
                  if re.fullmatch(r"[1-9][0-9]*", valeur):
                      return int(valeur)
              return None

          def liste(obj, *cles):
              if isinstance(obj, list):
                  return obj
              if not isinstance(obj, dict):
                  return []
              for cle in cles:
                  valeur = obj.get(cle)
                  if isinstance(valeur, list):
                      return valeur
              return []

          def pays_france(reunion):
              hippo = champ(reunion, "hippodrome")
              valeurs = []
              for objet in (reunion, hippo):
                  if not isinstance(objet, dict):
                      continue
                  for cle in (
                      "codePays", "pays",
                      "paysCode", "codePaysHippodrome"
                  ):
                      valeur = objet.get(cle)
                      if isinstance(valeur, dict):
                          valeur = champ(
                              valeur, "code", "nom", "libelle"
                          )
                      if isinstance(valeur, str) and valeur.strip():
                          valeurs.append(valeur.strip().upper())

              if not valeurs:
                  return False

              return all(
                  valeur in ("FR", "FRA", "FRANCE")
                  for valeur in valeurs
              )

          def lire_json(url):
              if not url.startswith(BASE + "/"):
                  raise ValueError("Source non autorisee")

              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "X1000-ReadOnly/1.0"
                  }
              )

              with urllib.request.urlopen(
                  req, timeout=20
              ) as response:
                  if response.status != 200:
                      raise RuntimeError(
                          f"HTTP {response.status}"
                      )
                  if response.geturl() != url:
                      raise RuntimeError(
                          "Redirection inattendue"
                      )
                  raw = response.read(8_000_001)

              if len(raw) > 8_000_000:
                  raise ValueError("Reponse trop volumineuse")

              return json.loads(raw.decode("utf-8-sig"))

          rapport = {
              "systeme": TITRE,
              "date": date_iso,
              "recherche_a": now.isoformat(),
              "source": "PMU TurfInfo",
              "mode": "LECTURE_SEULE",
              "statut": "EN_COURS",
              "courses_candidates": [],
              "courses_a_jouer_confirmees": [],
              "erreurs": [],
              "avertissements": [],
              "moteurs": {
                  "M1": "NON_EXECUTE",
                  "M2": "NON_EXECUTE",
                  "M3": "NON_EXECUTE",
                  "M4": "NON_EXECUTE",
                  "M5": "NON_EXECUTE"
              },
              "coordination_x1000": "NON_EXECUTEE"
          }

          try:
              programme = lire_json(
                  f"{BASE}/{date_pmu}"
              )

              reunions = liste(
                  programme, "reunions"
              )

              if not reunions and isinstance(
                  programme, dict
              ):
                  reunions = liste(
                      programme.get("programme"),
                      "reunions"
                  )

              if not reunions:
                  raise RuntimeError(
                      "Aucune reunion PMU exploitable"
                  )

              for reunion in reunions[:40]:
                  if not isinstance(reunion, dict):
                      continue

                  if not pays_france(reunion):
                      continue

                  nr = numero(champ(
                      reunion, "numOfficiel",
                      "numeroReunion", "numReunion"
                  ))

                  hippo = champ(reunion, "hippodrome")

                  if isinstance(hippo, dict):
                      nom_hippo = champ(
                          hippo, "libelleCourt",
                          "libelleLong", "nom"
                      )
                  elif isinstance(hippo, str):
                      nom_hippo = hippo
                  else:
                      nom_hippo = None

                  if nr is None or not nom_hippo:
                      continue

                  courses = liste(
                      reunion, "courses", "listeCourses"
                  )

                  for course in courses[:50]:
                      if not isinstance(course, dict):
                          continue

                      nc = numero(champ(
                          course, "numOrdre",
                          "numCourse", "numero"
                      ))

                      depart = champ(
                          course, "heureDepart",
                          "heureDepartReelle"
                      )

                      if nc is None or depart is None:
                          continue

                      course_id = (
                          f"{date_iso}-R{nr}-C{nc}"
                      )

                      url_partants = (
                          f"{BASE}/{date_pmu}"
                          f"/R{nr}/C{nc}/participants"
                      )

                      try:
                          donnees = lire_json(
                              url_partants
                          )

                          partants_bruts = liste(
                              donnees,
                              "participants",
                              "partants",
                              "listeParticipants"
                          )

                          partants = []
                          numeros_vus = set()

                          for cheval in partants_bruts:
                              if not isinstance(cheval, dict):
                                  continue

                              n = numero(champ(
                                  cheval, "numPmu",
                                  "numero", "num"
                              ))

                              nom = champ(
                                  cheval, "nom",
                                  "nomCheval"
                              )

                              if (
                                  n is None
                                  or not isinstance(nom, str)
                                  or not nom.strip()
                                  or n in numeros_vus
                              ):
                                  continue

                              numeros_vus.add(n)

                              partants.append({
                                  "numero": n,
                                  "nom": nom.strip(),
                                  "non_partant": champ(
                                      cheval, "nonPartant"
                                  ) is True
                              })

                          if not partants:
                              rapport["avertissements"].append(
                                  f"{course_id}: aucun partant valide"
                              )
                              continue

                          candidat = {
                              "course_id": course_id,
                              "hippodrome": nom_hippo,
                              "pays_verifie": "FR",
                              "reunion": nr,
                              "course": nc,
                              "depart_source": depart,
                              "distance": champ(
                                  course, "distance"
                              ),
                              "discipline": champ(
                                  course, "discipline"
                              ),
                              "partants": partants,
                              "nombre_partants": len(partants),
                              "source_partants": url_partants,
                              "statut": "A_ANALYSER",
                              "classement": None,
                              "pari": None
                          }

                          rapport[
                              "courses_candidates"
                          ].append(candidat)

                          print(
                              "CANDIDATE",
                              course_id,
                              nom_hippo,
                              len(partants)
                          )

                      except Exception as exc:
                          rapport["avertissements"].append(
                              f"{course_id}: {type(exc).__name__}: {exc}"
                          )

              if rapport["courses_candidates"]:
                  rapport["statut"] = (
                      "CANDIDATES_A_ANALYSER"
                  )
              else:
                  rapport["statut"] = (
                      "AUCUNE_CANDIDATE_VERIFIEE"
                  )

          except Exception as exc:
              rapport["statut"] = "ECHEC_COLLECTE"
              rapport["erreurs"].append(
                  f"{type(exc).__name__}: {exc}"
              )

          destination = Path(
              "sortie/recherche_courses_du_jour.json"
          )

          destination.write_text(
              json.dumps(
                  rapport,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("================================")
          print(TITRE)
          print("Date :", date_iso)
          print("Statut :", rapport["statut"])
          print(
              "Courses candidates :",
              len(rapport["courses_candidates"])
          )
          print("M1-M5 : non executes")
          print("Aucun FIGE ni pronostic modifie")
          print("Aucun commit, push ou deploiement")
          print("================================")

          if rapport["statut"] == "ECHEC_COLLECTE":
              sys.exit(1)
          PY

      - name: Rapport GitHub
        if: always()
        shell: bash
        run: |
          {
            echo "## 🇸🇳🧠🔥 X1000 — Recherche quotidienne"
            echo
            echo "- Depot : $GITHUB_REPOSITORY"
            echo "- Branche : $GITHUB_REF_NAME"
            echo "- Mode : lecture seule"
            echo "- Courses candidates : rapport JSON"
            echo "- M1-M5 : analyses non executees"
            echo "- Aucun FIGE ou pronostic modifie"
            echo "- Aucun commit, push ou deploiement"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Conserver les recherches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x1000-recherche-${{ github.run_number }}
          path: sortie/recherche_courses_du_jour.json
          if-no-files-found: warn
          retention-days: 7
