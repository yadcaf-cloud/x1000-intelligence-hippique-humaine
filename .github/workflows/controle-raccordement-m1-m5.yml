name: "X1000 - Controle raccordement reel M1-M5"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x1000-controle-moteurs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controle-moteurs:
    name: "PMU France - M1-M5 - X1000 - Site isole"
    if: >-
      github.repository == 'yadcaf-cloud/x1000-intelligence-hippique-humaine' &&
      github.ref == 'refs/heads/fix/audit-general-pmu-20261118' &&
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-24.04
    timeout-minutes: 35

    defaults:
      run:
        shell: bash

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      X1000_ENTREES_MOTEURS: "entrees_moteurs"
      X1000_SORTIE: "sortie"

    steps:
      - name: Recuperer la branche autorisee
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier depot et branche
        run: |
          set -euo pipefail

          test "$GITHUB_REPOSITORY" = \
            "yadcaf-cloud/x1000-intelligence-hippique-humaine"

          test "$GITHUB_REF" = \
            "refs/heads/fix/audit-general-pmu-20261118"

          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"

          echo "BRANCHE_AUTORISEE"

      - name: Preparer un environnement isole
        run: |
          set -euo pipefail

          dossier="$(mktemp -d \
            "$RUNNER_TEMP/x1000-raccordement-XXXXXXXX")"

          echo "X1000_TEST_DIR=$dossier" >> "$GITHUB_ENV"

          python - "$dossier" <<'PY'
          import ast
          import shutil
          import sys
          from pathlib import Path

          destination = Path(sys.argv[1])

          scripts = (
              "collecte_pmu.py",
              "adapter_collecte_tableau.py",
              "raccorder_moteurs_x1000.py",
              "verifier_raccordement_moteurs.py",
              "preparer_site_pmu.py",
          )

          pages = (
              "index.html",
              "tableau-pmu.html",
          )

          for nom in scripts:
              source = Path(nom)

              if (
                  not source.is_file()
                  or source.is_symlink()
                  or not source.stat().st_size
              ):
                  raise SystemExit(
                      f"SCRIPT_INVALIDE: {nom}"
                  )

              ast.parse(
                  source.read_text(encoding="utf-8"),
                  filename=nom,
              )

              shutil.copyfile(source, destination / nom)
              print("SCRIPT_OK:", nom)

          for nom in pages:
              source = Path(nom)

              if (
                  not source.is_file()
                  or source.is_symlink()
                  or not source.stat().st_size
              ):
                  raise SystemExit(
                      f"PAGE_INVALIDE: {nom}"
                  )

              shutil.copyfile(source, destination / nom)
              print("PAGE_OK:", nom)

          entrees = Path("entrees_moteurs")

          if entrees.is_symlink():
              raise SystemExit("ENTREES_LIEN_SYMBOLIQUE")

          cible = destination / "entrees_moteurs"
          cible.mkdir()

          if entrees.exists() and not entrees.is_dir():
              raise SystemExit("ENTREES_NON_DOSSIER")

          if entrees.is_dir():
              for nom in (
                  "M1", "M2", "M3",
                  "M4", "M5", "X1000",
              ):
                  source = entrees / f"{nom}.json"

                  if source.is_symlink():
                      raise SystemExit(
                          f"SOURCE_LIEN_SYMBOLIQUE: {nom}"
                      )

                  if source.is_file():
                      shutil.copyfile(
                          source, cible / source.name
                      )

          print("ENVIRONNEMENT_ISOLE_PRET")
          PY

      - name: Verifier les six sources de decisions
        run: |
          set -euo pipefail
          cd "$X1000_TEST_DIR"

          python - <<'PY'
          import json
          from pathlib import Path

          noms = ("M1", "M2", "M3", "M4", "M5", "X1000")
          base = Path("entrees_moteurs")

          rapport = {
              "schema": "x1000-controle-entrees-v2",
              "statut": "SOURCES_INCOMPLETES",
              "sources": {},
              "sources_completes": False,
              "decisions_authentifiees": False,
              "execution_autonome_verifiee": False,
              "deploiement_effectue": False,
          }

          erreurs = []

          for nom in noms:
              path = base / f"{nom}.json"

              if not path.is_file() or not path.stat().st_size:
                  rapport["sources"][nom] = {
                      "statut": "ABSENTE"
                  }
                  erreurs.append(f"{nom}: ABSENTE")
                  continue

              try:
                  data = json.loads(
                      path.read_text(encoding="utf-8")
                  )

                  if not isinstance(data, dict):
                      raise ValueError("OBJET_ATTENDU")

                  if data.get("moteur") != nom:
                      raise ValueError("MOTEUR_INCOHERENT")

                  decisions = data.get("decisions")

                  if (
                      not isinstance(decisions, list)
                      or not decisions
                  ):
                      raise ValueError("DECISIONS_ABSENTES")

                  ids = set()

                  for decision in decisions:
                      if not isinstance(decision, dict):
                          raise ValueError(
                              "DECISION_MAL_FORMEE"
                          )

                      cid = decision.get("course_id")

                      if not isinstance(cid, str) or not cid:
                          raise ValueError(
                              "COURSE_ID_ABSENT"
                          )

                      if cid in ids:
                          raise ValueError(
                              "DECISION_DUPLIQUEE"
                          )

                      ids.add(cid)

                  rapport["sources"][nom] = {
                      "statut": "STRUCTURE_PRESENTE",
                      "nombre_decisions": len(decisions),
                  }

              except (ValueError, UnicodeError) as exc:
                  message = f"{nom}: {exc}"
                  erreurs.append(message)

                  rapport["sources"][nom] = {
                      "statut": "INVALIDE",
                      "erreur": str(exc),
                  }

          rapport["sources_completes"] = not erreurs

          if not erreurs:
              rapport["statut"] = (
                  "SIX_SOURCES_STRUCTURELLEMENT_PRESENTES"
              )

          rapport["erreurs"] = erreurs

          Path("diagnostic_entrees_moteurs.json").write_text(
              json.dumps(
                  rapport,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          print("SOURCES:", rapport["sources"])
          print("ERREURS:", erreurs)
          print("STATUT:", rapport["statut"])
          print("AUTHENTICITE_NON_CERTIFIEE")

          if erreurs:
              raise SystemExit(
                  "RACCORDEMENT_BLOQUE: "
                  "SOURCES_M1_M5_X1000_INCOMPLETES"
              )
          PY

      - name: Collecter les courses PMU France
        run: |
          set -euo pipefail
          cd "$X1000_TEST_DIR"

          test ! -e sortie/publication_courses.json

          python collecte_pmu.py

          test -s sortie/publication_courses.json || {
            echo "::error::COLLECTE_PMU_ABSENTE"
            exit 1
          }

          echo "COLLECTE_PMU_TERMINEE"

      - name: Adapter les courses au tableau
        run: |
          set -euo pipefail
          cd "$X1000_TEST_DIR"

          python adapter_collecte_tableau.py

          test -s sortie/recherche_courses_du_jour.json || {
            echo "::error::CANDIDATS_PMU_ABSENTS"
            exit 1
          }

          echo "ADAPTATION_COURSES_TERMINEE"

      - name: Consolider les decisions existantes
        run: |
          set -euo pipefail
          cd "$X1000_TEST_DIR"

          test ! -e sortie/publication_moteurs.json

          python raccorder_moteurs_x1000.py

          test -s sortie/publication_moteurs.json || {
            echo "::error::PUBLICATION_MOTEURS_ABSENTE"
            exit 1
          }

          echo "DECISIONS_CONSOLIDEES"

      - name: Verifier le raccordement et les horaires
        run: |
          set -euo pipefail
          cd "$X1000_TEST_DIR"

          python verifier_raccordement_moteurs.py

          echo "VALIDATION_STRUCTURELLE_TERMINEE"

      - name: Preparer le site isole
        run: |
          set -euo pipefail
          cd "$X1000_TEST_DIR"

          test ! -e site_pmu

          python preparer_site_pmu.py

          for fichier in \
            site_pmu/index.html \
            site_pmu/tableau-pmu.html \
            site_pmu/data/publication_courses.json \
            site_pmu/data/publication_moteurs.json \
            site_pmu/data/etat_publication.json \
            site_pmu/sortie/recherche_courses_du_jour.json
          do
            test -s "$fichier" || {
              echo "::error::SITE_INCOMPLET: $fichier"
              exit 1
            }
          done

          echo "SITE_ISOLE_PREPARE"

      - name: Verifier les copies et publications
        run: |
          set -euo pipefail
          cd "$X1000_TEST_DIR"

          python - <<'PY'
          import json
          from pathlib import Path

          paires = (
              (
                  "sortie/publication_courses.json",
                  "site_pmu/data/publication_courses.json",
              ),
              (
                  "sortie/publication_moteurs.json",
                  "site_pmu/data/publication_moteurs.json",
              ),
              (
                  "sortie/recherche_courses_du_jour.json",
                  "site_pmu/sortie/recherche_courses_du_jour.json",
              ),
          )

          for original, copie in paires:
              if Path(original).read_bytes() != Path(copie).read_bytes():
                  raise SystemExit(
                      f"COPIE_DIFFERENTE: {copie}"
                  )

              print("COPIE_IDENTIQUE:", copie)

          etat = json.loads(
              Path(
                  "site_pmu/data/etat_publication.json"
              ).read_text(encoding="utf-8")
          )

          if etat.get("deploiement_effectue") is not False:
              raise SystemExit("DEPLOIEMENT_INATTENDU")

          if etat.get("publication_moteurs_presente") is not True:
              raise SystemExit("MOTEURS_NON_RECONNUS")

          if etat.get("authenticite_figes_verifiee") is not False:
              raise SystemExit("FIGES_NON_CONFORMES")

          publication = json.loads(
              Path(
                  "site_pmu/data/publication_moteurs.json"
              ).read_text(encoding="utf-8")
          )

          if publication.get("schema") != "x1000-moteurs-v1":
              raise SystemExit("SCHEMA_MOTEURS_INVALIDE")

          courses = publication.get("courses")

          if not isinstance(courses, list) or not courses:
              raise SystemExit("COURSES_MOTEURS_ABSENTES")

          attendus = {"M1", "M2", "M3", "M4", "M5"}

          for course in courses:
              if not isinstance(course, dict):
                  raise SystemExit("COURSE_INVALIDE")

              moteurs = course.get("moteurs")

              if (
                  not isinstance(moteurs, dict)
                  or set(moteurs) != attendus
              ):
                  raise SystemExit("MOTEURS_INCOMPLETS")

              if not isinstance(
                  course.get("arbitre_x1000"), dict
              ):
                  raise SystemExit("ARBITRE_ABSENT")

          print("SITE_STRUCTURELLEMENT_VALIDE")
          print("AUTHENTICITE_NON_CERTIFIEE")
          print("NAVIGATEUR_NON_TESTE")
          print("AUCUN_DEPLOIEMENT")
          PY

      - name: Verifier integrite du depot
        if: always()
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::DEPOT_MODIFIE"
            git status --short
            exit 1
          fi

          echo "DEPOT_INCHANGE"

      - name: Archiver les diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x1000-controle-moteurs-${{ github.run_id }}
          path: |
            ${{ env.X1000_TEST_DIR }}/diagnostic_entrees_moteurs.json
            ${{ env.X1000_TEST_DIR }}/sortie/publication_courses.json
            ${{ env.X1000_TEST_DIR }}/sortie/recherche_courses_du_jour.json
            ${{ env.X1000_TEST_DIR }}/sortie/publication_moteurs.json
            ${{ env.X1000_TEST_DIR }}/site_pmu/data/etat_publication.json
          if-no-files-found: warn
          retention-days: 7

      - name: Rapport final
        if: always()
        env:
          RESULTAT: ${{ job.status }}
        run: |
          {
            echo "## X1000 - Controle raccordement M1-M5"
            echo ""
            echo "Resultat : $RESULTAT"
            echo "Branche : $GITHUB_REF_NAME"
            echo ""
            echo "Diagnostic des six sources de decisions"
            echo "Collecte des courses PMU France"
            echo "Adaptation du tableau"
            echo "Controle des classements et horaires"
            echo "Preparation du site isole"
            echo ""
            echo "AUCUN COMMIT AUTOMATIQUE"
            echo "AUCUN PUSH AUTOMATIQUE"
            echo "AUCUN DEPLOIEMENT"
            echo "AUCUN FIGE MODIFIE"
            echo "AUCUNE ARCHIVE MODIFIEE"
            echo "AUCUN PRONOSTIC INVENTE"
            echo ""
            echo "L'execution autonome des moteurs"
            echo "n'est pas certifiee par ce controle."
          } >> "$GITHUB_STEP_SUMMARY"
