name: "X1000 - Controle affichage securise V1.4"

on:
  workflow_dispatch:

  push:
    branches:
      - "feature/activation-pmu-analyses-archives"
    paths:
      - "index.html"
      - "data/publication_courses.json"
      - "data/publication_analyses.json"
      - "data/publication_moteurs.json"
      - ".github/workflows/controle-affichage-securise.yml"

  pull_request:
    branches:
      - "main"
    paths:
      - "index.html"
      - "data/publication_courses.json"
      - "data/publication_analyses.json"
      - "data/publication_moteurs.json"
      - ".github/workflows/controle-affichage-securise.yml"

permissions:
  contents: read

concurrency:
  group: x1000-affichage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controle:
    name: "Validation affichage PMU analyses M1-M5"

    if: >-
      github.repository ==
      'yadcaf-cloud/x1000-intelligence-hippique-humaine' &&
      (
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref ==
          'refs/heads/feature/activation-pmu-analyses-archives'
        ) ||
        (
          github.event_name == 'push' &&
          github.ref ==
          'refs/heads/feature/activation-pmu-analyses-archives'
        ) ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name ==
          github.repository &&
          github.head_ref ==
          'feature/activation-pmu-analyses-archives' &&
          github.base_ref == 'main'
        )
      )

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"

    steps:
      - name: "Recuperer le depot"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: "Installer Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verifier fichiers et syntaxe HTML"
        run: |
          set -euo pipefail

          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class PortalParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = set()
                  self.scripts = 0

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)

                  if attrs.get("id"):
                      self.ids.add(attrs["id"])

                  if tag.lower() == "script":
                      self.scripts += 1

          page = Path("index.html")

          if not page.is_file() or not page.stat().st_size:
              raise SystemExit(
                  "::error::index.html absent ou vide"
              )

          html = page.read_text(encoding="utf-8-sig")

          parser = PortalParser()
          parser.feed(html)
          parser.close()

          if parser.scripts == 0:
              raise SystemExit(
                  "::error::Aucun script dans le portail"
              )

          sources = (
              "publication_courses.json",
              "publication_analyses.json",
          )

          for source in sources:
              if source not in html:
                  raise SystemExit(
                      f"::error::Source absente : {source}"
                  )

          print("Portail HTML : OK")
          print("Scripts declares :", parser.scripts)
          print("Identifiants HTML :", len(parser.ids))

          for section in (
              "pmu", "analyses", "moteurs",
              "figes", "archives"
          ):
              if section not in parser.ids:
                  print(
                      f"::warning::Section non trouvee : {section}"
                  )

          if "publication_moteurs.json" not in html:
              print(
                  "::warning::Source moteurs non referencee"
              )
          PY

      - name: "Verifier publications PMU et analyses"
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          ID_PATTERN = re.compile(
              r"\d{4}-\d{2}-\d{2}-R[1-9]\d*-C[1-9]\d*"
          )

          def require(condition, message):
              if not condition:
                  raise SystemExit(
                      f"::error::{message}"
                  )

          def text(value):
              return (
                  isinstance(value, str)
                  and bool(value.strip())
              )

          def positive_int(value):
              return type(value) is int and value > 0

          def unique_keys(pairs):
              result = {}

              for key, value in pairs:
                  if key in result:
                      raise ValueError(
                          f"Cle JSON dupliquee : {key}"
                      )
                  result[key] = value

              return result

          def reject_constant(value):
              raise ValueError(
                  f"Constante JSON interdite : {value}"
              )

          def load_json(name):
              path = Path(name)
              require(
                  path.is_file() and path.stat().st_size > 0,
                  f"Fichier absent ou vide : {name}"
              )

              raw = path.read_bytes()

              payload = json.loads(
                  raw.decode("utf-8-sig"),
                  object_pairs_hook=unique_keys,
                  parse_constant=reject_constant,
              )

              require(
                  isinstance(payload, dict),
                  f"Objet JSON invalide : {name}"
              )

              return payload, raw

          def parse_time(value):
              if not isinstance(value, str):
                  return None

              try:
                  result = datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  )

                  if (
                      result.tzinfo is None
                      or result.utcoffset() is None
                  ):
                      return None

                  return result
              except ValueError:
                  return None

          def valid_id(value):
              return (
                  text(value)
                  and ID_PATTERN.fullmatch(value) is not None
              )

          source, raw = load_json(
              "data/publication_courses.json"
          )

          require(
              source.get("statut") in ("OK", "PARTIEL"),
              "Statut collecte PMU invalide"
          )

          require(
              parse_time(source.get("collecte_a"))
              is not None,
              "Horodatage collecte invalide"
          )

          courses = source.get("courses")

          require(
              isinstance(courses, list),
              "Liste courses invalide"
          )

          races = {}

          for race in courses:
              require(
                  isinstance(race, dict),
                  "Objet course invalide"
              )

              rid = race.get("id")

              require(
                  valid_id(rid),
                  f"Identifiant course invalide : {rid}"
              )

              require(
                  rid not in races,
                  f"Course dupliquee : {rid}"
              )

              require(
                  race.get(
                      "localisation_france_verifiee"
                  ) is True,
                  f"France non verifiee : {rid}"
              )

              require(
                  race.get("depart_verifie") is True,
                  f"Depart non verifie : {rid}"
              )

              departure = parse_time(
                  race.get("depart")
              )

              require(
                  departure is not None,
                  f"Depart invalide : {rid}"
              )

              paris_date = departure.astimezone(
                  ZoneInfo("Europe/Paris")
              ).date().isoformat()

              require(
                  rid[:10] == paris_date,
                  f"Date incoherente : {rid}"
              )

              require(
                  text(race.get("discipline")),
                  f"Discipline absente : {rid}"
              )

              horses = race.get("partants")

              require(
                  isinstance(horses, list) and bool(horses),
                  f"Partants absents : {rid}"
              )

              numbers = {}
              nonrunners = set()

              for horse in horses:
                  require(
                      isinstance(horse, dict),
                      f"Cheval invalide : {rid}"
                  )

                  number = horse.get("numero")

                  require(
                      positive_int(number),
                      f"Numero cheval invalide : {rid}"
                  )

                  require(
                      number not in numbers,
                      f"Cheval duplique : {rid}/{number}"
                  )

                  require(
                      text(horse.get("nom")),
                      f"Nom cheval absent : {rid}/{number}"
                  )

                  require(
                      type(horse.get("non_partant")) is bool,
                      f"Statut NP invalide : {rid}/{number}"
                  )

                  numbers[number] = horse["nom"]

                  if horse["non_partant"]:
                      nonrunners.add(number)

              active = set(numbers) - nonrunners

              require(
                  bool(active),
                  f"Aucun partant actif : {rid}"
              )

              declared = race.get("non_partants")

              require(
                  isinstance(declared, list),
                  f"Liste NP invalide : {rid}"
              )

              declared_numbers = set()

              for item in declared:
                  number = (
                      item.get("numero")
                      if isinstance(item, dict)
                      else item
                  )

                  require(
                      positive_int(number),
                      f"Numero NP invalide : {rid}"
                  )

                  require(
                      number not in declared_numbers,
                      f"NP duplique : {rid}/{number}"
                  )

                  declared_numbers.add(number)

                  if (
                      isinstance(item, dict)
                      and "nom" in item
                  ):
                      require(
                          item["nom"] == numbers.get(number),
                          f"Nom NP incoherent : {rid}/{number}"
                      )

              require(
                  declared_numbers == nonrunners,
                  f"Liste NP incoherente : {rid}"
              )

              for field, expected in (
                  ("nombre_partants", len(active)),
                  ("nombre_participants", len(numbers)),
              ):
                  if field in race:
                      require(
                          type(race[field]) is int
                          and race[field] == expected,
                          f"{field} incoherent : {rid}"
                      )

              races[rid] = {
                  "horses": numbers,
                  "active": active,
                  "departure": departure,
                  "depart_raw": race["depart"],
                  "discipline": race["discipline"],
              }

          print("Courses PMU controlees :", len(races))

          if not races:
              print(
                  "INFO - Aucune course exploitable publiee"
              )

          analyses, _ = load_json(
              "data/publication_analyses.json"
          )

          digest = hashlib.sha256(raw).hexdigest()

          require(
              analyses.get("statut")
              == "DESCRIPTIF_SANS_PRONOSTIC",
              "Statut analyses invalide"
          )

          require(
              analyses.get("source_sha256") == digest,
              "SHA256 analyses incompatible"
          )

          entries = analyses.get("courses")

          require(
              isinstance(entries, list),
              "Liste analyses invalide"
          )

          seen = set()

          for entry in entries:
              require(
                  isinstance(entry, dict),
                  "Analyse invalide"
              )

              rid = entry.get("id")

              require(
                  valid_id(rid)
                  and rid in races
                  and rid not in seen,
                  f"Analyse inconnue ou dupliquee : {rid}"
              )

              seen.add(rid)
              ref = races[rid]

              if "depart" in entry:
                  require(
                      entry["depart"] == ref["depart_raw"],
                      f"Depart analyse incoherent : {rid}"
                  )

              if "discipline" in entry:
                  require(
                      entry["discipline"] == ref["discipline"],
                      f"Discipline analyse incoherente : {rid}"
                  )

              for forbidden in (
                  "selection", "fige", "resultat"
              ):
                  require(
                      entry.get(forbidden) is None,
                      f"Pronostic interdit : {rid}"
                  )

              horses = entry.get("chevaux")

              require(
                  isinstance(horses, list),
                  f"Chevaux analyse invalides : {rid}"
              )

              used = set()

              for horse in horses:
                  require(
                      isinstance(horse, dict),
                      f"Cheval analyse invalide : {rid}"
                  )

                  number = horse.get("numero")

                  require(
                      positive_int(number)
                      and number not in used,
                      f"Numero analyse invalide : {rid}"
                  )

                  require(
                      horse.get("nom")
                      == ref["horses"].get(number),
                      f"Cheval analyse incoherent : {rid}"
                  )

                  require(
                      horse.get(
                          "evaluation_sportive",
                          "NON_EVALUE"
                      ) == "NON_EVALUE",
                      f"Evaluation inattendue : {rid}"
                  )

                  used.add(number)

              require(
                  used == set(ref["horses"]),
                  f"Chevaux analyses manquants : {rid}"
              )

          print("Analyses controlees :", len(seen))

          motors_path = Path(
              "data/publication_moteurs.json"
          )

          if not motors_path.exists():
              print(
                  "INFO - Publication moteurs absente"
              )
              print(
                  "INFO - Aucun FIGE suppose"
              )
          else:
              publication, _ = load_json(
                  str(motors_path)
              )

              require(
                  publication.get("statut")
                  == "PUBLICATION_MOTEURS",
                  "Statut moteurs invalide"
              )

              require(
                  publication.get("source_sha256")
                  == digest,
                  "SHA256 moteurs incompatible"
              )

              published = parse_time(
                  publication.get("publie_a")
              )

              require(
                  published is not None,
                  "Date publication moteurs invalide"
              )

              motor_entries = publication.get("courses")

              require(
                  isinstance(motor_entries, list),
                  "Liste moteurs invalide"
              )

              motors = ("M1", "M2", "M3", "M4", "M5")
              seen_races = set()
              decisions_count = 0

              for entry in motor_entries:
                  require(
                      isinstance(entry, dict),
                      "Objet moteurs invalide"
                  )

                  rid = entry.get("id")

                  require(
                      valid_id(rid)
                      and rid in races
                      and rid not in seen_races,
                      f"Course moteurs invalide : {rid}"
                  )

                  seen_races.add(rid)

                  decisions = entry.get("moteurs")

                  require(
                      isinstance(decisions, dict)
                      and bool(decisions),
                      f"Decisions absentes : {rid}"
                  )

                  for motor, decision in decisions.items():
                      require(
                          motor in motors,
                          f"Moteur inconnu : {motor}"
                      )

                      require(
                          isinstance(decision, dict),
                          f"Decision invalide : {rid}/{motor}"
                      )

                      require(
                          decision.get("course_id") == rid
                          and decision.get("statut") == "FIGE",
                          f"FIGE invalide : {rid}/{motor}"
                      )

                      frozen = parse_time(
                          decision.get("fige_a")
                      )

                      require(
                          frozen is not None
                          and frozen < races[rid]["departure"]
                          and frozen <= published,
                          f"Chronologie FIGE invalide : {rid}/{motor}"
                      )

                      positions = decision.get("positions")

                      require(
                          isinstance(positions, list)
                          and len(positions) == 5,
                          f"Cinq positions requises : {rid}/{motor}"
                      )

                      require(
                          all(
                              positive_int(n)
                              for n in positions
                          ),
                          f"Numero predit invalide : {rid}/{motor}"
                      )

                      require(
                          len(set(positions)) == 5,
                          f"Positions dupliquees : {rid}/{motor}"
                      )

                      require(
                          set(positions).issubset(
                              races[rid]["active"]
                          ),
                          f"Cheval NP ou inconnu : {rid}/{motor}"
                      )

                      decisions_count += 1

              print(
                  "FIGEs structurellement valides :",
                  decisions_count
              )

              print(
                  "ATTENTION - Horodatages declares "
                  "non certifies historiquement"
              )

          print("Validation statique JSON : OK")
          PY

      - name: "Verifier syntaxe JavaScript"
        run: |
          set -euo pipefail

          node - <<'JS'
          const fs = require("node:fs");
          const vm = require("node:vm");
          const { spawnSync } = require("node:child_process");

          const html = fs.readFileSync(
            "index.html", "utf8"
          );

          const scripts = [
            ...html.matchAll(
              /<script\b([^>]*)>([\s\S]*?)<\/script>/gi
            )
          ];

          if (!scripts.length) {
            throw new Error("Aucun script JavaScript");
          }

          let checked = 0;

          for (const [, attrs, source] of scripts) {
            if (/\bsrc\s*=/i.test(attrs)) {
              continue;
            }

            const typeMatch = attrs.match(
              /\btype\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/i
            );

            const type = (
              typeMatch?.[1] ??
              typeMatch?.[2] ??
              typeMatch?.[3] ??
              ""
            ).toLowerCase();

            if (
              type &&
              type !== "module" &&
              type !== "text/javascript" &&
              type !== "application/javascript"
            ) {
              continue;
            }

            if (type === "module") {
              const result = spawnSync(
                process.execPath,
                ["--input-type=module", "--check"],
                {
                  input: source,
                  encoding: "utf8"
                }
              );

              if (result.status !== 0) {
                throw new Error(
                  result.stderr || "Module invalide"
                );
              }
            } else {
              new vm.Script(source, {
                filename: "index.html"
              });
            }

            checked++;
          }

          console.log(
            `Scripts JavaScript verifies : ${checked}`
          );

          if (checked === 0) {
            console.log(
              "AVERTISSEMENT : aucun script integre executable"
            );
          }
          JS

      - name: "Verifier absence de modifications"
        run: |
          set -euo pipefail

          git diff --exit-code HEAD --
          git diff --cached --exit-code

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Fichiers non suivis detectes"
            exit 1
          fi

          echo "Depot intact : OK"

      - name: "Bilan securise"
        if: success()
        run: |
          {
            echo "## X1000 - Controle affichage V1.4"
            echo ""
            echo "- Portail HTML : controle"
            echo "- Courses PMU : coherence verifiee"
            echo "- Analyses : coherence verifiee"
            echo "- Moteurs M1-M5 : controles si publies"
            echo "- FIGEs : verification structurelle"
            echo "- JavaScript : syntaxe controlee"
            echo "- Depot Git : intact"
            echo "- Publication automatique : aucune"
            echo "- Modification main : aucune"
            echo "- Test navigateur : encore necessaire"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Signaler un echec"
        if: failure()
        run: |
          echo "::error::Controle affichage V1.4 echoue"
          echo "Ne pas fusionner vers main."
          echo "Consulter les journaux GitHub Actions."
