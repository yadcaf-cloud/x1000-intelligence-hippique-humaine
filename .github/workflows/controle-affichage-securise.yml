name: "X1000 - Controle affichage securise V1.3"

on:
  workflow_dispatch:

  push:
    branches:
      - "feature/activation-pmu-analyses-archives"
    paths:
      - "index.html"
      - "data/publication_courses.json"
      - "data/publication_analyses.json"
      - "data/publication_moteurs.json"
      - ".github/workflows/controle-affichage-securise.yml"

  pull_request:
    branches:
      - "main"
    paths:
      - "index.html"
      - "data/publication_courses.json"
      - "data/publication_analyses.json"
      - "data/publication_moteurs.json"
      - ".github/workflows/controle-affichage-securise.yml"

permissions:
  contents: read

concurrency:
  group: x1000-affichage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controle:
    name: "Validation PMU, analyses et M1-M5"

    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/feature/activation-pmu-analyses-archives') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/feature/activation-pmu-analyses-archives') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'feature/activation-pmu-analyses-archives' &&
       github.base_ref == 'main')

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"

    steps:
      - name: "Recuperer le code"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Installer Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verifier le portail et les publications"
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          MOTORS = ("M1", "M2", "M3", "M4", "M5")
          COURSE_PATTERN = (
              r"\d{4}-\d{2}-\d{2}-R[1-9]\d*-C[1-9]\d*"
          )

          def require(condition, message):
              if not condition:
                  raise AssertionError(message)

          def is_object(value):
              return isinstance(value, dict)

          def is_text(value):
              return (
                  isinstance(value, str)
                  and bool(value.strip())
              )

          def is_number(value):
              return type(value) is int and value > 0

          def parse_date(value):
              if not isinstance(value, str):
                  return None
              try:
                  result = datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  )
                  if (
                      result.tzinfo is None
                      or result.utcoffset() is None
                  ):
                      return None
                  return result
              except ValueError:
                  return None

          def load_json(path):
              file = Path(path)
              require(
                  file.is_file(),
                  f"Fichier absent : {path}"
              )
              raw = file.read_bytes()
              data = json.loads(raw)
              require(
                  is_object(data),
                  f"Objet JSON invalide : {path}"
              )
              return data, raw

          def valid_id(value):
              return (
                  is_text(value)
                  and re.fullmatch(
                      COURSE_PATTERN, value
                  ) is not None
              )

          print("=== X1000 SECURISE V1.3 ===")

          # 1. PORTAIL HTML

          page = Path("index.html")
          require(
              page.is_file(),
              "index.html absent"
          )

          html = page.read_text(
              encoding="utf-8"
          )

          for section in (
              "pmu",
              "analyses",
              "moteurs",
              "figes",
              "archives",
          ):
              require(
                  re.search(
                      rf'\bid\s*=\s*["\']{section}["\']',
                      html
                  ) is not None,
                  f"Section HTML absente : {section}"
              )

          for token in (
              "data/publication_courses.json",
              "data/publication_analyses.json",
              "data/publication_moteurs.json",
              "renderCourses",
              "renderAnalyses",
              "renderMotors",
              "fetchJSON",
          ):
              require(
                  token in html,
                  f"Fonction ou source absente : {token}"
              )

          require(
              "fetchSource" in html
              or "fetchCourses" in html,
              "Chargement des courses absent"
          )

          for motor in MOTORS:
              require(
                  re.search(
                      rf'\b{motor}\s*:',
                      html
                  ) is not None,
                  f"Moteur non declare : {motor}"
              )

          print(
              "OK - Portail et M1-M5 declares"
          )

          # 2. COURSES PMU

          source, raw = load_json(
              "data/publication_courses.json"
          )

          require(
              source.get("statut") in (
                  "OK", "PARTIEL"
              ),
              "Statut PMU invalide"
          )

          require(
              parse_date(
                  source.get("collecte_a")
              ) is not None,
              "Horodatage collecte invalide"
          )

          race_list = source.get("courses")

          require(
              isinstance(race_list, list),
              "Liste courses invalide"
          )

          date_label = source.get("date")

          if date_label is not None:
              require(
                  isinstance(date_label, str)
                  and re.fullmatch(
                      r"\d{4}-\d{2}-\d{2}",
                      date_label
                  ) is not None,
                  "Date publication invalide"
              )

          races = {}

          for race in race_list:
              require(
                  is_object(race),
                  "Course non conforme"
              )

              rid = race.get("id")

              require(
                  valid_id(rid),
                  f"Identifiant invalide : {rid}"
              )

              require(
                  rid not in races,
                  f"Course dupliquee : {rid}"
              )

              require(
                  race.get(
                      "localisation_france_verifiee"
                  ) is True,
                  f"France non verifiee : {rid}"
              )

              require(
                  race.get("depart_verifie") is True,
                  f"Depart non verifie : {rid}"
              )

              departure = parse_date(
                  race.get("depart")
              )

              require(
                  departure is not None,
                  f"Depart invalide : {rid}"
              )

              paris_day = departure.astimezone(
                  ZoneInfo("Europe/Paris")
              ).date().isoformat()

              require(
                  rid[:10] == paris_day,
                  f"Date course incoherente : {rid}"
              )

              if date_label is not None:
                  require(
                      rid[:10] == date_label,
                      f"Date publication incoherente : {rid}"
                  )

              require(
                  is_text(race.get("discipline")),
                  f"Discipline absente : {rid}"
              )

              horses_list = race.get("partants")

              require(
                  isinstance(horses_list, list)
                  and bool(horses_list),
                  f"Chevaux absents : {rid}"
              )

              horses = {}
              nonrunners = set()

              for horse in horses_list:
                  require(
                      is_object(horse),
                      f"Cheval invalide : {rid}"
                  )

                  number = horse.get("numero")

                  require(
                      is_number(number),
                      f"Numero invalide : {rid}"
                  )

                  require(
                      number not in horses,
                      f"Numero duplique : {rid}/{number}"
                  )

                  require(
                      is_text(horse.get("nom")),
                      f"Nom absent : {rid}/{number}"
                  )

                  require(
                      type(
                          horse.get("non_partant")
                      ) is bool,
                      f"Statut NP invalide : {rid}/{number}"
                  )

                  horses[number] = horse["nom"]

                  if horse["non_partant"]:
                      nonrunners.add(number)

              active = set(horses) - nonrunners

              require(
                  bool(active),
                  f"Aucun partant actif : {rid}"
              )

              declared = race.get("non_partants")

              require(
                  isinstance(declared, list),
                  f"Liste NP invalide : {rid}"
              )

              declared_numbers = set()

              for item in declared:
                  number = (
                      item.get("numero")
                      if is_object(item)
                      else item
                  )

                  require(
                      is_number(number),
                      f"Numero NP invalide : {rid}"
                  )

                  require(
                      number not in declared_numbers,
                      f"NP duplique : {rid}/{number}"
                  )

                  declared_numbers.add(number)

                  if (
                      is_object(item)
                      and "nom" in item
                  ):
                      require(
                          item["nom"] == horses.get(number),
                          f"Nom NP incoherent : {rid}/{number}"
                      )

              require(
                  declared_numbers == nonrunners,
                  f"NP incoherents : {rid}"
              )

              for field, expected in (
                  ("nombre_partants", len(active)),
                  ("nombre_participants", len(horses)),
              ):
                  if field in race:
                      require(
                          type(race[field]) is int
                          and race[field] == expected,
                          f"{field} incoherent : {rid}"
                      )

              races[rid] = {
                  "horses": horses,
                  "active": active,
                  "departure": departure,
                  "departure_raw": race["depart"],
                  "discipline": race["discipline"],
              }

          print(
              f"OK - {len(races)} courses controlees"
          )

          if not races:
              print(
                  "INFO - Aucune course exploitable publiee"
              )

          # 3. ANALYSES DESCRIPTIVES

          analysis, _ = load_json(
              "data/publication_analyses.json"
          )

          digest = hashlib.sha256(raw).hexdigest()

          require(
              analysis.get("statut")
              == "DESCRIPTIF_SANS_PRONOSTIC",
              "Statut analyses invalide"
          )

          analysis_hash = analysis.get(
              "source_sha256"
          )

          require(
              isinstance(analysis_hash, str)
              and analysis_hash.lower() == digest,
              "SHA256 analyses incompatible"
          )

          entries = analysis.get("courses")

          require(
              isinstance(entries, list),
              "Liste analyses invalide"
          )

          seen = set()

          for entry in entries:
              require(
                  is_object(entry),
                  "Objet analyse invalide"
              )

              rid = entry.get("id")

              require(
                  valid_id(rid),
                  "Identifiant analyse invalide"
              )

              require(
                  rid in races and rid not in seen,
                  f"Analyse inconnue/dupliquee : {rid}"
              )

              seen.add(rid)
              ref = races[rid]

              if "depart" in entry:
                  require(
                      entry["depart"]
                      == ref["departure_raw"],
                      f"Depart analyse incoherent : {rid}"
                  )

              if "discipline" in entry:
                  require(
                      entry["discipline"]
                      == ref["discipline"],
                      f"Discipline analyse incoherente : {rid}"
                  )

              for forbidden in (
                  "selection", "fige", "resultat"
              ):
                  require(
                      entry.get(forbidden) is None,
                      f"Pronostic inattendu : {rid}"
                  )

              horses_list = entry.get("chevaux")

              require(
                  isinstance(horses_list, list),
                  f"Chevaux analyse invalides : {rid}"
              )

              used = set()

              for horse in horses_list:
                  require(
                      is_object(horse),
                      f"Cheval analyse invalide : {rid}"
                  )

                  number = horse.get("numero")

                  require(
                      is_number(number),
                      f"Numero analyse invalide : {rid}"
                  )

                  require(
                      number not in used,
                      f"Analyse dupliquee : {rid}/{number}"
                  )

                  require(
                      horse.get("nom")
                      == ref["horses"].get(number),
                      f"Cheval analyse incoherent : {rid}/{number}"
                  )

                  require(
                      horse.get(
                          "evaluation_sportive",
                          "NON_EVALUE"
                      ) == "NON_EVALUE",
                      f"Evaluation inattendue : {rid}/{number}"
                  )

                  used.add(number)

              require(
                  used == set(ref["horses"]),
                  f"Chevaux manquants : {rid}"
              )

          print(
              f"OK - {len(seen)} analyses descriptives"
          )

          # 4. PUBLICATIONS DES CINQ MOTEURS

          motor_path = Path(
              "data/publication_moteurs.json"
          )

          if not motor_path.exists():
              print(
                  "INFO - Publication moteurs absente"
              )
              print(
                  "INFO - Aucun FIGE invente ou suppose"
              )

          else:
              publication, _ = load_json(
                  str(motor_path)
              )

              require(
                  publication.get("statut")
                  == "PUBLICATION_MOTEURS",
                  "Statut moteurs invalide"
              )

              motor_hash = publication.get(
                  "source_sha256"
              )

              require(
                  isinstance(motor_hash, str)
                  and motor_hash.lower() == digest,
                  "SHA256 moteurs incompatible"
              )

              published = parse_date(
                  publication.get("publie_a")
              )

              require(
                  published is not None,
                  "Date publication moteurs invalide"
              )

              motor_entries = publication.get(
                  "courses"
              )

              require(
                  isinstance(motor_entries, list),
                  "Liste courses moteurs invalide"
              )

              used_races = set()
              total_decisions = 0
              present_motors = set()

              for entry in motor_entries:
                  require(
                      is_object(entry),
                      "Objet moteurs invalide"
                  )

                  rid = entry.get("id")

                  require(
                      valid_id(rid),
                      "ID course moteurs invalide"
                  )

                  require(
                      rid in races
                      and rid not in used_races,
                      f"Course moteurs invalide : {rid}"
                  )

                  used_races.add(rid)

                  decisions = entry.get(
                      "moteurs"
                  )

                  require(
                      is_object(decisions)
                      and bool(decisions),
                      f"Decisions absentes : {rid}"
                  )

                  for motor, decision in decisions.items():
                      require(
                          motor in MOTORS,
                          f"Moteur inconnu : {rid}/{motor}"
                      )

                      require(
                          is_object(decision),
                          f"Decision invalide : {rid}/{motor}"
                      )

                      require(
                          decision.get("course_id") == rid
                          and decision.get("statut") == "FIGE",
                          f"FIGE non conforme : {rid}/{motor}"
                      )

                      frozen = parse_date(
                          decision.get("fige_a")
                      )

                      require(
                          frozen is not None,
                          f"Date FIGE invalide : {rid}/{motor}"
                      )

                      require(
                          frozen < races[rid]["departure"]
                          and frozen <= published,
                          f"Chronologie FIGE incoherente : {rid}/{motor}"
                      )

                      positions = decision.get(
                          "positions"
                      )

                      require(
                          isinstance(positions, list)
                          and len(positions) == 5,
                          f"Cinq positions requises : {rid}/{motor}"
                      )

                      require(
                          all(
                              is_number(n)
                              for n in positions
                          ),
                          f"Numero predit invalide : {rid}/{motor}"
                      )

                      require(
                          len(set(positions)) == 5,
                          f"Positions dupliquees : {rid}/{motor}"
                      )

                      require(
                          set(positions).issubset(
                              races[rid]["active"]
                          ),
                          f"Cheval NP/inconnu : {rid}/{motor}"
                      )

                      total_decisions += 1
                      present_motors.add(motor)

              print(
                  f"OK - {total_decisions} FIGEs "
                  "structurellement coherents"
              )

              for motor in MOTORS:
                  if motor in present_motors:
                      print(
                          f"INFO - {motor} : publication presente"
                      )
                  else:
                      print(
                          f"INFO - {motor} : aucun FIGE publie"
                      )

              print(
                  "ATTENTION - Horodatages declares "
                  "non certifies historiquement"
              )

          print(
              "OK - Controle statique termine"
          )
          PY

      - name: "Verifier la syntaxe JavaScript"
        run: |
          set -euo pipefail

          node - <<'JS'
          const fs = require("node:fs");
          const vm = require("node:vm");

          const html = fs.readFileSync(
            "index.html",
            "utf8"
          );

          const scripts = [
            ...html.matchAll(
              /<script\b([^>]*)>([\s\S]*?)<\/script>/gi
            )
          ];

          if (!scripts.length) {
            throw new Error(
              "Aucun script JavaScript"
            );
          }

          let checked = 0;

          for (const [, attributes, source] of scripts) {
            if (/\bsrc\s*=/i.test(attributes)) {
              continue;
            }

            if (
              /\btype\s*=\s*["'](?:application\/json|importmap)["']/i
                .test(attributes)
            ) {
              continue;
            }

            new vm.Script(source, {
              filename: "index.html"
            });

            checked++;
          }

          if (!checked) {
            throw new Error(
              "Aucun script integre verifie"
            );
          }

          console.log(
            `OK - ${checked} script(s) valide(s)`
          );
          JS

      - name: "Bilan securise"
        if: success()
        run: |
          echo "====================================="
          echo "X1000 PHOENIX - CONTROLE V1.3"
          echo "====================================="
          echo "Portail HTML : controle statique"
          echo "Courses PMU : coherence controlee"
          echo "Analyses : coherence controlee"
          echo "M1 M2 M3 M4 M5 : pris en compte"
          echo "FIGEs : controles si publies"
          echo "Aucune donnee fictive"
          echo "Aucune publication automatique"
          echo "Aucune modification des archives"
          echo "Aucune fusion vers main"
          echo "Test navigateur encore necessaire"
          echo "====================================="
