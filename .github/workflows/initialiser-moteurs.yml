name: "X1000 - Initialisation moteurs M1-M5 securisee V1.3"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x1000-initialisation-moteurs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  initialiser-moteurs:
    name: "Initialisation securisee M1-M5 sans FIGE"

    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/feature/activation-pmu-analyses-archives' &&
      github.repository == 'yadcaf-cloud/x1000-intelligence-hippique-humaine'

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONNOUSERSITE: "1"
      BRANCHE: feature/activation-pmu-analyses-archives
      SOURCE: data/publication_courses.json
      DESTINATION: data/publication_moteurs.json

    steps:
      - name: "Recuperer le commit securise"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: "Verifier le contexte"
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = "refs/heads/$BRANCHE"
          test "$GITHUB_REPOSITORY" = \
            "yadcaf-cloud/x1000-intelligence-hippique-humaine"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          test -f initialiser_publication_moteurs.py
          test ! -L initialiser_publication_moteurs.py

          test -f "$SOURCE"
          test ! -L "$SOURCE"

          if test -e "$DESTINATION" || test -L "$DESTINATION"; then
            echo "::error::Publication moteurs deja existante"
            exit 1
          fi

          if test -n "$(git status --porcelain)"; then
            echo "::error::Arbre Git non propre"
            exit 1
          fi

          echo "OK - Contexte securise"

      - name: "Installer Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: "Verifier la syntaxe Python"
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path("initialiser_publication_moteurs.py")
          compile(
              path.read_text(encoding="utf-8"),
              str(path),
              "exec"
          )
          print("OK - Syntaxe Python")
          PY

      - name: "Memoriser la source PMU"
        id: source
        run: |
          set -euo pipefail

          HASH="$(sha256sum "$SOURCE" | cut -d ' ' -f 1)"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

          echo "OK - Empreinte SHA256 memorisee"

      - name: "Initialiser la publication"
        run: |
          set -euo pipefail

          python initialiser_publication_moteurs.py

          test -f "$DESTINATION"
          test ! -L "$DESTINATION"

          echo "OK - Publication initiale creee"

      - name: "Valider strictement le JSON"
        env:
          EXPECTED_HASH: ${{ steps.source.outputs.hash }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os

          from datetime import datetime, timezone
          from pathlib import Path

          source = Path("data/publication_courses.json")
          dest = Path("data/publication_moteurs.json")

          def require(condition, message):
              if not condition:
                  raise SystemExit("ERREUR - " + message)

          require(
              source.is_file() and not source.is_symlink(),
              "Source invalide"
          )
          require(
              dest.is_file() and not dest.is_symlink(),
              "Destination invalide"
          )

          raw = source.read_bytes()
          digest = hashlib.sha256(raw).hexdigest()

          require(
              digest == os.environ["EXPECTED_HASH"],
              "Empreinte source modifiee"
          )

          courses = json.loads(raw.decode("utf-8"))
          publication = json.loads(dest.read_text("utf-8"))

          require(isinstance(courses, dict), "Source invalide")
          require(isinstance(publication, dict), "JSON invalide")
          require(
              courses.get("statut") in ("OK", "PARTIEL"),
              "Statut PMU invalide"
          )

          require(
              set(publication) == {
                  "version",
                  "statut",
                  "date",
                  "source",
                  "source_sha256",
                  "publie_a",
                  "courses"
              },
              "Champs de publication invalides"
          )

          require(
              publication["version"] == "X1000-MOTEURS-1.0",
              "Version incorrecte"
          )
          require(
              publication["statut"] == "PUBLICATION_MOTEURS",
              "Statut moteurs incorrect"
          )
          require(
              publication["source"] == source.as_posix(),
              "Chemin source incorrect"
          )
          require(
              publication["source_sha256"] == digest,
              "SHA256 incorrect"
          )
          require(
              publication["date"] == courses.get("date"),
              "Date incorrecte"
          )
          require(
              publication["courses"] == [],
              "Decisions FIGEES interdites a l'initialisation"
          )

          published = datetime.fromisoformat(
              publication["publie_a"].replace("Z", "+00:00")
          )
          require(
              published.utcoffset() is not None,
              "Fuseau horaire absent"
          )

          age = (
              datetime.now(timezone.utc) - published
          ).total_seconds()
          require(
              -60 <= age <= 900,
              "Horodatage incoherent"
          )

          print("OK - JSON conforme")
          print("OK - SHA256 conforme")
          print("OK - Zero FIGE fictif")
          PY

      - name: "Verifier les modifications exclusives"
        run: |
          set -euo pipefail

          git diff --exit-code
          git diff --cached --exit-code

          UNTRACKED="$(git ls-files --others --exclude-standard)"

          if test "$UNTRACKED" != "$DESTINATION"; then
            echo "::error::Fichiers non autorises"
            exit 1
          fi

          git add -- "$DESTINATION"

          STATUS="$(git diff --cached --name-status)"
          EXPECTED="$(printf 'A\t%s' "$DESTINATION")"

          if test "$STATUS" != "$EXPECTED"; then
            echo "::error::Modification non autorisee"
            exit 1
          fi

          echo "OK - Creation exclusive du JSON"

      - name: "Verifier la branche distante"
        run: |
          set -euo pipefail

          git fetch --no-tags origin "refs/heads/$BRANCHE"

          LOCAL="$(git rev-parse HEAD)"
          REMOTE="$(git rev-parse FETCH_HEAD)"

          if test "$LOCAL" != "$REMOTE"; then
            echo "::error::Branche distante modifiee"
            exit 1
          fi

          echo "OK - Branche distante inchangee"

      - name: "Creer le commit"
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "X1000: initialiser M1-M5 sans FIGE fictif"

      - name: "Publier uniquement sur branche securisee"
        run: |
          set -euo pipefail

          git fetch --no-tags origin "refs/heads/$BRANCHE"

          REMOTE="$(git rev-parse FETCH_HEAD)"
          PARENT="$(git rev-parse HEAD^)"

          if test "$REMOTE" != "$PARENT"; then
            echo "::error::Branche distante modifiee"
            exit 1
          fi

          git push origin "HEAD:refs/heads/$BRANCHE"

          echo "OK - Publication branche securisee"
          echo "OK - Aucune fusion vers main"

      - name: "Bilan final"
        if: success()
        run: |
          echo "=================================="
          echo "X1000 - INITIALISATION M1-M5 V1.3"
          echo "=================================="
          echo "Source PMU : validee"
          echo "Publication moteurs : initialisee"
          echo "Decisions FIGEES : aucune"
          echo "Archives : inchangees"
          echo "Branche main : inchangee"
          echo "=================================="
