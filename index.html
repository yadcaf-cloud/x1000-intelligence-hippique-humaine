<script>
"use strict";

(() => {
  const $ = id => document.getElementById(id);

  const CONFIG = Object.freeze({
    courses: "data/publication_courses.json",
    analyses: "data/publication_analyses.json",
    timeout: 15000,
    freshness: 3 * 60 * 60 * 1000,
    futureTolerance: 5 * 60 * 1000
  });

  const COURSE_ID = /^\d{4}-\d{2}-\d{2}-R[1-9]\d*-C[1-9]\d*$/;
  const ISO_ZONE = /(Z|[+-]\d{2}:\d{2})$/i;

  let courses = [];
  let analyses = [];
  let loading = false;

  const str = value =>
    typeof value === "string" ? value.trim() : "";

  const normalize = value =>
    String(value ?? "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase();

  function element(tag, value) {
    const node = document.createElement(tag);
    node.textContent = String(value ?? "");
    return node;
  }

  function validDate(value) {
    return str(value) &&
      ISO_ZONE.test(value) &&
      Number.isFinite(Date.parse(value));
  }

  function formatParis(value) {
    if (!validDate(value)) return "Non renseigné";

    return new Intl.DateTimeFormat("fr-FR", {
      timeZone: "Europe/Paris",
      dateStyle: "short",
      timeStyle: "short"
    }).format(new Date(value));
  }

  function setStatus(id, message, type = "") {
    const node = $(id);
    node.className = "notice" + (type ? " " + type : "");
    node.textContent = message;
  }

  async function fetchJSON(path) {
    const controller = new AbortController();
    const timer = setTimeout(
      () => controller.abort(),
      CONFIG.timeout
    );

    try {
      const url = new URL(path, document.baseURI);
      url.searchParams.set("v", String(Date.now()));

      const response = await fetch(url.href, {
        cache: "no-store",
        signal: controller.signal
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      return await response.json();
    } finally {
      clearTimeout(timer);
    }
  }

  function validCourse(course) {
    if (!course || typeof course !== "object") {
      return false;
    }

    if (
      !COURSE_ID.test(str(course.id)) ||
      course.localisation_france_verifiee !== true ||
      course.depart_verifie !== true ||
      !str(course.discipline) ||
      !validDate(course.depart) ||
      !Array.isArray(course.partants) ||
      !Array.isArray(course.non_partants)
    ) {
      return false;
    }

    // L'identifiant et le départ doivent
    // désigner la même date civile à Paris.
    const parisDate = new Intl.DateTimeFormat(
      "en-CA", {
        timeZone: "Europe/Paris",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }
    ).format(new Date(course.depart));

    if (course.id.slice(0, 10) !== parisDate) {
      return false;
    }

    const numbers = new Set();
    const inactive = new Set();

    for (const horse of course.partants) {
      if (
        !horse ||
        !Number.isSafeInteger(horse.numero) ||
        horse.numero <= 0 ||
        !str(horse.nom) ||
        typeof horse.non_partant !== "boolean" ||
        numbers.has(horse.numero)
      ) {
        return false;
      }

      numbers.add(horse.numero);

      if (horse.non_partant) {
        inactive.add(horse.numero);
      }
    }

    const declared = new Set();

    for (const item of course.non_partants) {
      // Format attendu : [{ numero: 3 }, ...]
      if (
        !item ||
        !Number.isSafeInteger(item.numero) ||
        !inactive.has(item.numero) ||
        declared.has(item.numero)
      ) {
        return false;
      }

      declared.add(item.numero);
    }

    if (declared.size !== inactive.size) {
      return false;
    }

    return (
      Number.isSafeInteger(course.nombre_partants) &&
      course.nombre_partants ===
        course.partants.length - inactive.size
    );
  }

  function renderCourses() {
    const container = $("courseCards");
    container.replaceChildren();

    const query = normalize($("search").value);
    const discipline = $("discipline").value;

    const visible = courses.filter(course => {
      if (
        discipline &&
        course.discipline !== discipline
      ) {
        return false;
      }

      const searchable = normalize([
        course.id,
        course.nom,
        course.hippodrome,
        course.discipline,
        ...course.partants.map(h => h.nom)
      ].join(" "));

      return searchable.includes(query);
    });

    $("count").textContent =
      `${visible.length} course(s) sur ${courses.length}`;

    if (!visible.length) {
      container.append(
        element("p", "Aucune course correspondante.")
      );
      return;
    }

    for (const course of visible) {
      const card = document.createElement("article");
      card.className = "card";

      card.append(
        element(
          "h3",
          `${str(course.nom) || "Course"} — ${course.id}`
        )
      );

      const badge = element(
        "span",
        "FRANCE — INDICATEUR SOURCE VALIDÉ"
      );
      badge.className = "chip";
      card.append(badge);

      card.append(
        element(
          "p",
          "Hippodrome : " +
          (str(course.hippodrome) || "Non renseigné")
        ),
        element(
          "p",
          "Discipline : " + course.discipline
        ),
        element(
          "p",
          "Départ Paris : " + formatParis(course.depart)
        ),
        element(
          "p",
          "Partants actifs : " + course.nombre_partants
        )
      );

      const details = document.createElement("details");
      const summary = element("summary", "Voir les chevaux");
      const list = document.createElement("ul");

      for (const horse of course.partants) {
        list.append(
          element(
            "li",
            `${horse.numero} — ${horse.nom}` +
            (horse.non_partant ? " (NON-PARTANT)" : "")
          )
        );
      }

      details.append(summary, list);
      card.append(details);
      container.append(card);
    }
  }

  function updateDisciplines() {
    const select = $("discipline");
    const previous = select.value;

    select.replaceChildren(
      new Option("Toutes les disciplines", "")
    );

    const names = [...new Set(
      courses.map(c => c.discipline)
    )].sort();

    for (const name of names) {
      select.add(new Option(name, name));
    }

    if (names.includes(previous)) {
      select.value = previous;
    }
  }

  async function loadCourses() {
    setStatus("coursesStatus", "Chargement des courses…");

    try {
      const data = await fetchJSON(CONFIG.courses);

      if (
        !data ||
        !Array.isArray(data.courses) ||
        !["OK", "PARTIEL"].includes(data.statut) ||
        !validDate(data.collecte_a)
      ) {
        throw new Error("Publication PMU non validée.");
      }

      const age = Date.now() - Date.parse(data.collecte_a);

      if (age < -CONFIG.futureTolerance) {
        throw new Error(
          "Horodatage de collecte situé dans le futur."
        );
      }

      const ids = new Set();
      const verified = [];

      for (const course of data.courses) {
        if (!validCourse(course) || ids.has(course.id)) {
          continue;
        }

        ids.add(course.id);
        verified.push(course);
      }

      courses = verified.sort(
        (a, b) =>
          Date.parse(a.depart) - Date.parse(b.depart)
      );

      updateDisciplines();
      renderCourses();

      const recent =
        age >= -CONFIG.futureTolerance &&
        age <= CONFIG.freshness;

      const rejected = data.courses.length - courses.length;

      const message =
        `${courses.length} course(s) validée(s) pour affichage. ` +
        `Collecte : ${formatParis(data.collecte_a)}. ` +
        `Statut source : ${data.statut}. ` +
        (recent ? "Collecte récente." : "Données anciennes.") +
        (rejected ? ` ${rejected} entrée(s) écartée(s).` : "");

      setStatus(
        "coursesStatus",
        message,
        recent && data.statut === "OK" && rejected === 0
          ? "success"
          : ""
      );

      $("dCourses").textContent =
        `${courses.length} course(s) affichable(s). ` +
        (recent ? "Collecte récente." : "Collecte ancienne.");

    } catch (error) {
      courses = [];
      updateDisciplines();
      renderCourses();

      setStatus(
        "coursesStatus",
        "Données PMU indisponibles : " + error.message,
        "error"
      );

      $("dCourses").textContent = "Collecte indisponible.";
    }
  }

  function validAnalysis(item) {
    return (
      item &&
      typeof item === "object" &&
      !Array.isArray(item) &&
      COURSE_ID.test(
        str(item.course_id) || str(item.id)
      )
    );
  }

  async function loadAnalyses() {
    const container = $("analysisCards");
    container.replaceChildren();

    setStatus(
      "analysisStatus",
      "Chargement des analyses…"
    );

    try {
      const data = await fetchJSON(CONFIG.analyses);

      const entries = Array.isArray(data)
        ? data
        : data && Array.isArray(data.analyses)
          ? data.analyses
          : null;

      if (!entries) {
        throw new Error(
          "Format des analyses non reconnu."
        );
      }

      analyses = entries.filter(validAnalysis);

      const rejected = entries.length - analyses.length;

      setStatus(
        "analysisStatus",
        `${analyses.length} référence(s) d'analyse publiée(s).` +
        (rejected ? ` ${rejected} entrée(s) écartée(s).` : "") +
        " Contenu sportif non certifié par cette interface."
      );

      $("dAnalyses").textContent =
        `${analyses.length} référence(s) lisible(s).`;

      if (!analyses.length) {
        container.append(
          element("p", "Aucune analyse affichable.")
        );
        return;
      }

      for (const item of analyses.slice(0, 30)) {
        const card = document.createElement("article");
        card.className = "card";

        card.append(
          element(
            "h3",
            str(item.course_id) || str(item.id)
          ),
          element(
            "p",
            "Statut déclaré : " +
            (str(item.statut) ||
             str(item.status) ||
             "Non renseigné")
          )
        );

        // Les sélections ne sont pas inventées.
        // Aucun statut FIGÉ n'est déduit.
        if (validDate(item.analyse_a)) {
          card.append(
            element(
              "p",
              "Analyse datée : " +
              formatParis(item.analyse_a)
            )
          );
        }

        container.append(card);
      }

    } catch (error) {
      analyses = [];
      container.replaceChildren();

      setStatus(
        "analysisStatus",
        "Analyses non affichables : " + error.message,
        "error"
      );

      $("dAnalyses").textContent = "Non vérifiées.";
    }
  }

  function loadArchives() {
    // Aucun fichier d'index d'archives n'est
    // présumé sans contrat JSON documenté.
    setStatus(
      "archivesStatus",
      "Index public des archives non configuré. " +
      "Aucune arrivée officielle n'est déduite " +
      "des analyses ou des courses."
    );

    $("dArchives").textContent =
      "Connexion des archives à finaliser.";
  }

  async function reloadAll() {
    if (loading) return;

    loading = true;
    $("reload").disabled = true;

    try {
      await Promise.all([
        loadCourses(),
        loadAnalyses()
      ]);
      loadArchives();
    } finally {
      loading = false;
      $("reload").disabled = false;
    }
  }

  $("reload").addEventListener("click", reloadAll);
  $("search").addEventListener("input", renderCourses);
  $("discipline").addEventListener(
    "change",
    renderCourses
  );

  $("year").textContent = new Date().getFullYear();

  reloadAll();
})();
</script>
